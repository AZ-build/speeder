<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0420">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Speeder">
<meta name="description" content="Neon hover-speeder run. Drag to steer, guns fire on their own.">
<title>Speeder</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0420;
    --pink: #ff2bd6;
    --cyan: #29f3ff;
    --yellow: #ffd23c;
    --red: #ff2b4e;
    --text: #efe6ff;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: 'Orbitron', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color: #fff;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
  }
  #safe {
    position: fixed;
    top: 0;
    left: 0;
    width: 0;
    height: env(safe-area-inset-top, 0px);
    visibility: hidden;
    pointer-events: none;
  }
  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
    pointer-events: none;
    padding: calc(env(safe-area-inset-top, 0px) + 24px) 20px calc(env(safe-area-inset-bottom, 0px) + 24px);
    box-sizing: border-box;
  }
  .hidden { display: none !important; }
  .spacer { flex: 1 1 auto; min-height: 150px; }
  #title {
    justify-content: flex-start;
    padding-top: calc(env(safe-area-inset-top, 0px) + 11vh);
    background: linear-gradient(to bottom, rgba(8, 2, 24, 0.55), rgba(8, 2, 24, 0) 40%, rgba(8, 2, 24, 0) 55%, rgba(8, 2, 24, 0.75));
  }
  .logo {
    font-weight: 800;
    font-style: italic;
    font-size: clamp(46px, 15vw, 104px);
    letter-spacing: 0.05em;
    line-height: 1;
    background: linear-gradient(180deg, #fffbe0 0%, #ffd23c 32%, #ff2bd6 68%, #8a3cff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 14px rgba(255, 43, 214, 0.75));
    padding: 0 0.1em;
  }
  .logo.small { font-size: clamp(34px, 10vw, 64px); }
  .tag {
    font-size: 12px;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: var(--cyan);
    text-shadow: 0 0 8px var(--cyan);
    margin-right: -0.5em;
  }
  .how {
    margin-top: 18px;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 16px;
    line-height: 1.9;
    color: var(--text);
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
  }
  .how b { color: #fff; }
  .cta {
    margin-top: 20px;
    font-size: 15px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--yellow);
    text-shadow: 0 0 10px rgba(255, 210, 60, 0.6);
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.3; } }
  .best {
    font-size: 12px;
    letter-spacing: 0.2em;
    color: #cbb7ff;
  }
  .install {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 13px;
    color: #bfaee6;
    max-width: 300px;
    line-height: 1.5;
  }
  #installBtn {
    pointer-events: auto;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.2em;
    color: var(--cyan);
    background: rgba(41, 243, 255, 0.08);
    border: 1px solid rgba(41, 243, 255, 0.5);
    border-radius: 999px;
    padding: 10px 18px;
    touch-action: manipulation;
  }
  .wrecked {
    font-weight: 800;
    font-style: italic;
    font-size: clamp(40px, 12vw, 80px);
    color: var(--red);
    text-shadow: 0 0 18px var(--red);
    letter-spacing: 0.05em;
  }
  .final {
    font-weight: 800;
    font-size: clamp(38px, 12vw, 68px);
    text-shadow: 0 0 14px rgba(255, 255, 255, 0.4);
  }
  .newbest {
    font-size: 14px;
    letter-spacing: 0.3em;
    color: var(--yellow);
    text-shadow: 0 0 10px var(--yellow);
  }
  .stats {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 15px;
    line-height: 1.8;
    color: var(--text);
  }
  .hud-btn {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 10px);
    width: 40px;
    height: 40px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    background: rgba(20, 6, 40, 0.5);
    color: #fff;
    display: grid;
    place-items: center;
    padding: 0;
    z-index: 5;
    pointer-events: auto;
    touch-action: manipulation;
    cursor: pointer;
  }
  #mute { right: 12px; }
  #pauseBtn { right: 60px; }
  .hud-btn svg { width: 20px; height: 20px; }
  #mute .slash { display: none; }
  #mute.off .slash { display: inline; }
  #mute.off .waves { display: none; }

  /* ---- menus ---- */
  .ui { pointer-events: auto; }
  .overlay.panel {
    pointer-events: auto;
    overflow-y: auto;
    touch-action: pan-y;
    justify-content: safe center;
    background: rgba(8, 2, 24, 0.84);
    z-index: 6;
  }
  .panel-title {
    font-weight: 800;
    font-style: italic;
    font-size: clamp(28px, 9vw, 40px);
    letter-spacing: 0.06em;
    color: #fff;
    text-shadow: 0 0 14px var(--pink);
    margin-bottom: 6px;
  }
  .stack {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: min(320px, 100%);
  }
  .row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .stack .row > .btn { flex: 1; }
  .btn {
    font-family: inherit;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #fff;
    background: rgba(20, 6, 40, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 12px;
    padding: 0 18px;
    min-height: 48px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .btn.primary {
    color: #160626;
    background: var(--yellow);
    border-color: var(--yellow);
    box-shadow: 0 0 18px rgba(255, 210, 60, 0.4);
  }
  .btn.warn { color: var(--red); border-color: rgba(255, 43, 78, 0.6); }
  .btn:disabled { opacity: 0.4; }
  .btn:active { transform: scale(0.97); }
  .btn:focus-visible, .switch:focus-visible, input:focus-visible, .hud-btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .setting {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    min-height: 52px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 16px;
    color: var(--text);
    text-align: left;
  }
  .setting.col { flex-direction: column; align-items: stretch; gap: 8px; padding: 10px 0; }
  .setting small { color: #9c88d8; font-size: 12px; margin-left: 4px; }
  .btn.chip { min-width: 92px; padding: 8px 14px; font-size: 13px; flex: none; }
  .switch {
    -webkit-appearance: none;
    appearance: none;
    flex: none;
    margin: 0;
    width: 50px;
    height: 28px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.18);
    position: relative;
    cursor: pointer;
    transition: background 0.15s;
  }
  .switch::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.15s;
  }
  .switch:checked { background: var(--pink); }
  .switch:checked::after { transform: translateX(22px); }
  input[type=range] { width: 150px; accent-color: var(--pink); touch-action: pan-x; }
  .name-input {
    font-family: inherit;
    font-weight: 800;
    font-size: 18px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-align: center;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid rgba(41, 243, 255, 0.5);
    background: rgba(41, 243, 255, 0.06);
    color: #fff;
    width: 100%;
    box-sizing: border-box;
    -webkit-user-select: text;
    user-select: text;
  }
  .name-input::placeholder { color: rgba(255, 255, 255, 0.35); }
  .tabs { display: flex; gap: 8px; width: min(340px, 100%); }
  .tabs .btn { flex: 1; min-height: 40px; font-size: 11px; }
  .tabs .btn[aria-selected="true"] { color: var(--cyan); border-color: var(--cyan); background: rgba(41, 243, 255, 0.08); }
  .board-list {
    list-style: none;
    margin: 0;
    padding: 0;
    width: min(340px, 100%);
    max-height: 50vh;
    overflow-y: auto;
    touch-action: pan-y;
    font-variant-numeric: tabular-nums;
  }
  .board-list li {
    display: grid;
    grid-template-columns: 2.2em minmax(0, 1fr) auto;
    gap: 10px;
    align-items: center;
    padding: 10px 4px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    font-size: 14px;
  }
  .board-list li.me { color: var(--yellow); }
  .board-list li.top .rank { color: var(--yellow); }
  .board-list .rank { color: #9c88d8; text-align: right; }
  .board-list .nm {
    text-align: left;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .board-list .sc { text-align: right; font-weight: 800; }
  .board-list .sc small { display: block; font-weight: 500; font-size: 10px; color: #9c88d8; }
  .status {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    color: #cdbdf2;
    min-height: 1.5em;
    max-width: 320px;
  }
  #countdown { z-index: 6; }
  #confetti { z-index: 7; pointer-events: none; }
  .wrecked.small { font-size: clamp(22px, 7vw, 34px); opacity: 0.75; }
  .celebrate { display: flex; flex-direction: column; gap: 4px; align-items: center; animation: celebrateIn 0.6s cubic-bezier(0.2, 1.6, 0.4, 1) both; }
  .cel-title {
    font-weight: 800;
    font-style: italic;
    font-size: clamp(26px, 8.5vw, 52px);
    letter-spacing: 0.03em;
    line-height: 1.05;
    animation: celebrateGlow 1.1s ease-in-out infinite;
  }
  .cel-sub { font-size: 11px; letter-spacing: 0.12em; line-height: 1.5; text-transform: uppercase; color: #fff; max-width: 320px; }
  .celebrate.gold .cel-title { color: #ffe680; text-shadow: 0 0 18px #ffd23c, 0 0 40px #ff9d2e; }
  .celebrate.cyan .cel-title { color: #bffcff; text-shadow: 0 0 18px var(--cyan), 0 0 36px #2b8cff; }
  .celebrate.yellow .cel-title { color: var(--yellow); text-shadow: 0 0 16px var(--yellow); }
  .celebrate.pink .cel-title { color: #ffc2f4; text-shadow: 0 0 18px var(--pink); }
  @keyframes celebrateIn { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes celebrateGlow { 50% { filter: brightness(1.35); transform: scale(1.04); } }
  .btn.share { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--cyan); border-color: rgba(41, 243, 255, 0.6); background: rgba(41, 243, 255, 0.08); }
  .btn.share svg { width: 18px; height: 18px; flex: none; }
  .status.small { font-size: 12px; min-height: 0; word-break: break-word; }
  .challenge {
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #ffc2f4;
    border: 1px solid rgba(255, 43, 214, 0.6);
    background: rgba(255, 43, 214, 0.1);
    border-radius: 999px;
    padding: 8px 14px;
    max-width: 320px;
    line-height: 1.4;
  }
  .board-list li.fresh { background: rgba(255, 210, 60, 0.12); }
  .count {
    font-weight: 800;
    font-style: italic;
    font-size: 96px;
    color: var(--yellow);
    text-shadow: 0 0 24px rgba(255, 210, 60, 0.7);
  }
  .version { font-size: 10px; letter-spacing: 0.2em; color: rgba(203, 183, 255, 0.5); }
  @media (prefers-reduced-motion: reduce) {
    .cta, .celebrate, .cel-title { animation: none; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="safe"></div>

<button id="mute" class="hud-btn ui" aria-label="Sound on or off">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/>
    <g class="waves"><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></g>
    <g class="slash"><path d="M16 9l6 6M22 9l-6 6"/></g>
  </svg>
</button>

<button id="pauseBtn" class="hud-btn ui hidden" aria-label="Pause">
  <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
</button>

<div id="title" class="overlay">
  <div class="logo">SPEEDER</div>
  <div class="tag">Neon hover run</div>
  <div class="how">
    <div><b>Drag</b> anywhere to steer</div>
    <div>Your guns fire <b>on their own</b></div>
    <div>Drive through a <b>gate</b> to take its power</div>
    <div>Hit a <b>ramp</b> to jump</div>
  </div>
  <div class="spacer"></div>
  <div class="challenge hidden" id="titleChallenge"></div>
  <div class="cta">Touch to ride</div>
  <div class="best" id="titleBest"></div>
  <div class="row ui">
    <button class="btn" id="titleBoardBtn">Leaderboard</button>
    <button class="btn" id="titleSettingsBtn">Settings</button>
  </div>
  <button id="installBtn" class="hidden ui">INSTALL APP</button>
  <div class="install hidden" id="installHint"></div>
  <div class="version" id="versionTag"></div>
</div>

<div id="over" class="overlay panel hidden">
  <div class="wrecked" id="wrecked">WRECKED</div>
  <div class="celebrate hidden" id="celebrate">
    <div class="cel-title" id="celebrateTitle"></div>
    <div class="cel-sub" id="celebrateSub"></div>
  </div>
  <div class="final" id="finalScore">0</div>
  <div class="newbest hidden" id="newBest">NEW BEST!</div>
  <div class="stats" id="stats"></div>
  <div class="stack hidden" id="nameBox">
    <label for="nameInput" class="status">Put your name on the world leaderboard</label>
    <input id="nameInput" class="name-input" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="YOUR NAME" enterkeyhint="done">
    <button class="btn" id="saveScoreBtn">Save my score</button>
  </div>
  <div class="status" id="saveStatus" aria-live="polite"></div>
  <div class="stack">
    <button class="btn primary" id="againBtn">Ride again</button>
    <button class="btn share" id="shareBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
      Share &amp; challenge
    </button>
    <div class="status small" id="shareStatus" aria-live="polite"></div>
    <div class="row">
      <button class="btn" id="overBoardBtn">Leaderboard</button>
      <button class="btn" id="overSettingsBtn">Settings</button>
    </div>
  </div>
</div>

<div id="menu" class="overlay panel hidden">
  <div class="panel-title">PAUSED</div>
  <div class="stack">
    <button class="btn primary" id="resumeBtn">Resume</button>
    <button class="btn" id="menuBoardBtn">Leaderboard</button>
    <button class="btn" id="menuSettingsBtn">Settings</button>
    <button class="btn warn" id="quitBtn">Quit run</button>
  </div>
</div>

<div id="settings" class="overlay panel hidden">
  <div class="panel-title">SETTINGS</div>
  <div class="stack">
    <div class="setting"><label for="setSound">Sound</label><input type="checkbox" id="setSound" class="switch"></div>
    <div class="setting"><label for="setVolume">Volume</label><input type="range" id="setVolume" min="0" max="100" step="5"></div>
    <div class="setting"><label for="setEngine">Engine hum</label><input type="checkbox" id="setEngine" class="switch"></div>
    <div class="setting"><label for="setHaptics">Vibration <small>Android only</small></label><input type="checkbox" id="setHaptics" class="switch"></div>
    <div class="setting"><label for="setSens">Steering speed <small id="sensLabel"></small></label><input type="range" id="setSens" min="50" max="160" step="10"></div>
    <div class="setting"><label for="setGfx">Graphics <small id="gfxNote"></small></label><button class="btn chip" id="setGfx" type="button">Auto</button></div>
    <div class="setting"><label for="setShake">Screen shake</label><input type="checkbox" id="setShake" class="switch"></div>
    <div class="setting col"><label for="setName">Leaderboard name</label><input id="setName" class="name-input" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="YOUR NAME" enterkeyhint="done"></div>
    <button class="btn primary" id="settingsDone">Done</button>
  </div>
</div>

<div id="board" class="overlay panel hidden">
  <div class="panel-title">LEADERBOARD</div>
  <div class="tabs" role="tablist">
    <button class="btn" id="tabWorld" role="tab" aria-selected="true">World</button>
    <button class="btn" id="tabLocal" role="tab" aria-selected="false">This device</button>
  </div>
  <ol class="board-list" id="boardList"></ol>
  <div class="status" id="boardStatus" aria-live="polite"></div>
  <div class="stack"><button class="btn primary" id="boardBack">Back</button></div>
</div>

<div id="countdown" class="overlay hidden"><div class="count" id="countNum">3</div></div>
<canvas id="confetti" class="hidden" aria-hidden="true"></canvas>

<script>
'use strict';

/* =========================================================
   SPEEDER  v0.5
   One HTML file + manifest + service worker.
   World units: x = left/right, y = up, d = distance forward.
   ========================================================= */

const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const $ = (id) => document.getElementById(id);

// ---------- Tuning ----------
const CAM_H = 2.6;          // camera height above the ground (lower = more 'in the seat')
const PLAYER_Z = 9;         // how far in front of the camera the speeder sits
const SHIP_AT = 0.6;        // where the speeder sits on screen (0 = top, 1 = bottom), portrait
const FAR = 240;            // draw distance
const SPAWN_AHEAD = 250;    // new things appear this far ahead
const TRACK_HALF = 5.5;     // half-width of the track
const PLAYER_HALF_W = 0.3;  // collision half-width (a little forgiving)
const BANK_MAX = 1.15;      // most the speeder rolls in a quick turn (radians, about 65°)
const BANK_GAIN = 0.07;     // how quickly the lean builds with sideways speed
const MAX_HULL = 3;
// Jumps: ramps on the track launch you into the air.
const RAMP_H = 0.8;          // height of the ramp's top edge
const RAMP_LEN = 6;          // how long the ramp is
const RAMP_W = 3.6;          // how wide the ramp is
const JUMP_T = 0.95;         // seconds in the air
const JUMP_G = 16;           // gravity while airborne
const JUMP_VY = (JUMP_G * JUMP_T * JUMP_T / 2 - RAMP_H) / JUMP_T;   // launch speed that lands after JUMP_T
const UNIT_M = 1.4;         // one world unit, in "meters", for display only
const FONT = 'Orbitron, system-ui, -apple-system, sans-serif';
const VERSION = '0.5.1';

// Online leaderboard: Speeder keeps its own list ("speeder_scores") inside the
// Firebase project that ORBit already uses. This key is meant to be public;
// the database rules decide what anyone can read or write.
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyCqMxJV7_hh8AHaSuYUi7QR16apt0QhPiE',
  authDomain: 'orbit-23921.firebaseapp.com',
  projectId: 'orbit-23921',
  storageBucket: 'orbit-23921.firebasestorage.app',
  messagingSenderId: '680718517274',
  appId: '1:680718517274:web:103918e8727a348c837da3',
};
const SCORES = 'speeder_scores';
const FIREBASE_SDK = 'https://www.gstatic.com/firebasejs/10.12.0/';

const COLORS = {
  cyan: '#29f3ff',
  pink: '#ff2bd6',
  purple: '#a64cff',
  yellow: '#ffd23c',
  red: '#ff2b4e',
  orange: '#ff9d2e',
};

const POWERS = {
  shield: { label: 'SHIELD', color: '#29f3ff' },
  weapon: { label: 'GUNS+', color: '#ffd23c' },
  rapid:  { label: 'RAPID', color: '#6dff7a' },

/* ---------- Track shape: curves and hills ----------
   Gameplay never leaves "track space": x = across the track, d = distance along it.
   Collisions, steering and spawning all work in that space, exactly as before.
   Only the drawing bends: every frame we build a small table of how far the track
   has curved sideways (bendX) and up/down (bendY) at each distance ahead, and the
   projection functions sx/sy add those offsets. So rails, obstacles, gates,
   bullets and the speeder can never drift out of line with each other. */
const SEG = 3;                                 // table spacing, in world units
const NS = Math.ceil((FAR + 90) / SEG) + 1;    // table length
const bendX = new Float32Array(NS);
const bendY = new Float32Array(NS);
let bendXEnd = 0, bendYEnd = 0;
let HC = 0;          // track height under the camera (above the ground plane)
let PITCH = 0;       // camera tilt from climbing/descending
let HEADING = 0;     // how far the road has turned since the start (radians), scrolls the sky
let CAM_LIFT = 0;    // the camera rises a little when you jump
const AIM_Z = 40;    // the camera looks a little into each turn
const DRIFT = 0.06;  // how strongly turns push the speeder outward
const curves = [];   // { d0, len, k }   k = curvature (+ bends right)
const hills = [];    // { d0, len, amp } amp = how high the track lifts off the ground
let curveEnd = 0, hillEnd = 0, planHeading = 0;

// 0 -> 1 -> 0 with gentle starts and ends, so bends and hills ease in and out
function bump(t) { return 0.5 - 0.5 * Math.cos(t * 6.283185307); }

function curvAt(d) {
  for (let i = 0; i < curves.length; i++) {
    const c = curves[i];
    if (d < c.d0 + c.len) return d < c.d0 ? 0 : c.k * bump((d - c.d0) / c.len);
  }
  return 0;
}
function hillAt(d) {
  for (let i = 0; i < hills.length; i++) {
    const h = hills[i];
    if (d < h.d0 + h.len) return d < h.d0 ? 0 : h.amp * bump((d - h.d0) / h.len);
  }
  return 0;
}
// the strongest bend the course will use at this distance (bends get sharper as you go)
// true from the start of a run until you leave the game-over screen (the title has its own calm course)
function inRun() { return G.state === 'play' || G.state === 'dying' || G.state === 'over'; }
function kMaxAt(d) {
  const lvl = inRun() ? d / 1000 : 0.4;
  return 0.001 + Math.min(lvl, 5) * 0.00055;
}
function pushCurve(len, k) {
  curves.push({ d0: curveEnd, len, k });
  curveEnd += len;
  planHeading += k * len * 0.5;
}
function pushHill(len, amp) {
  hills.push({ d0: hillEnd, len, amp });
  hillEnd += len;
}

function planCourse(upTo) {
  while (curveEnd < upTo) {
    if (curveEnd < 170) { pushCurve(170 - curveEnd, 0); continue; }
    const lvl = inRun() ? curveEnd / 1000 : 0.4;
    const kMax = kMaxAt(curveEnd);
    if (Math.random() < Math.max(0.12, 0.36 - lvl * 0.05)) { pushCurve(rand(70, 170), 0); continue; }
    // Lean toward turning back the way we came, so the sun is usually somewhere ahead.
    let dir = Math.random() < 0.5 ? -1 : 1;
    if ((Math.abs(planHeading) > 0.35 && Math.random() < 0.8) || Math.abs(planHeading) > 1) dir = -Math.sign(planHeading);
    if (lvl > 2 && Math.random() < 0.12) {
      pushCurve(rand(480, 640), dir * kMax * 1.2);   // a big sweeping bend
    } else {
      pushCurve(rand(200, 420), dir * rand(0.45, 1) * kMax);
      if (Math.random() < 0.3 + Math.min(lvl, 4) * 0.06) {
        pushCurve(rand(200, 360), -dir * rand(0.5, 1) * kMax);   // S-curve
      }
    }
  }
  while (hillEnd < upTo) {
    const th = THEMES[zoneThemeAt(hillEnd)].hills;
    if (hillEnd < 420 || Math.random() > th.chance) { pushHill(rand(120, 320), 0); continue; }
    const lvl = inRun() ? hillEnd / 1000 : 0.5;
    const amp = rand(th.amp[0], th.amp[1]) * Math.min(1, 0.45 + lvl * 0.3);
    // long enough that the climb is never steeper than about 1 in 18
    pushHill(Math.max(rand(260, 480), amp * 55), amp);
  }
  // forget the parts of the course we've already passed
  while (curves.length > 1 && curves[0].d0 + curves[0].len < VIEW_D - 30) curves.shift();
  while (hills.length > 1 && hills[0].d0 + hills[0].len < VIEW_D - 30) hills.shift();
}

function resetCourse() {
  curves.length = 0; hills.length = 0;
  curveEnd = 0; hillEnd = 0; planHeading = 0; HEADING = 0;
}

function lx(z) {
  const f = z / SEG;
  if (f <= 0) return 0;
  if (f >= NS - 1) return bendX[NS - 1] + (z - (NS - 1) * SEG) * bendXEnd;
  const i = f | 0;
  const a = bendX[i];
  return a + (bendX[i + 1] - a) * (f - i);
}
function ly(z) {
  const f = z / SEG;
  if (f <= 0) return 0;
  if (f >= NS - 1) return bendY[NS - 1] + (z - (NS - 1) * SEG) * bendYEnd;
  const i = f | 0;
  const a = bendY[i];
  return a + (bendY[i + 1] - a) * (f - i);
}

// world -> screen. y is height above the track surface.
function sx(x, z) { return CX + (x + lx(z) - cam.x) * FOCAL / z; }
function sy(y, z) { return HORIZON + (CAM_H + CAM_LIFT - y - ly(z)) * FOCAL / z; }
// height above the flat ground plane (for scenery; the track can lift above it)
function gy(y, z) { return HORIZON + (CAM_H + CAM_LIFT + HC + z * PITCH - y) * FOCAL / z; }
function fogA(z) { return clamp((FAR - z) / 60, 0, 1); }

// Rebuild the bend table for this frame.
function buildView(dt) {
  const sp = clamp((G.speed - 32) / 58, 0, 1);
  // Wider view at speed: the speeder stays put on screen, the world ahead stretches away.
  const k = 1 - 0.13 * sp - 0.05 * G.kick;
  VIEW_Z = PLAYER_Z * k;
  FOCAL = BASE_FOCAL * k;
  VIEW_D = G.d - VIEW_Z;
  CAM_LIFT = player.y * 0.55;
  planCourse(VIEW_D + NS * SEG + 60);

  let lat = 0, slope = 0;
  bendX[0] = 0;
  for (let i = 1; i < NS; i++) {
    const kc = curvAt(VIEW_D + (i - 0.5) * SEG);
    lat += slope * SEG + 0.5 * kc * SEG * SEG;
    slope += kc * SEG;
    bendX[i] = lat;
  }
  const aim = lx(AIM_Z) / AIM_Z;
  for (let i = 1; i < NS; i++) bendX[i] -= i * SEG * aim;
  bendXEnd = slope - aim;

  const h0 = hillAt(VIEW_D);
  HC = h0;
  PITCH = (hillAt(G.d) - h0) / VIEW_Z;
  bendY[0] = 0;
  let prevY = 0;
  for (let i = 1; i < NS; i++) {
    const z = i * SEG;
    let v = hillAt(VIEW_D + z) - h0 - z * PITCH;
    let Y = (CAM_H - v) / z;
    // Never let the road ahead dip out of sight behind a crest: hazards must stay visible.
    if (i > 1) {
      const lim = prevY - 0.35 * CAM_H * SEG / (z * (z - SEG));
      if (Y > lim) { Y = lim; v = CAM_H - Y * z; }
    }
    prevY = Y;
    bendY[i] = v;
  }
  bendYEnd = (bendY[NS - 1] - bendY[NS - 2]) / SEG;
  HZ = HORIZON + PITCH * FOCAL;

  // camera lean into turns + the sky turning with the road
  const kp = curvAt(G.d);
  if (dt > 0) {
    HEADING += kp * G.speed * dt;
    const rollT = clamp(-kp * G.speed * 0.55, -0.075, 0.075);
    ROLL += (rollT - ROLL) * (1 - Math.exp(-dt * 3));
  }
  zoneMix(G.d);
}

// ---------- Backdrop (sky, sun, mountains, stars) ----------
let stars = [];
const mountainLayers = [];
const themeGrads = [];
const SPR = {};       // pre-drawn sprites (drawn once, stamped every frame: cheap)
let trailGrad = null;

function makeMountainPoints(n, rough) {
  const pts = [];
  const first = rand(0.2, 0.6);
  for (let i = 0; i <= n; i++) {
    let h = i === 0 || i === n ? first : rand(0.1, 1) * (Math.random() < rough ? 1 : 0.5);
    if (i > 0 && i < n && Math.random() < 0.35) h *= 0.35;   // deep notches = jagged
    pts.push({ x: (i + (i > 0 && i < n ? rand(-0.35, 0.35) : 0)) / n, h });
  }
  return pts;
}

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w));
  c.height = Math.max(1, Math.round(h));
  return c;
}

// A soft round glow, drawn once per color.
function glowSprite(rgb) {
  const c = makeCanvas(64, 64);
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.12, 'rgba(' + rgb + ',0.9)');
  grad.addColorStop(0.45, 'rgba(' + rgb + ',0.25)');
  grad.addColorStop(1, 'rgba(' + rgb + ',0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 64, 64);
  return c;
}
function glow(spr, x, y, rx, ry, a) {
  if (a <= 0.01 || rx < 0.5) return;
  ctx.globalAlpha = a;
  ctx.drawImage(spr, x - rx, y - ry, rx * 2, ry * 2);
}

function buildSprites() {
  if (!SPR.cyan) {

    SPR.red = glowSprite('255,43,78');
    SPR.white = glowSprite('230,230,255');
    SPR.yellow = glowSprite('255,210,60');
    SPR.violet = glowSprite('170,110,255');
    SPR.teal = glowSprite('110,255,230');
  }
  const r = sunR;
  // moon (crystal zone)
  {
    const size = r * 2.2, c = makeCanvas(size * DPR, size * DPR), g = c.getContext('2d');
    g.scale(DPR, DPR);
    const m = size / 2, mr = r * 0.55;
    const gl = g.createRadialGradient(m, m, mr * 0.9, m, m, m);
    gl.addColorStop(0, 'rgba(120, 255, 240, 0.35)');
    gl.addColorStop(1, 'rgba(120, 255, 240, 0)');
    g.fillStyle = gl; g.fillRect(0, 0, size, size);
    const body = g.createLinearGradient(m - mr, m - mr, m + mr, m + mr);
    body.addColorStop(0, '#effffb'); body.addColorStop(0.6, '#8ff0ea'); body.addColorStop(1, '#2a7fa8');
    g.fillStyle = body; g.beginPath(); g.arc(m, m, mr, 0, Math.PI * 2); g.fill();
    g.fillStyle = 'rgba(30, 90, 130, 0.35)';
    for (const [cx, cy, cr] of [[-0.3, -0.2, 0.18], [0.25, 0.15, 0.24], [-0.05, 0.4, 0.12], [0.35, -0.35, 0.1]]) {
      g.beginPath(); g.arc(m + cx * mr, m + cy * mr, cr * mr, 0, Math.PI * 2); g.fill();
    }
    SPR.moon = c; SPR.moonSize = size;
  }
  // ringed planet (cosmic zone)
  {
    const size = r * 2.6, c = makeCanvas(size * DPR, size * DPR), g = c.getContext('2d');
    g.scale(DPR, DPR);
    const m = size / 2, pr = r * 0.62;
    const gl = g.createRadialGradient(m, m, pr * 0.8, m, m, m * 0.95);
    gl.addColorStop(0, 'rgba(180, 90, 255, 0.35)');
    gl.addColorStop(1, 'rgba(180, 90, 255, 0)');
    g.fillStyle = gl; g.fillRect(0, 0, size, size);
    g.save(); g.translate(m, m); g.rotate(-0.35);
    const ringBack = () => { g.beginPath(); g.ellipse(0, 0, pr * 1.75, pr * 0.42, 0, Math.PI, Math.PI * 2); };
    const ringFront = () => { g.beginPath(); g.ellipse(0, 0, pr * 1.75, pr * 0.42, 0, 0, Math.PI); };
    g.lineWidth = pr * 0.16; g.strokeStyle = 'rgba(255, 190, 120, 0.55)'; ringBack(); g.stroke();
    const body = g.createLinearGradient(0, -pr, 0, pr);
    body.addColorStop(0, '#ffd27a'); body.addColorStop(0.35, '#ff5fa8'); body.addColorStop(0.7, '#7a2bd6'); body.addColorStop(1, '#250a5a');
    g.fillStyle = body; g.beginPath(); g.arc(0, 0, pr, 0, Math.PI * 2); g.fill();
    g.globalAlpha = 0.25; g.fillStyle = '#ffffff';
    for (let i = -3; i <= 3; i++) g.fillRect(-pr, i * pr * 0.22, pr * 2, pr * 0.05);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'destination-in';
    g.beginPath(); g.rect(-size, -size, size * 2, size * 2); g.fill();
    g.globalCompositeOperation = 'source-over';
    g.lineWidth = pr * 0.16; g.strokeStyle = 'rgba(255, 220, 160, 0.85)'; ringFront(); g.stroke();
    g.lineWidth = pr * 0.04; g.strokeStyle = 'rgba(255, 255, 255, 0.7)'; ringFront(); g.stroke();
    g.restore();
    SPR.planet = c; SPR.planetSize = size;
  }
  // nebula clouds (soft colored blobs across the sky)
  {
    const w = W * 1.6, h = HORIZON * 1.1, c = makeCanvas(w, h), g = c.getContext('2d');
    const cols = ['170,60,255', '41,200,255', '255,43,180', '90,60,255'];
    for (let i = 0; i < 9; i++) {
      const x = rand(0, w), y = rand(0, h * 0.8), rr = rand(h * 0.25, h * 0.6);
      const gr = g.createRadialGradient(x, y, 0, x, y, rr);
      const col = cols[i % cols.length];
      gr.addColorStop(0, 'rgba(' + col + ',0.28)');
      gr.addColorStop(1, 'rgba(' + col + ',0)');
      g.fillStyle = gr;
      // draw wrapped so the strip tiles seamlessly
      for (const ox of [-w, 0, w]) g.fillRect(x + ox - rr, y - rr, rr * 2, rr * 2);
    }
    SPR.nebula = c;
  }
  // city skyline strip
  {
    const w = Math.round(W * 1.5), h = Math.round(H * 0.17), c = makeCanvas(w * DPR, h * DPR), g = c.getContext('2d');
    g.scale(DPR, DPR);
    let x = 0;
    const lights = [];
    g.fillStyle = '#0a0626';
    while (x < w) {
      const bw = rand(10, 34), bh = h * (Math.random() < 0.15 ? rand(0.6, 1) : rand(0.18, 0.55));
      g.fillRect(x, h - bh, bw, bh);
      if (Math.random() < 0.3) g.fillRect(x + bw * 0.45, h - bh - rand(6, 16), 1.5, 16);
      for (let wy = h - bh + 4; wy < h - 3; wy += 5) {
        for (let wx = x + 3; wx < x + bw - 3; wx += 4) if (Math.random() < 0.22) lights.push(wx, wy);
      }
      lights.push(-1, x, h - bh, bw);
      x += bw + rand(0, 4);
    }
    for (let i = 0; i < lights.length;) {
      if (lights[i] === -1) {
        g.fillStyle = Math.random() < 0.5 ? 'rgba(255, 60, 210, 0.8)' : 'rgba(41, 243, 255, 0.7)';
        g.fillRect(lights[i + 1], lights[i + 2], lights[i + 3], 1.2);
        i += 4;
      } else {
        g.fillStyle = Math.random() < 0.7 ? 'rgba(255, 200, 120, 0.75)' : 'rgba(120, 220, 255, 0.8)';
        g.fillRect(lights[i], lights[i + 1], 1.6, 1.6);
        i += 2;
      }
    }
    SPR.skyline = c; SPR.skylineW = w; SPR.skylineH = h;
  }
  // a far-off floating island with a waterfall
  {
    const w = r * 1.3, h = r * 1.5, c = makeCanvas(w * DPR, h * DPR), g = c.getContext('2d');
    g.scale(DPR, DPR);
    const top = h * 0.18;
    const wf = g.createLinearGradient(0, top, 0, h);
    wf.addColorStop(0, 'rgba(140, 240, 255, 0.85)');
    wf.addColorStop(1, 'rgba(140, 240, 255, 0)');
    g.fillStyle = wf; g.fillRect(w * 0.62, top + 4, w * 0.05, h - top);
    g.fillStyle = '#2a0f45';
    g.beginPath();
    g.moveTo(w * 0.05, top); g.lineTo(w * 0.95, top); g.lineTo(w * 0.8, top + h * 0.12);
    g.lineTo(w * 0.55, top + h * 0.38); g.lineTo(w * 0.42, top + h * 0.3); g.lineTo(w * 0.2, top + h * 0.12);
    g.closePath(); g.fill();
    g.strokeStyle = 'rgba(255, 160, 230, 0.7)'; g.lineWidth = 1.2; g.stroke();
    g.fillStyle = '#1b0830';
    g.fillRect(w * 0.3, top - h * 0.1, w * 0.06, h * 0.1);
    g.fillRect(w * 0.48, top - h * 0.16, w * 0.05, h * 0.16);
    g.fillStyle = 'rgba(120, 255, 200, 0.8)'; g.fillRect(w * 0.05, top - 1.5, w * 0.9, 1.5);
    SPR.isle = c; SPR.isleW = w; SPR.isleH = h;
  }
  // cloud sea along the horizon
  {
    const w = Math.round(W * 1.5), h = Math.round(H * 0.06), c = makeCanvas(w, h), g = c.getContext('2d');
    for (let i = 0; i < 45; i++) {
      const x = rand(0, w), y = rand(h * 0.35, h), rr = rand(h * 0.3, h * 0.8);
      g.fillStyle = 'rgba(255, ' + (190 + (Math.random() * 50 | 0)) + ', 235, 0.09)';
      for (const ox of [-w, 0, w]) { g.beginPath(); g.ellipse(x + ox, y, rr * 2.2, rr, 0, 0, Math.PI * 2); g.fill(); }
    }
    SPR.clouds = c; SPR.cloudsW = w; SPR.cloudsH = h;
  }
}

function buildBackdrop() {
  themeGrads.length = 0;
  for (const th of THEMES) {
    const sky = ctx.createLinearGradient(0, 0, 0, HORIZON);
    sky.addColorStop(0, th.sky[0]);
    sky.addColorStop(0.55, th.sky[1]);
    sky.addColorStop(0.85, th.sky[2]);
    sky.addColorStop(1, th.sky[3]);
    const ground = ctx.createLinearGradient(0, HORIZON, 0, H);
    ground.addColorStop(0, th.ground[0]);
    ground.addColorStop(0.25, th.ground[1]);
    ground.addColorStop(1, th.ground[2]);
    const haze = ctx.createLinearGradient(0, HORIZON - H * 0.03, 0, HORIZON + H * 0.09);
    const hz = th.haze.join(',');
    haze.addColorStop(0, 'rgba(' + hz + ', 0)');
    haze.addColorStop(0.25, 'rgba(' + hz + ', 0.5)');
    haze.addColorStop(1, 'rgba(' + hz + ', 0)');
    themeGrads.push({ sky, ground, haze });
  }
  trailGrad = ctx.createLinearGradient(0, SHIP_Y, 0, H);
  trailGrad.addColorStop(0, 'rgba(255, 255, 255, 0.9)');
  trailGrad.addColorStop(0.15, 'rgba(41, 243, 255, 0.55)');
  trailGrad.addColorStop(1, 'rgba(255, 43, 214, 0)');

  // Sun (drawn once to an offscreen canvas, with the classic stripes)
  sunR = Math.round(Math.min(W, H) * 0.3);
  const size = sunR * 3;
  sunCanvas = document.createElement('canvas');
  sunCanvas.width = Math.round(size * DPR);
  sunCanvas.height = Math.round(size * DPR);
  const s = sunCanvas.getContext('2d');
  s.scale(DPR, DPR);
  const c = size / 2;
  const glowG = s.createRadialGradient(c, c, sunR * 0.8, c, c, sunR * 1.5);
  glowG.addColorStop(0, 'rgba(255, 60, 160, 0.45)');
  glowG.addColorStop(1, 'rgba(255, 60, 160, 0)');
  s.fillStyle = glowG;
  s.fillRect(0, 0, size, size);
  const g = s.createLinearGradient(0, c - sunR, 0, c + sunR);
  g.addColorStop(0, '#fff3a0');
  g.addColorStop(0.45, '#ff9a3c');
  g.addColorStop(1, '#ff2fa0');
  s.fillStyle = g;
  s.beginPath();
  s.arc(c, c, sunR, 0, Math.PI * 2);
  s.fill();
  s.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 8; i++) {
    const y = c + sunR * 0.08 + i * sunR * 0.12;
    const h = 1.5 + i * sunR * 0.012;
    s.fillRect(0, y, size, h);
  }

  if (!stars.length) {
    for (let i = 0; i < 110; i++) {
      stars.push({ x: Math.random(), y: Math.random() * 0.95, r: Math.random() < 0.15 ? 2 : 1, tw: rand(0.5, 3), ph: rand(0, 6) });
    }
    mountainLayers.push({ pts: makeMountainPoints(26, 0.45), par: 3, hmax: 0.085, fill: 0, edge: 0, turn: 0.9 });
    mountainLayers.push({ pts: makeMountainPoints(16, 0.6), par: 6, hmax: 0.05, fill: 1, edge: 1, turn: 1 });
  }
  buildSprites();
}

// wrap a value into [0, span)
function wrap(v, span) { return ((v % span) + span) % span; }

function drawMountains(layer, w) {
  const span = W * 1.5;
  const off = wrap(-cam.x * layer.par - HEADING * FOCAL * layer.turn, span);
  const hmax = H * layer.hmax;
  ctx.beginPath();
  ctx.moveTo(-OS, HZ + 1);
  for (let x0 = off - span * 2; x0 < W + OS; x0 += span) {
    if (x0 + span < -OS) continue;
    for (const p of layer.pts) ctx.lineTo(x0 + p.x * span, HZ - p.h * hmax);
  }
  ctx.lineTo(W + OS, HZ + 1);
  ctx.closePath();
  ctx.globalAlpha = w;
  ctx.fillStyle = rgba(layer.fill ? PAL.mtnFill1 : PAL.mtnFill0, 1);
  ctx.fill();
  ctx.strokeStyle = rgba(layer.edge ? PAL.mtnEdge1 : PAL.mtnEdge0, 0.55);
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.globalAlpha = 1;
}

// x position of something "at infinity" straight down the original road
function skyX(par) { return CX - cam.x * 2 - Math.tan(clamp(HEADING, -1.3, 1.3)) * FOCAL * par; }

function drawSky() {
  const L = PAL.L;
  const ga = themeGrads[ZONE.a], gb = themeGrads[ZONE.b];
  ctx.save();
  ctx.translate(0, HZ - HORIZON);
  ctx.fillStyle = ga.sky;
  ctx.fillRect(-OS, -OS - 200, W + OS * 2, HORIZON + OS + 202);
  if (ZONE.t < 1 && ZONE.a !== ZONE.b) {
    ctx.globalAlpha = ZONE.t;
    ctx.fillStyle = gb.sky;
    ctx.fillRect(-OS, -OS - 200, W + OS * 2, HORIZON + OS + 202);
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  // nebula + stars
  if (L.nebula > 0.02 && QUAL.nebula) {
    const nw = SPR.nebula.width;
    const off = wrap(-HEADING * FOCAL * 0.5 - cam.x, nw);
    ctx.globalAlpha = L.nebula * (0.75 + 0.25 * Math.sin(G.t * 0.4));
    for (let x0 = off - nw; x0 < W + OS; x0 += nw) ctx.drawImage(SPR.nebula, x0, HZ - HORIZON * 1.05, nw, HORIZON * 1.1);
    ctx.globalAlpha = 1;
  }
  if (L.stars > 0.02) {
    ctx.fillStyle = '#fff';
    const soff = -HEADING * FOCAL * 0.3;
    for (const s of stars) {
      ctx.globalAlpha = L.stars * (0.35 + 0.65 * Math.abs(Math.sin(G.t * s.tw + s.ph)));
      ctx.fillRect(wrap(s.x * W + soff, W + OS) - OS * 0.5, HZ - HORIZON + s.y * HORIZON * 0.92, s.r, s.r);
    }
    ctx.globalAlpha = 1;
  }

  // celestial bodies
  if (L.sun > 0.02) {
    const size = sunR * 3;
    ctx.globalAlpha = L.sun;
    ctx.drawImage(sunCanvas, skyX(1) - size / 2, HZ - sunR * 0.3 - size / 2, size, size);
    ctx.globalAlpha = 1;
  }
  if (L.moon > 0.02) {
    const size = SPR.moonSize;
    ctx.globalAlpha = L.moon;
    ctx.drawImage(SPR.moon, skyX(1) + W * 0.18 - size / 2, HZ - HORIZON * 0.55 - size / 2, size, size);
    ctx.globalAlpha = 1;
  }
  if (L.planet > 0.02) {
    const size = SPR.planetSize;
    ctx.globalAlpha = L.planet;
    ctx.drawImage(SPR.planet, skyX(1) - W * 0.12 - size / 2, HZ - HORIZON * 0.5 - size / 2, size, size);
    ctx.globalAlpha = 1;
  }
  // far floating islands drifting in the sky
  if (L.isles > 0.02) {
    const iw = SPR.isleW, ih = SPR.isleH;
    const span = W * 1.7;
    for (let i = 0; i < 3; i++) {
      const sc = [0.55, 0.85, 0.4][i];
      const x = wrap(span * (i * 0.37 + 0.1) - HEADING * FOCAL * (0.6 + i * 0.1) - cam.x * (1 + i), span) - W * 0.35;
      const y = HZ - HORIZON * [0.62, 0.38, 0.8][i] + Math.sin(G.t * 0.5 + i * 2) * 4;
      ctx.globalAlpha = L.isles * (0.55 + i * 0.12);
      ctx.drawImage(SPR.isle, x, y, iw * sc, ih * sc);
    }
    ctx.globalAlpha = 1;
  }

  // skyline, mountains, clouds
  if (L.skyline > 0.02) {
    const sw = SPR.skylineW, sh = SPR.skylineH;
    const off = wrap(-cam.x * 4 - HEADING * FOCAL * 0.95, sw);
    ctx.globalAlpha = L.skyline;
    for (let x0 = off - sw; x0 < W + OS; x0 += sw) ctx.drawImage(SPR.skyline, x0, HZ - sh + 1, sw, sh);
    ctx.globalAlpha = 1;
  }
  if (L.mtn > 0.02) {
    drawMountains(mountainLayers[0], L.mtn);
    drawMountains(mountainLayers[1], L.mtn);
  }
  if (L.clouds > 0.02) {
    const cw = SPR.cloudsW, ch = SPR.cloudsH;
    const off = wrap(-cam.x * 7 - HEADING * FOCAL - G.t * 6, cw);
    ctx.globalAlpha = L.clouds;
    for (let x0 = off - cw; x0 < W + OS; x0 += cw) ctx.drawImage(SPR.clouds, x0, HZ - ch * 0.7, cw, ch);
    ctx.globalAlpha = 1;
  }
}

// polyline sample points along the table: dense close up, sparser far away
const SAMPLE_I = [];
for (let i = 1; i < NS; i += (i < 14 ? 1 : i < 40 ? 2 : 3)) SAMPLE_I.push(i);
if (SAMPLE_I[SAMPLE_I.length - 1] !== NS - 1) SAMPLE_I.push(NS - 1);
const ZN = 1.0;

// trace a line along the track at side-position x and height y (track = true: rides the track; false: the ground)
function traceLine(x, y, onTrack, zMax, first) {
  const fy = onTrack ? sy : gy;
  if (first) ctx.moveTo(sx(x, ZN), fy(y, ZN)); else ctx.lineTo(sx(x, ZN), fy(y, ZN));
  for (let j = 0; j < SAMPLE_I.length; j++) {
    const z = SAMPLE_I[j] * SEG;
    if (z > zMax) { ctx.lineTo(sx(x, zMax), fy(y, zMax)); break; }
    ctx.lineTo(sx(x, z), fy(y, z));
  }
}
function traceLineBack(x, y, zMax) {
  let j = SAMPLE_I.length - 1;
  while (j > 0 && SAMPLE_I[j] * SEG > zMax) j--;
  ctx.lineTo(sx(x, zMax), sy(y, zMax));
  for (; j >= 0; j--) {
    const z = SAMPLE_I[j] * SEG;
    ctx.lineTo(sx(x, z), sy(y, z));
  }
  ctx.lineTo(sx(x, ZN), sy(y, ZN));
}

function drawGround() {
  const L = PAL.L;
  const camD = VIEW_D;
  const ga = themeGrads[ZONE.a], gb = themeGrads[ZONE.b];
  const top = Math.min(HZ, sy(0, FAR)) - 2;

  // ground base
  ctx.save();
  ctx.translate(0, HZ - HORIZON);
  ctx.fillStyle = ga.ground;
  ctx.fillRect(-OS, top - (HZ - HORIZON), W + OS * 2, H + OS * 2);
  if (ZONE.t < 1 && ZONE.a !== ZONE.b) {
    ctx.globalAlpha = ZONE.t;
    ctx.fillStyle = gb.ground;
    ctx.fillRect(-OS, top - (HZ - HORIZON), W + OS * 2, H + OS * 2);
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  // ground grid (off the track)
  if (L.grid > 0.02) {
    ctx.strokeStyle = rgba(PAL.grid, 0.38 * L.grid);
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    for (let j = 1; j <= QUAL.grid; j++) {
      const off = TRACK_HALF + 0.6 + j * 3;
      traceLine(-off, 0, false, FAR, true);
      traceLine(off, 0, false, FAR, true);
    }
    ctx.stroke();
    const spacing = 4;
    let ld = Math.ceil((camD + 1.2) / spacing) * spacing;
    ctx.lineWidth = 1;
    for (; ld < camD + FAR; ld += spacing) {
      const z = ld - camD;
      const y = gy(0, z);
      const a = clamp((1 - z / FAR) * 1.3, 0, 1) * 0.7 * L.grid;
      if (a < 0.02) continue;
      ctx.strokeStyle = rgba(PAL.grid, a);
      ctx.lineWidth = clamp(0.03 * FOCAL / z, 0.5, 2.5);
      ctx.beginPath();
      ctx.moveTo(-OS, y);
      ctx.lineTo(W + OS, y);
      ctx.stroke();
    }
  }
  // drifting cloud bands below a sky-high track
  if (L.clouds > 0.02) {
    ctx.fillStyle = 'rgba(255, 225, 245, 1)';
    const spacing = 11;
    for (let ld = Math.ceil((camD + 2) / spacing) * spacing; ld < camD + FAR; ld += spacing) {
      const z = ld - camD;
      const y = gy(0, z);
      const th = clamp(0.9 * FOCAL / z, 0.5, 40);
      ctx.globalAlpha = L.clouds * 0.05 * fogA(z) * (0.6 + 0.4 * Math.sin(ld * 0.37));
      ctx.fillRect(-OS, y - th, W + OS * 2, th);
    }
    ctx.globalAlpha = 1;
  }
  // ground star-dust that rushes past (crystal + cosmic)
  if (L.gstars > 0.02) {
    ctx.fillStyle = '#d8ccff';
    for (const p of groundDust) {
      const z = p.d - camD;
      if (z < 1 || z > FAR) continue;
      const r = clamp(0.08 * FOCAL / z, 0.6, 3);
      ctx.globalAlpha = L.gstars * fogA(z) * p.a;
      ctx.fillRect(sx(p.x, z) - r / 2, gy(0, z) - r / 2, r, r);
    }
    ctx.globalAlpha = 1;
  }

  // haze where the ground meets the sky
  ctx.save();
  ctx.translate(0, HZ - HORIZON);
  ctx.fillStyle = ga.haze;
  ctx.fillRect(-OS, HORIZON - H * 0.03, W + OS * 2, H * 0.12);
  if (ZONE.t < 1 && ZONE.a !== ZONE.b) {
    ctx.globalAlpha = ZONE.t;
    ctx.fillStyle = gb.haze;
    ctx.fillRect(-OS, HORIZON - H * 0.03, W + OS * 2, H * 0.12);
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  // support pillars wherever the track lifts off the ground
  const pg = 16;
  ctx.lineCap = 'butt';
  for (let pd = Math.ceil((camD + 2) / pg) * pg; pd < camD + FAR; pd += pg) {
    const z = pd - camD;
    if (hillAt(pd) < 1.2) continue;
    const yTop = sy(0, z), yBot = gy(0, z);
    if (yBot - yTop < 3) continue;
    const a = fogA(z);
    const w = clamp(0.7 * FOCAL / z, 1, 40);
    for (const side of [-1, 1]) {
      const x = sx(side * (TRACK_HALF - 0.6), z);
      ctx.globalAlpha = a;
      ctx.fillStyle = '#0d0420';
      ctx.fillRect(x - w / 2, yTop, w, yBot - yTop);
      ctx.globalAlpha = a * 0.5;
      ctx.fillStyle = rgba(PAL.accent, 1);
      ctx.fillRect(x - w / 2, yTop, Math.max(1, w * 0.12), yBot - yTop);
    }
  }
  ctx.globalAlpha = 1;

  // track surface (dark, so hazards pop against it)
  ctx.beginPath();
  traceLine(-TRACK_HALF, 0, true, FAR, true);
  traceLineBack(TRACK_HALF, 0, FAR);
  ctx.closePath();
  ctx.fillStyle = rgba(PAL.road, 0.96);
  ctx.fill();
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = rgba(PAL.accent, 0.05);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  // lane lines running down the track
  ctx.strokeStyle = rgba(PAL.grid, 0.22);
  ctx.lineWidth = 1;
  ctx.beginPath();
  traceLine(-TRACK_HALF / 2, 0, true, FAR, true);
  traceLine(TRACK_HALF / 2, 0, true, FAR, true);
  ctx.stroke();

  // cross lines on the track (these scroll, which is what sells the speed)
  const spacing = 4;
  for (let ld = Math.ceil((camD + 1.2) / spacing) * spacing; ld < camD + FAR; ld += spacing) {
    const z = ld - camD;
    const y = sy(0, z);
    const a = clamp((1 - z / FAR) * 1.3, 0, 1);
    ctx.strokeStyle = rgba(PAL.grid, a * 0.6);
    ctx.lineWidth = clamp(0.035 * FOCAL / z, 0.5, 3);
    ctx.beginPath();
    ctx.moveTo(sx(-TRACK_HALF, z), y);
    ctx.lineTo(sx(TRACK_HALF, z), y);
    ctx.stroke();
  }

  // center dashes
  ctx.fillStyle = rgba(PAL.rail, 1);
  const dash = 9;
  for (let ld = Math.ceil((camD + 1) / dash) * dash; ld < camD + FAR * 0.8; ld += dash) {
    const z1 = ld - camD, z2 = z1 + 3.6;
    const w1 = 0.055 * FOCAL / z1, w2 = 0.055 * FOCAL / z2;
    const x1 = sx(0, z1), x2 = sx(0, z2), y1 = sy(0, z1), y2 = sy(0, z2);
    ctx.globalAlpha = clamp((1 - z1 / (FAR * 0.8)) * 1.4, 0, 1) * clamp((z1 - 3) / 14, 0, 1) * 0.6;
    ctx.beginPath();
    ctx.moveTo(x1 - w1, y1); ctx.lineTo(x1 + w1, y1); ctx.lineTo(x2 + w2, y2); ctx.lineTo(x2 - w2, y2);
    ctx.closePath();
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // rails: a glowing band with a bright top edge
  for (const side of [-1, 1]) {
    const x = side * TRACK_HALF;
    ctx.beginPath();
    traceLine(x, 0, true, FAR, true);
    traceLineBack(x, 0.42, FAR);
    ctx.closePath();
    ctx.fillStyle = rgba(PAL.rail, 0.2);
    ctx.fill();
    ctx.beginPath();
    traceLine(x, 0.42, true, FAR, true);
    ctx.strokeStyle = rgba(PAL.rail, 0.3);
    ctx.lineWidth = 6;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(225, 255, 255, 0.95)';
    ctx.lineWidth = 1.6;
    ctx.stroke();
    ctx.beginPath();
    traceLine(x, 0, true, FAR, true);
    ctx.strokeStyle = rgba(PAL.rail, 0.8);
    ctx.lineWidth = 1.2;
    ctx.stroke();
  }

  // rail posts with lights
  const postGap = 12;
  const railC = rgba(PAL.rail, 1);
  for (let pd = Math.ceil((camD + 1) / postGap) * postGap; pd < camD + FAR; pd += postGap) {
    const z = pd - camD;
    const lw = clamp(0.1 * FOCAL / z, 1, 7);
    const a = fogA(z);
    ctx.lineWidth = lw;
    ctx.strokeStyle = railC;
    ctx.globalAlpha = a;
    ctx.beginPath();
    for (const side of [-1, 1]) {
      const x = sx(side * (TRACK_HALF + 0.12), z);
      ctx.moveTo(x, sy(0, z));
      ctx.lineTo(x, sy(0.75, z));
    }
    ctx.stroke();
    if ((pd / postGap) % 2 === 0) {
      ctx.globalCompositeOperation = 'lighter';
      const r = clamp(0.5 * FOCAL / z, 2, 26);
      const blink = 0.65 + 0.35 * Math.sin(G.t * 6 + pd * 0.05);
      for (const side of [-1, 1]) glow(SPR.cyan, sx(side * (TRACK_HALF + 0.12), z), sy(0.8, z), r, r, a * blink * 0.8);
      ctx.globalCompositeOperation = 'source-over';
    }
  }
  ctx.globalAlpha = 1;

  // chevrons on the outside of upcoming bends, so turns never surprise you
  const cg = 14;
  for (let cd = Math.ceil((camD + 6) / cg) * cg; cd < camD + FAR * 0.85; cd += cg) {
    const k = curvAt(cd);
    if (Math.abs(k) < 0.0011) continue;
    const z = cd - camD;
    const dir = k > 0 ? 1 : -1;
    const x = -dir * (TRACK_HALF + 1.1);
    const s = FOCAL / z;
    const px = sx(x, z), py = sy(1.0, z);
    const hh = 0.45 * s, ww = 0.32 * s;
    if (hh < 1.5) continue;
    ctx.globalAlpha = fogA(z) * clamp((Math.abs(k) - 0.0011) / 0.001, 0.35, 1);
    ctx.fillStyle = 'rgba(10, 4, 24, 0.85)';
    ctx.fillRect(px - ww * 1.6, py - hh, ww * 3.2, hh * 2);
    ctx.strokeStyle = COLORS.yellow;
    ctx.lineWidth = Math.max(1, 0.07 * s);
    ctx.beginPath();
    for (const o of [-0.7, 0.4]) {
      const cx2 = px + o * ww * dir;
      ctx.moveTo(cx2 - ww * 0.4 * dir, py - hh * 0.6);
      ctx.lineTo(cx2 + ww * 0.4 * dir, py);
      ctx.lineTo(cx2 - ww * 0.4 * dir, py + hh * 0.6);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

/* ---------- Roadside scenery ----------
   A fixed pool of props that gets recycled: when one passes behind the camera
   it is re-used further up the road. Nothing is created during play. All props
   sit well outside the rails (arches pass high over the track). */
const SCN_MAX = 80;
const scenery = [];
for (let i = 0; i < SCN_MAX; i++) scenery.push({ on: false, type: '', x: 0, d: 0, w: 1, h: 1, dep: 1, y: 0, seed: 0, alt: 0, pts: new Float32Array(24), _z: 0 });
let scnNext = 0;
const scnDraw = [];
const groundDust = [];
for (let i = 0; i < 70; i++) groundDust.push({ x: 0, d: 0, a: 1 });
function resetDust(p, initial) {
  p.x = (Math.random() < 0.5 ? -1 : 1) * rand(TRACK_HALF + 1, 40);
  p.d = (initial ? VIEW_D + rand(0, FAR) : VIEW_D + FAR * rand(0.7, 1));
  p.a = rand(0.3, 1);
}

function pickProp(d) {
  const ti = zoneThemeAt(d);
  // during a zone change, mix in props from the zone you're leaving
  const local = d - Math.floor(d / ZONE_LEN) * ZONE_LEN;
  let th = THEMES[ti];
  if (inRun() && d > ZONE_LEN && local < ZONE_FADE && Math.random() > local / ZONE_FADE) {
    th = THEMES[(ti + THEMES.length - 1) % THEMES.length];
  }
  let total = 0;
  for (const k in th.props) total += th.props[k];
  let r = Math.random() * total;
  for (const k in th.props) { r -= th.props[k]; if (r <= 0) return k; }
  return 'peak';
}

function spawnProp(d) {
  let o = null;
  for (const s of scenery) if (!s.on) { o = s; break; }
  if (!o) return;
  const type = pickProp(d);
  const side = Math.random() < 0.5 ? -1 : 1;
  o.on = true; o.type = type; o.d = d; o.seed = Math.random() * 100; o.y = 0; o.alt = Math.random();
  const P = o.pts;
  if (type === 'peak' || type === 'mesa') {
    o.w = rand(18, 48); o.h = rand(8, 26) * (type === 'mesa' ? 0.55 : 1);
    o.x = side * (TRACK_HALF + 7 + o.w / 2 + rand(0, 34));
    // jagged outline: 8 points across, as (u, v) pairs
    for (let i = 0; i < 8; i++) {
      const u = i / 7 - 0.5;
      let v = type === 'mesa' ? (i === 0 || i === 7 ? 0 : rand(0.85, 1)) : (i === 0 || i === 7 ? 0 : (1 - Math.abs(u) * 1.7) * rand(0.6, 1.15));
      P[i * 2] = u + (i > 0 && i < 7 ? rand(-0.04, 0.04) : 0);
      P[i * 2 + 1] = Math.max(0, v);
    }
  } else if (type === 'tower') {
    o.w = rand(3, 7); o.dep = rand(3, 7); o.h = rand(12, 46);
    o.x = side * (TRACK_HALF + 5 + o.w / 2 + rand(0, 26));
  } else if (type === 'antenna') {
    o.h = rand(12, 28); o.w = 0.3;
    o.x = side * (TRACK_HALF + rand(6, 26));
  } else if (type === 'monolith') {
    o.w = rand(1.6, 3.2); o.dep = o.w * 0.5; o.h = rand(5, 10); o.y = rand(1.5, 7);
    o.x = side * (TRACK_HALF + 4 + rand(0, 22));
  } else if (type === 'crystal') {
    o.h = rand(3, 10); o.w = o.h * 0.9;
    o.x = side * (TRACK_HALF + 3 + o.w / 2 + rand(0, 24));
    for (let i = 0; i < 4; i++) {
      P[i * 4] = rand(-0.4, 0.4);       // base offset
      P[i * 4 + 1] = rand(-0.35, 0.35); // lean
      P[i * 4 + 2] = rand(0.4, 1);      // height
      P[i * 4 + 3] = rand(0.08, 0.16);  // width
    }
  } else if (type === 'island') {
    o.w = rand(6, 13); o.h = o.w * rand(0.35, 0.5); o.y = rand(4, 14);
    o.x = side * (TRACK_HALF + 12 + o.w / 2 + rand(0, 34));
  } else if (type === 'arch') {
    o.x = 0; o.w = rand(11, 15); o.h = o.w;
  } else if (type === 'poly') {
    o.w = rand(1.8, 3.6); o.y = rand(4, 11);
    o.x = side * (TRACK_HALF + 5 + rand(0, 22));
  } else if (type === 'beam') {
    o.w = 0.6; o.h = 60;
    o.x = side * (TRACK_HALF + rand(8, 40));
  }
}

function updateScenery(dt) {
  const camD = VIEW_D;
  for (const s of scenery) if (s.on && s.d - camD < 0.5) s.on = false;
  if (scnNext < camD) scnNext = camD + rand(2, 10);
  const ahead = camD + FAR + 50;
  while (scnNext < ahead) {
    spawnProp(scnNext);
    // big props are rarer up close to keep the view clear
    scnNext += rand(7, 20) / QUAL.scn;
  }
  for (const p of groundDust) if (p.d - camD < 1) resetDust(p, false);
}

function resetScenery() {
  for (const s of scenery) s.on = false;
  scnNext = 0;
  for (const p of groundDust) resetDust(p, true);
}

function drawScenery() {
  const camD = VIEW_D;
  scnDraw.length = 0;
  for (const s of scenery) {
    if (!s.on) continue;
    s._z = s.d - camD;
    if (s._z > 1.5 && s._z < FAR + 50) scnDraw.push(s);
  }
  scnDraw.sort((a, b) => b._z - a._z);
  const fill = rgba(PAL.propFill, 1);
  const edgeRGB = PAL.propEdge;
  // scenery: dark bodies, softer edges than gameplay objects
  SCN_BOX.face = fill;
  SCN_BOX.side = rgba(PAL.propFill, 1);
  SCN_BOX.top = rgba(PAL.propEdge, 0.25);
  SCN_BOX.edge = rgba(PAL.propEdge, 0.45);
  ctx.lineJoin = 'round';
  // Props sit outside the rails, but on hills and sky roads the track rises above the
  // ground, so a far-away building could be painted over the nearer road. To stop that,
  // each prop is drawn with the road in front of it cut out (grouped into depth bands,
  // so this only costs a handful of clips per frame).
  let band = -1, clipped = false;
  for (const o of scnDraw) {
    const z = o._z;
    let b = 0;
    while (b < SCN_BANDS.length - 1 && SCN_BANDS[b + 1] <= z) b++;
    if (b !== band) {
      band = b;
      if (clipped) { ctx.restore(); clipped = false; }
      const zc = SCN_BANDS[b];
      if (zc > ZN + 0.5) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(-OS * 3, -OS * 3, W + OS * 6, H + OS * 6);
        traceLine(-(TRACK_HALF + 1.7), 1.6, true, zc, true);
        traceLineBack(TRACK_HALF + 1.7, 1.6, zc);
        ctx.closePath();
        ctx.clip('evenodd');
        ctx.lineJoin = 'round';
        clipped = true;
      }
    }
    const s = FOCAL / z;
    // fade in at the far end, and keep scenery a step dimmer than the action
    const a = clamp((FAR + 50 - z) / 70, 0, 1) * clamp((z - 1.5) / 4, 0, 1);
    if (a < 0.02) continue;
    const bx = sx(o.x, z);
    const reach = Math.max(o.w, o.h, 6) * s;
    if (bx + reach < -OS || bx - reach > W + OS) continue;
    const by = gy(0, z);
    switch (o.type) {
      case 'peak':
      case 'mesa': {
        const P = o.pts;
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          const px = bx + P[i * 2] * o.w * s, py = by - P[i * 2 + 1] * o.h * s;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.globalAlpha = a;
        ctx.fillStyle = fill;
        ctx.fill();
        ctx.strokeStyle = rgba(edgeRGB, 0.5);
        ctx.lineWidth = clamp(0.06 * s, 1, 2.5);
        ctx.stroke();
        // facet lines (polygon look)
        ctx.strokeStyle = rgba(edgeRGB, 0.18);
        ctx.beginPath();
        for (let i = 2; i < 6; i += 2) {
          ctx.moveTo(bx + P[i * 2] * o.w * s, by - P[i * 2 + 1] * o.h * s);
          ctx.lineTo(bx + (P[i * 2] * 0.4 + (o.alt - 0.5) * 0.3) * o.w * s, by);
        }
        ctx.stroke();
        break;
      }
      case 'tower': {
        const r = drawBox(o.x, 0, z, o.w, o.h, o.dep, null, a, true);
        if (!r) break;
        // lit window bands + neon roof line
        const rows = Math.min(14, Math.floor(o.h / 3));
        ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = rgba(o.alt < 0.5 ? PAL.accent : PAL.rail, 0.22);
        ctx.lineWidth = clamp(0.12 * s, 0.6, 3);
        ctx.beginPath();
        for (let i = 1; i <= rows; i++) {
          if (((i * 7 + (o.seed | 0)) % 5) === 0) continue;
          const y = r.nyb + (r.nyt - r.nyb) * (i / (rows + 1));
          ctx.moveTo(r.nxl + 2, y); ctx.lineTo(r.nxr - 2, y);
        }
        ctx.stroke();
        ctx.strokeStyle = rgba(o.alt < 0.5 ? PAL.accent : PAL.rail, 0.85);
        ctx.lineWidth = clamp(0.15 * s, 1, 3);
        ctx.beginPath(); ctx.moveTo(r.nxl, r.nyt); ctx.lineTo(r.nxr, r.nyt); ctx.stroke();
        if (o.alt > 0.6) {
          const bl = Math.sin(G.t * 3 + o.seed) > 0.3 ? 1 : 0.25;
          glow(SPR.red, (r.nxl + r.nxr) / 2, r.nyt - 0.6 * s, 0.9 * s, 0.9 * s, a * bl);
        }
        ctx.globalCompositeOperation = 'source-over';
        break;
      }
      case 'antenna': {
        const ty = gy(o.h, z);
        ctx.globalAlpha = a;
        ctx.strokeStyle = rgba(edgeRGB, 0.6);
        ctx.lineWidth = clamp(0.25 * s, 1, 6);
        ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx, ty);
        ctx.moveTo(bx - 1.2 * s, gy(o.h * 0.7, z)); ctx.lineTo(bx + 1.2 * s, gy(o.h * 0.7, z));
        ctx.stroke();
        ctx.globalCompositeOperation = 'lighter';
        const bl = 0.4 + 0.6 * Math.abs(Math.sin(G.t * 2 + o.seed));
        glow(SPR.red, bx, ty, 1.4 * s + 3, 1.4 * s + 3, a * bl);
        if (o.alt > 0.55) {
          // energy beam into the sky
          ctx.globalAlpha = a * 0.22 * (0.7 + 0.3 * Math.sin(G.t * 4 + o.seed));
          ctx.fillStyle = rgba(PAL.accent, 1);
          const bw = clamp(0.5 * s, 1, 10);
          ctx.fillRect(bx - bw / 2, -OS, bw, ty + OS);
        }
        ctx.globalCompositeOperation = 'source-over';
        break;
      }
      case 'monolith': {
        const bob = Math.sin(G.t * 0.9 + o.seed) * 0.4;
        ctx.globalCompositeOperation = 'lighter';
        glow(SPR.violet, bx, by, o.w * 1.4 * s, o.w * 0.35 * s, a * 0.5);
        ctx.globalCompositeOperation = 'source-over';
        const r = drawBox(o.x, o.y + bob, z, o.w, o.h, o.dep, null, a, true);
        if (r) {
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = a * (0.45 + 0.25 * Math.sin(G.t * 2 + o.seed));
          ctx.fillStyle = rgba(o.alt < 0.5 ? PAL.accent : PAL.rail, 1);
          const sw = Math.max(1, 0.12 * r.s);
          ctx.fillRect((r.nxl + r.nxr) / 2 - sw / 2, r.nyt, sw, r.nyb - r.nyt);
          ctx.globalCompositeOperation = 'source-over';
        }
        break;
      }
      case 'crystal': {
        const P = o.pts;
        ctx.globalAlpha = a;
        for (let i = 0; i < 4; i++) {
          const b0 = bx + P[i * 4] * o.w * s;
          const lean = P[i * 4 + 1] * o.h * s, hh = P[i * 4 + 2] * o.h * s, ww = P[i * 4 + 3] * o.w * s * 2;
          ctx.beginPath();
          ctx.moveTo(b0 - ww, by);
          ctx.lineTo(b0 - ww + lean * 0.8, by - hh * 0.8);
          ctx.lineTo(b0 + lean, by - hh);
          ctx.lineTo(b0 + ww + lean * 0.8, by - hh * 0.8);
          ctx.lineTo(b0 + ww, by);
          ctx.closePath();
          ctx.fillStyle = 'rgba(20, 60, 90, 0.75)';
          ctx.fill();
          ctx.strokeStyle = rgba(edgeRGB, 0.65);
          ctx.lineWidth = clamp(0.08 * s, 1, 2.5);
          ctx.stroke();
        }
        ctx.globalCompositeOperation = 'lighter';
        const pulse = 0.5 + 0.5 * Math.sin(G.t * 2 + o.seed);
        glow(SPR.teal, bx, by - o.h * 0.35 * s, o.w * 0.9 * s, o.h * 0.6 * s, a * (0.25 + 0.2 * pulse));
        ctx.globalCompositeOperation = 'source-over';
        break;
      }
      case 'island': {
        const ty = gy(o.y, z), hw = o.w / 2 * s, dh = o.h * s;
        const bob = Math.sin(G.t * 0.7 + o.seed) * 0.3 * s;
        // waterfall pouring off the edge
        if (o.alt > 0.35) {
          const wx = bx + (o.alt - 0.65) * hw * 1.2, ww = clamp(0.6 * s, 1, 14);
          ctx.globalCompositeOperation = 'lighter';
          ctx.globalAlpha = a * 0.35;
          ctx.fillStyle = 'rgb(140, 230, 255)';
          ctx.fillRect(wx - ww / 2, ty + bob, ww, by - ty);
          ctx.globalAlpha = a * 0.5;
          ctx.fillStyle = '#e8fbff';
          const step = Math.max(6, 1.6 * s);
          const off = (G.t * 4 * s) % step;
          for (let y = ty + bob + off; y < by; y += step) ctx.fillRect(wx - ww * 0.25, y, ww * 0.5, step * 0.4);
          glow(SPR.cyan, wx, by, ww * 3, ww, a * 0.6);
          ctx.globalCompositeOperation = 'source-over';
        }
        ctx.globalAlpha = a;
        ctx.beginPath();
        ctx.moveTo(bx - hw, ty + bob);
        ctx.lineTo(bx + hw, ty + bob);
        ctx.lineTo(bx + hw * 0.55, ty + bob + dh * 0.45);
        ctx.lineTo(bx + hw * 0.1, ty + bob + dh * 1.25);
        ctx.lineTo(bx - hw * 0.35, ty + bob + dh * 0.7);
        ctx.lineTo(bx - hw * 0.75, ty + bob + dh * 0.3);
        ctx.closePath();
        ctx.fillStyle = fill;
        ctx.fill();
        ctx.strokeStyle = rgba(edgeRGB, 0.45);
        ctx.lineWidth = clamp(0.06 * s, 1, 2);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(120, 255, 200, 0.75)';
        ctx.lineWidth = clamp(0.12 * s, 1, 3);
        ctx.beginPath(); ctx.moveTo(bx - hw, ty + bob); ctx.lineTo(bx + hw, ty + bob); ctx.stroke();
        // a little glowing tower on top
        ctx.fillStyle = '#12051f';
        ctx.fillRect(bx - hw * 0.25, ty + bob - o.h * 0.5 * s, hw * 0.12, o.h * 0.5 * s);
        ctx.globalCompositeOperation = 'lighter';
        glow(SPR.yellow, bx - hw * 0.19, ty + bob - o.h * 0.5 * s, 0.8 * s, 0.8 * s, a * 0.8);
        ctx.globalCompositeOperation = 'source-over';
        break;
      }
      case 'arch': {
        // a huge neon ring the track passes through
        const cy = sy(0, z), r = o.w * s;
        ctx.globalAlpha = a * 0.9;
        ctx.strokeStyle = 'rgba(10, 4, 24, 0.9)';
        ctx.lineWidth = clamp(1.2 * s, 2, 60);
        ctx.beginPath(); ctx.arc(bx, cy, r, Math.PI, 0); ctx.stroke();
        ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = rgba(o.alt < 0.5 ? PAL.accent : PAL.rail, 0.55);
        ctx.lineWidth = clamp(0.25 * s, 1, 12);
        ctx.beginPath(); ctx.arc(bx, cy, r * 1.04, Math.PI, 0); ctx.stroke();
        ctx.beginPath(); ctx.arc(bx, cy, r * 0.96, Math.PI, 0); ctx.stroke();
        // running lights
        const n = 9, ph = (G.t * 1.5) % 1;
        for (let i = 0; i < n; i++) {
          const ang = Math.PI + Math.PI * ((i + ph) / n);
          glow(SPR.white, bx + Math.cos(ang) * r, cy + Math.sin(ang) * r, 0.5 * s + 2, 0.5 * s + 2, a * 0.7);
        }
        ctx.globalCompositeOperation = 'source-over';
        break;
      }
      case 'poly': {
        // a slowly tumbling wireframe octahedron
        const cy = gy(o.y + Math.sin(G.t + o.seed) * 0.5, z), r = o.w * s;
        const t1 = G.t * 0.7 + o.seed, t2 = G.t * 0.45 + o.seed * 2;
        const c1 = Math.cos(t1), s1 = Math.sin(t1), c2 = Math.cos(t2), s2 = Math.sin(t2);
        // 6 vertices: ±x, ±y, ±z rotated
        const P = o.pts;
        for (let i = 0; i < 6; i++) {
          const vx = OCTA_V[i * 3], vy = OCTA_V[i * 3 + 1], vz = OCTA_V[i * 3 + 2];
          const x1 = vx * c1 - vz * s1, z1 = vx * s1 + vz * c1;
          const y1 = vy * c2 - z1 * s2;
          P[i * 2] = bx + x1 * r; P[i * 2 + 1] = cy + y1 * r;
        }
        ctx.globalAlpha = a;
        ctx.globalCompositeOperation = 'lighter';
        glow(SPR.violet, bx, cy, r * 1.6, r * 1.6, a * 0.35);
        ctx.strokeStyle = rgba(o.alt < 0.5 ? PAL.accent : edgeRGB, 0.8);
        ctx.lineWidth = clamp(0.08 * s, 1, 3);
        ctx.beginPath();
        for (let q = 0; q < 24; q += 2) { const i = OCTA_EDGES[q], j = OCTA_EDGES[q + 1]; ctx.moveTo(P[i * 2], P[i * 2 + 1]); ctx.lineTo(P[j * 2], P[j * 2 + 1]); }
        ctx.stroke();

        ctx.globalCompositeOperation = 'lighter';
        const bw = clamp(0.7 * s, 1.5, 22);
        const pulse = 0.6 + 0.4 * Math.sin(G.t * 3 + o.seed);
        ctx.globalAlpha = a * 0.16 * pulse;
        ctx.fillStyle = rgba(edgeRGB, 1);
        ctx.fillRect(bx - bw, -OS, bw * 2, by + OS);
        ctx.globalAlpha = a * 0.45 * pulse;
        ctx.fillRect(bx - bw * 0.2, -OS, bw * 0.4, by + OS);
        glow(SPR.teal, bx, by, bw * 4, bw * 1.2, a * 0.7);
        ctx.globalCompositeOperation = 'source-over';
        break;
      }
    }

  ctx.globalAlpha = 1;

// depth bands for the road cut-out (closer together near the camera, where it matters most)

// ---------- Spawning ----------
function addObj(type, x, d, w, extra) {
  const o = Object.assign({ kind: 'obj', type, x, d, w, h: 1, dep: 0.6, y: 0, hp: Infinity, hit: false, t: Math.random() * 10 }, extra);
  objs.push(o);
  return o;
}
function addPylon(x, d) { return addObj('pylon', x, d, 0.9, { h: 4.8, dep: 0.9 }); }
function addMine(x, d) { return addObj('mine', x, d, 0.7, { h: 0.7, dep: 0.7, y: 0.25, hp: 2, pts: 50 }); }
function addWallSpan(x1, x2, d) {
  if (x2 - x1 < 0.15) return;
  addObj('wall', (x1 + x2) / 2, d, x2 - x1, { h: 1.1, dep: 0.5 });
}
function addRamp(x, d) { return addObj('ramp', x, d, RAMP_W, { h: RAMP_H, dep: RAMP_LEN }); }
// Things that move side to side follow a smooth, steady swing, so you can read them.
function swing(base, amp, freq) { return { base, amp, freq, ph: rand(0, 6.283) }; }
function addLaserFence(d, gapW, amp, freq) {
  const half = TRACK_HALF;
  const lim = half - gapW / 2 - 0.25;
  const base = rand(-lim + amp, lim - amp) * 0.6;
  const fence = { base, amp: Math.min(amp, lim - Math.abs(base)), freq, ph: rand(0, 6.283), gw: gapW };
  moveObj(addObj('laser', 0, d, 1, { h: 1.1, dep: 0.3, side: -1, fence }));
  moveObj(addObj('laser', 0, d, 1, { h: 1.1, dep: 0.3, side: 1, fence }));
}
function moveObj(o) {
  if (o.osc) {
    o.x = o.osc.base + o.osc.amp * Math.sin(G.t * o.osc.freq + o.osc.ph);
  } else if (o.fence) {
    const F = o.fence;
    const gc = F.base + F.amp * Math.sin(G.t * F.freq + F.ph);
    const x1 = o.side < 0 ? -TRACK_HALF : gc + F.gw / 2;
    const x2 = o.side < 0 ? gc - F.gw / 2 : TRACK_HALF;
    o.x = (x1 + x2) / 2;
    o.w = Math.max(0.05, x2 - x1);
  }
}
function addEnemy(type, props) {
  const e = Object.assign({ kind: 'enemy', type, t: 0, flashT: 0, dep: 1 }, props);
  enemies.push(e);
  return e;
}
function activeDrones() {
  let n = 0;
  for (const e of enemies) if (e.type === 'drone' && e.mode !== 'leave') n++;
  return n;
}

function spawnDrone(at, lvl) {
  const behind = Math.random() < 0.4;
  const x = rand(-TRACK_HALF + 1, TRACK_HALF - 1);
  return addEnemy('drone', {
    x, tx: x, y: behind ? 3.2 : 0.95, rel: behind ? -12 : at - G.d,
    mode: behind ? 'wait' : 'enter', waitUntil: at - SPAWN_AHEAD + rand(40, 90),
    target: rand(30, 52), hp: 3, pts: 250, w: 1.3, d: at,
    fireT: rand(0.6, 1.2), stay: rand(7, 10), retarget: 0,
  });
}

function spawnPattern(at) {
  const lvl = G.d / 1000;
  let name = weighted(PATTERNS.filter((p) => lvl >= p.min)).name;
  const droneCap = Math.min(3, 1 + Math.floor(lvl / 1.5));
  if ((name === 'drones' || name === 'mixed') && activeDrones() >= droneCap) name = 'mines';
  const half = TRACK_HALF;

  if (name === 'pylons') {
    const n = Math.min(9, 3 + Math.floor(Math.random() * 3 + lvl));
    let d = at;
    for (let i = 0; i < n; i++) {
      addPylon(rand(-half + 0.6, half - 0.6), d);
      d += rand(8, 16);
    }
    return d - at;
  }
  if (name === 'mines') {
    const n = Math.min(10, 4 + Math.floor(lvl * 1.5));
    for (let i = 0; i < n; i++) addMine(rand(-half + 0.5, half - 0.5), at + rand(0, 40));
    return 40;
  }
  if (name === 'wall') {
    const count = lvl > 2 ? 2 : 1;
    const gapW = Math.max(1.7, 2.9 - lvl * 0.15);
    let gc = rand(-half + gapW / 2 + 0.3, half - gapW / 2 - 0.3);
    for (let k = 0; k < count; k++) {
      if (k > 0) gc = clamp(gc + rand(-4, 4), -half + gapW / 2 + 0.3, half - gapW / 2 - 0.3);
      addWallSpan(-half, gc - gapW / 2, at + k * 34);
      addWallSpan(gc + gapW / 2, half, at + k * 34);
    }
    return (count - 1) * 34 + 6;
  }
  if (name === 'slalom') {
    const n = 4 + Math.floor(Math.random() * 3);
    const step = Math.max(22, 34 - lvl * 2.5);
    let side = Math.random() < 0.5 ? -1 : 1;
    for (let i = 0; i < n; i++) {
      const edge = side * half;
      const inner = side * -0.2;
      addWallSpan(Math.min(edge, inner), Math.max(edge, inner), at + i * step);
      side = -side;
    }
    return (n - 1) * step + 6;
  }
  if (name === 'shuttle') {
    // pylons gliding back and forth across the track
    const n = Math.min(6, 3 + Math.floor(Math.random() * 2 + lvl * 0.5));
    let d = at;
    for (let i = 0; i < n; i++) {
      const amp = rand(2.2, 3.6);
      const o = addPylon(0, d);
      o.osc = swing(rand(-half + 0.6 + amp, half - 0.6 - amp), amp, rand(1.1, 1.6) + lvl * 0.06);
      moveObj(o);
      d += rand(20, 28) - Math.min(4, lvl);
    }
    return d - at;
  }
  if (name === 'snake') {
    // a line of mines swaying like a snake: weave through the gaps or shoot your way in
    const n = 7 + Math.min(4, Math.floor(lvl));
    const amp = rand(2.8, 3.8), freq = rand(1.1, 1.5), ph = rand(0, 6.283), step = 7;
    for (let i = 0; i < n; i++) {
      const o = addMine(0, at + i * step);
      o.osc = { base: 0, amp, freq, ph: ph + i * 0.55 };
      moveObj(o);
    }
    return (n - 1) * step + 6;
  }
  if (name === 'sweeper') {
    // a laser fence across the track; its gap slides from side to side
    const count = lvl > 2.5 ? 2 : 1;
    const gapW = Math.max(2.2, 3.3 - lvl * 0.12);
    for (let k = 0; k < count; k++) addLaserFence(at + k * 36, gapW, rand(2, 3.2), rand(0.9, 1.3) + lvl * 0.05);
    return (count - 1) * 36 + 6;
  }
  if (name === 'drones') {
    const n = Math.min(droneCap - activeDrones(), lvl > 3 ? 2 : 1);
    for (let i = 0; i < Math.max(1, n); i++) spawnDrone(at + i * 20, lvl);
    return 50;
  }
  if (name === 'turrets') {
    const n = 2 + (lvl > 3 ? 1 : 0);
    let side = pick([-1, 1]);
    for (let i = 0; i < n; i++) {
      const x = Math.random() < 0.25 ? rand(-1.5, 1.5) : side * rand(half - 2.2, half - 0.8);
      addEnemy('turret', { x, d: at + i * 28, y: 0, hp: 3, pts: 200, w: 1.0, fireT: rand(0.2, 0.9) });
      side = -side;
    }
    return n * 28;
  }
  if (name === 'rams') {
    const n = Math.min(5, 2 + Math.floor(lvl / 1.5));
    let d = at;
    for (let i = 0; i < n; i++) {
      addEnemy('ram', { x: rand(-half + 0.8, half - 0.8), d, y: 0.42, vd: -18, hp: 2, pts: 150, w: 0.8, steer: 2 + lvl * 0.35 });
      d += rand(18, 28);
    }
    return d - at;
  }
  if (name === 'jump') {
    // A ramp, then something to fly over. Early on it's a cluster of mines you can jump
    // for an AIR bonus (or just steer around). Later it can be a barrier across the whole
    // track that you can only clear by taking the ramp.
    const rx = rand(-half + RAMP_W / 2 + 0.2, half - RAMP_W / 2 - 0.2);
    addRamp(rx, at);
    const v = 32 + 58 * (1 - Math.exp(-at / 4500));   // about how fast you'll be going there
    const flight = v * JUMP_T;
    const end = at + RAMP_LEN;
    if (lvl >= 1.2 && Math.random() < 0.55) {
      addObj('wall', 0, end + flight * 0.42, half * 2, { h: 1.2, dep: 0.5, jump: true });
    } else {
      const n = 3 + Math.floor(Math.random() * 3);
      for (let i = 0; i < n; i++) addMine(clamp(rx + rand(-1.3, 1.3), -half + 0.5, half - 0.5), end + flight * rand(0.25, 0.7));
    }
    return RAMP_LEN + flight;
  }
  // mixed: a pylon field with a drone overhead
  let d = at;
  const n = 3 + Math.floor(Math.random() * 3);
  for (let i = 0; i < n; i++) {
    addPylon(rand(-half + 0.6, half - 0.6), d);
    d += rand(10, 18);
  }
  spawnDrone(at, lvl);
  return d - at;
}

function choosePowers() {
  const opts = [
    // things you've maxed out stop showing up
    { k: 'shield', w: G.shield >= 2 ? 0 : 3 },
    { k: 'weapon', w: G.weapon >= GUN_MAX ? 0 : G.weapon >= 4 ? 2.4 : 3.2 },
    { k: 'rapid', w: 2.4 },
    { k: 'repair', w: G.hull < MAX_HULL ? 3.5 : 0.3 },
    { k: 'missile', w: 1.9 },
    { k: 'mult', w: G.mult > 0 ? 0.8 : 1.8 },
  ].filter((o) => o.w > 0);
  const a = weighted(opts);
  const b = weighted(opts.filter((o) => o !== a));
  return [a.k, b.k];
}

function spawnGates(at) {
  const types = choosePowers();
  const pair = { resolved: false, gates: [] };
  const off = 2.6;
  [-off, off].forEach((x, i) => {
    const g = { kind: 'gate', x, d: at, w: 3.0, h: 2.6, type: types[i], pair, alpha: 1, taken: false, missed: false };
    pair.gates.push(g);
    gates.push(g);
  });
  // Risk vs reward: sometimes one gate is guarded by mines you need to shoot or weave past.
  if (G.d > 500 && Math.random() < 0.5) {
    const gx = pick([-off, off]);
    const n = 2 + (G.d > 2500 ? 1 : 0);
    for (let i = 0; i < n; i++) addMine(gx + rand(-0.9, 0.9), at - 14 - i * 8);
  }
}

function runSpawner() {
  const ahead = G.d + SPAWN_AHEAD;
  while (G.nextSpawn < ahead) {
    let at = G.nextSpawn;
    if (G.nextGate < at + 60) {
      at = Math.max(at, G.nextGate);
      spawnGates(at);
      G.nextGate = at + rand(620, 860);
      G.nextSpawn = at + 45;
      continue;
    }
    const len = spawnPattern(at);
    const lvl = G.d / 1000;
    G.nextSpawn = at + len + Math.max(14, 42 - lvl * 5) + rand(0, 16);
  }
}

// ---------- Combat ----------
function scoreX() { return G.mult > 0 ? G.mx : 1; }
function addScore(n) { G.score += n * scoreX(); }

function toast(text, color, sub) {
  G.toast = text;
  G.toastSub = sub || '';
  G.toastColor = color || '#fff';
  G.toastT = sub ? 1.9 : 1.4;
}

function popup(text, x, y, d, color) {
  const z = d - VIEW_D;
  if (z < 1) return;
  popups.push({ text, x: sx(x, z), y: sy(y + 0.6, z), t: 0, color: color || '#fff' });
}

function burst(x, y, d, color, n, spd, vdBase, life) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = rand(0.3, 1) * spd;
    parts.push({
      kind: 'part', x, y, d,
      vx: Math.cos(a) * v, vy: Math.abs(Math.sin(a)) * v * 0.9 + rand(0, 2),
      vd: vdBase + rand(-1, 1) * spd,
      life: rand(0.5, 1) * (life || 0.8), max: life || 0.8,
      color, size: rand(0.04, 0.1),
    });
  }
}

function explode(x, y, d, color, big, vdBase) {
  burst(x, y, d, color, big ? 34 : 14, big ? 7 : 4, vdBase || 0, big ? 1 : 0.6);
  burst(x, y, d, '#fff4c0', big ? 12 : 5, big ? 4 : 2, vdBase || 0, 0.4);
  G.shake = Math.max(G.shake, big ? 0.35 : 0.15);
  if (big) sfx.boom(); else sfx.pop();
}

function killEnemy(e) {
  if (e.dead) return;
  e.dead = true;
  G.kills++;
  addScore(e.pts);
  const vd = e.type === 'drone' ? G.speed * 0.9 : (e.vd || 0);
  explode(e.x, e.y + 0.3, e.d, COLORS.red, true, vd);
  burst(e.x, e.y + 0.3, e.d, COLORS.orange, 14, 5, vd, 0.8);
  popup('+' + e.pts * scoreX(), e.x, e.y, e.d, COLORS.yellow);
}

function hurt() {
  if (G.invuln > 0 || !player.alive) return false;
  if (G.shield > 0) {
    G.shield--;
    G.invuln = 0.9;
    G.flash = 0.6; G.flashColor = COLORS.cyan;
    G.shake = Math.max(G.shake, 0.3);
    burst(player.x, 0.5, G.d, COLORS.cyan, 26, 5, G.speed, 0.6);
    sfx.shield();
    vibrate(40);
    return true;
  }
  G.hull--;
  G.invuln = 1.6;
  G.slow = 1.0;
  G.flash = 0.9; G.flashColor = COLORS.red;
  G.shake = Math.max(G.shake, 0.6);
  burst(player.x, 0.5, G.d, COLORS.orange, 24, 5, G.speed * 0.8, 0.7);
  sfx.hurt();
  vibrate(90);
  if (G.hull <= 0) die();
  return true;
}

function die() {
  player.alive = false;
  G.state = 'dying';
  G.overT = 0;
  G.flash = 1; G.flashColor = '#ffffff';
  G.shake = 1.1;
  burst(player.x, 0.5, G.d, COLORS.cyan, 50, 9, G.speed * 0.5, 1.4);
  burst(player.x, 0.5, G.d, COLORS.pink, 40, 7, G.speed * 0.5, 1.2);
  burst(player.x, 0.5, G.d, '#fff4c0', 30, 5, G.speed * 0.5, 0.8);
  sfx.bigBoom();
  vibrate([70, 40, 160]);
}

// ---------- Missiles ----------
// MISSILES power-up: a swarm of 8 homing missiles fans out from the speeder, picks
// targets ahead (enemies first, then mines) and hunts them down. Gun level 6+ also
// fires the odd single "wing missile". Missiles fly in track space like everything else.
const SWARM_N = 8;
function missileTargets(maxRel) {
  const list = [];
  for (const e of enemies) {
    const rel = e.d - G.d;
    if (!e.dead && e.mode !== 'wait' && rel > 4 && rel < maxRel) list.push({ t: e, rel, prio: 0 });
  }
  for (const o of objs) {
    const rel = o.d - G.d;
    if (!o.dead && o.type === 'mine' && rel > 4 && rel < maxRel) list.push({ t: o, rel, prio: 1 });
  }
  list.sort((a, b) => (a.prio - b.prio) || (a.rel - b.rel));
  return list.map((it) => it.t);
}
function claimed(t) {
  let n = 0;
  for (const m of missiles) if (m.target === t) n++;
  return n;
}
function addMissile(side, wait, target, wing) {
  const m = {
    kind: 'missile', x: player.x, y: player.y + 0.5, d: G.d + 0.3,
    vx: side * rand(4, 9), vy: rand(5, 8), vd: G.speed + rand(8, 22),
    t: 0, wait, life: 3.6, target, wing: !!wing, dmg: wing ? 2 : 3,
    tx: new Float32Array(8), ty: new Float32Array(8), td: new Float32Array(8), tn: 0, tk: 0, tT: 0,
  };
  missiles.push(m);
  return m;
}
function missileSwarm() {
  const targets = missileTargets(200);
  // one missile per target to start; spare missiles double up on enemies
  const plan = targets.slice(0, SWARM_N);
  const foes = targets.filter((t) => t.kind === 'enemy');
  for (let i = 0; plan.length < SWARM_N && i < foes.length; i++) plan.push(foes[i]);
  for (let i = 0; i < SWARM_N; i++) addMissile(i % 2 ? 1 : -1, i * 0.055, plan[i] || null, false);
  for (const s of eshots) s.dead = true;   // the launch blast also knocks out incoming fire
  G.flash = 0.5; G.flashColor = POWERS.missile.color;
  G.shake = Math.max(G.shake, 0.35);
  sfx.swarm();
}
function wingMissile() {
  const targets = missileTargets(150).filter((t) => claimed(t) === 0);
  if (!targets.length) return false;
  G.wingSide = -(G.wingSide || 1);
  addMissile(G.wingSide, 0, targets[0], true);
  sfx.wing();
  return true;
}
function missileHit(m, t) {
  const vd = t.type === 'drone' ? G.speed : 0;
  if (t.kind === 'enemy') {
    t.hp -= m.dmg;
    t.flashT = 0.1;
