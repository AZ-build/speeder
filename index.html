// ---------- Leaderboard: world (Firebase, loaded only when needed) ----------
const FB = { ready: null, db: null, fs: null };

function withTimeout(promise, ms) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms)),
  ]);
}

function firebase() {
  if (!FB.ready) {
    FB.ready = (async () => {
      const appMod = await import(FIREBASE_SDK + 'firebase-app.js');
      const fs = await import(FIREBASE_SDK + 'firebase-firestore-lite.js');
      const app = appMod.initializeApp(FIREBASE_CONFIG, 'speeder');
      FB.db = fs.getFirestore(app);
      FB.fs = fs;
      return FB;
    })();
    FB.ready.catch(() => { FB.ready = null; });
  }
  return withTimeout(FB.ready, 9000);
}

function playerId() {
  let id = storeGet('speeder.pid');
  if (!id) {
    const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
    id = 'p';
    for (let i = 0; i < 19; i++) id += chars[(Math.random() * chars.length) | 0];
    storeSet('speeder.pid', id);
  }
  return id;
}
function onlineBest() { return parseInt(storeGet('speeder.onlineBest') || '0', 10) || 0; }
function readJSON(key, fallback) {
  try { const v = JSON.parse(storeGet(key) || 'null'); return v == null ? fallback : v; } catch (e) { return fallback; }
}

// Every run is its own leaderboard entry (one player can hold several spots).
// Entry IDs start with the player's ID, so we can tell which ones are yours.
// (Before v0.5 there was one entry per player, stored under the bare player ID.)
const BOARD_N = 25;
function isMine(id) {
  const pid = playerId();
  return !!id && (id === pid || id.indexOf(pid + '_') === 0);
}
function newRunId() {
  return playerId() + '_' + Date.now().toString(36) + Math.floor(Math.random() * 1296).toString(36);
}
function myRuns() { return readJSON('speeder.myRuns', []); }
function rememberRun(run) {
  const list = myRuns().filter((r) => r.id !== run.id);
  list.push({ id: run.id, score: run.score, dist: run.dist, kills: run.kills });
  list.sort((x, y) => y.score - x.score);
  storeSet('speeder.myRuns', JSON.stringify(list.slice(0, 40)));
}
function pendingRuns() {
  const list = readJSON('speeder.pendingRuns', []);
  // a score left waiting by an older version
  const old = readJSON('speeder.pending', null);
  if (old && old.score > 0 && !old.id) {
    list.push(Object.assign({ id: newRunId() }, old));
    storeSet('speeder.pending', '');
    storeSet('speeder.pendingRuns', JSON.stringify(list));
  }
  return Array.isArray(list) ? list : [];
}
function setPending(list) { storeSet('speeder.pendingRuns', JSON.stringify(list.slice(-10))); }

async function writeRun(run) {
  const F = await firebase();
  const { doc, setDoc, serverTimestamp } = F.fs;
  await withTimeout(setDoc(doc(F.db, SCORES, run.id), {
    name: SET.name,
    score: run.score,
    dist: run.dist,
    kills: run.kills,
    v: VERSION,
    ts: serverTimestamp(),
  }), 9000);
  rememberRun(run);
  if (run.score > onlineBest()) storeSet('speeder.onlineBest', String(run.score));
  // keep the remembered top list in step, so the next run's ladder is right
  const top = cachedTop().filter((r) => r.id !== run.id);
  top.push({ id: run.id, name: SET.name, score: run.score });
  top.sort((x, y) => y.score - x.score);
  storeSet('speeder.worldTop', JSON.stringify(top.slice(0, BOARD_N)));
  setPending(pendingRuns().filter((r) => r.id !== run.id));
}

// The current world top list. Also remembered on the device, so the "next to beat"
// ladder works during a run even with no signal.
async function fetchTop() {
  const F = await firebase();
  const { collection, query, orderBy, limit, getDocs } = F.fs;
  const snap = await withTimeout(getDocs(query(collection(F.db, SCORES), orderBy('score', 'desc'), limit(BOARD_N))), 9000);
  const rows = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
  storeSet('speeder.worldTop', JSON.stringify(rows.map((r) => ({ id: r.id, name: cleanName(r.name), score: Number(r.score) || 0 }))));
  return rows;
}
function cachedTop() { const t = readJSON('speeder.worldTop', []); return Array.isArray(t) ? t : []; }

async function worldRank(score) {
  try {
    const F = await firebase();
    const { collection, query, where, getCount } = F.fs;
    if (!getCount) return 0;
    const snap = await withTimeout(getCount(query(collection(F.db, SCORES), where('score', '>', score))), 9000);
    return snap.data().count + 1;
  } catch (e) {
    return 0;
  }
}

// Scores that couldn't upload earlier get another try.
async function retryPending() {
  if (!SET.name) return;
  for (const run of pendingRuns()) {
    try {
      await writeRun(run);
    } catch (e) {
      // turned down by the database rules: retrying won't help, so let it go
      if (e && e.code === 'permission-denied') { setPending(pendingRuns().filter((r) => r.id !== run.id)); continue; }
      return;   // still offline
    }
  }
}

// Changing your name re-saves your board entries under the new name.
async function renameOnline() {
  if (!SET.name) return;
  const runs = myRuns().slice(0, 25);
  const legacy = readJSON('speeder.onlineRun', null);   // the single entry from before v0.5
  if (legacy && legacy.score > 0) runs.push(Object.assign({}, legacy, { id: playerId() }));
  for (const run of runs) {
    try { await writeRun(run); } catch (e) { return; /* will be corrected on the next upload */ }
  }
}

let boardTab = 'world';
let boardReq = 0;

function renderRows(rows, mine, highlightId) {
  const list = $('boardList');
  list.textContent = '';
  rows.forEach((r, i) => {
    const li = document.createElement('li');
    if (mine && isMine(r.id)) li.classList.add('me');
    if (highlightId && r.id === highlightId) li.classList.add('fresh');
    if (i < 3) li.classList.add('top');
    const rank = document.createElement('span');
    rank.className = 'rank';
    rank.textContent = String(i + 1);
    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = cleanName(r.name) || '???';
    const sc = document.createElement('span');
    sc.className = 'sc';
    sc.textContent = (Number(r.score) || 0).toLocaleString();
    if (r.dist) {
      const small = document.createElement('small');
      small.textContent = (Number(r.dist) / 1000).toFixed(2) + ' km';
      sc.appendChild(small);
    }
    li.append(rank, nm, sc);
    list.appendChild(li);
  });
  const fresh = list.querySelector('.fresh');
  if (fresh && fresh.scrollIntoView) fresh.scrollIntoView({ block: 'nearest' });
}

async function loadBoard(tab) {
  boardTab = tab;
  const req = ++boardReq;
  $('tabWorld').setAttribute('aria-selected', String(tab === 'world'));
  $('tabLocal').setAttribute('aria-selected', String(tab === 'local'));
  const status = $('boardStatus');
  if (tab === 'local') {
    const rows = localBoard();
    renderRows(rows, false);
    status.textContent = rows.length ? 'Your 10 best runs on this device.' : 'No runs yet. Go ride!';
    return;
  }
  $('boardList').textContent = '';
  status.textContent = 'Loading the world leaderboard…';
  try {
    await retryPending();
    const rows = await fetchTop();
    if (req !== boardReq) return;
    renderRows(rows, true, lastRun && lastRun.id);
    const mineN = rows.filter((r) => isMine(r.id)).length;
    if (!rows.length) status.textContent = 'No scores yet. Be the first!';
    else if (!SET.name) status.textContent = 'Top ' + rows.length + ' runs in the world. Finish a run to add your name.';
    else status.textContent = 'Top ' + rows.length + ' runs in the world.' + (mineN ? ' You hold ' + mineN + (mineN === 1 ? ' spot.' : ' spots.') : '');
  } catch (e) {
    if (req !== boardReq) return;
    renderRows(localBoard(), false);
    status.textContent = 'Can’t reach the world leaderboard right now, so this shows your runs on this device.';
  }
}

// ---------- Challenges: "beat my score" links ----------
// A shared link looks like .../speeder/?c=45210&n=ADRIAN. Opening it sets a target
// for your runs until you beat it.
let CHALLENGE = readJSON('speeder.challenge', null);
(function readChallengeLink() {

function shareUrl() {

}

// ---------- The ladder: who you're about to pass during a run ----------
function buildLadder() {
  const L = [];
  const top = cachedTop();
  top.forEach((r, i) => {
    if (r.score > 0 && !isMine(r.id)) L.push({ score: r.score, label: '#' + (i + 1) + ' ' + (r.name || '???'), color: i === 0 ? COLORS.yellow : '#cbb7ff', kind: i === 0 ? 'record' : 'world' });
  });
  if (G.best > 0) L.push({ score: G.best, label: 'YOUR BEST', color: COLORS.yellow, kind: 'best' });
  if (CHALLENGE) L.push({ score: CHALLENGE.score, label: 'BEAT ' + CHALLENGE.name, color: COLORS.pink, kind: 'challenge' });
  L.sort((x, y) => x.score - y.score);
  G.ladder = L;
  // start at the first score you haven't passed yet (this also runs mid-run when fresh scores arrive)
  G.rung = 0;
  while (G.rung < L.length && L[G.rung].score < G.score) G.rung++;
  G.passT = 0;
}
function nextRung() {
  if (G.passT > 0) return { label: G.passText, score: G.passScore, color: '#ffffff' };
  return G.ladder && G.ladder[G.rung] || null;
}
function updateLadder(dt) {
  if (G.passT > 0) G.passT -= dt;
  const L = G.ladder;
  if (!L) return;
  while (G.rung < L.length && G.score > L[G.rung].score) {
    const r = L[G.rung++];
    if (r.kind === 'best') { toast('NEW BEST!', COLORS.yellow, 'keep going!'); sfx.fanfare(); vibrate([30, 40, 30]); }
    else if (r.kind === 'challenge') { toast('YOU BEAT ' + CHALLENGE.name + '!', COLORS.pink, 'challenge complete'); sfx.fanfare(); vibrate([30, 40, 30]); }
    else if (r.kind === 'record') { toast('WORLD #1 PACE!', COLORS.yellow, 'record in sight'); sfx.fanfare(); vibrate([30, 40, 30]); }
    else {
      sfx.pass();
      G.passT = 1.4;
      G.passText = 'PASSED ' + r.label.replace(/^#\d+ /, '');
      G.passScore = r.score;
    }
  }
}

// ---------- Screens ----------
function updateTitleBest() {
  $('titleBest').textContent = G.best > 0 ? 'BEST  ' + G.best.toLocaleString() : '';
  const ch = $('titleChallenge');
  if (CHALLENGE) {
    ch.textContent = CHALLENGE.name + ' challenged you: beat ' + CHALLENGE.score.toLocaleString();
    ch.classList.remove('hidden');
  } else {
    ch.classList.add('hidden');
  }
}

function startGame() {
  clearPanels();
  stopConfetti();
  resetRun();
  buildLadder();
  G.state = 'play';
  paused = false;
  resumeT = 0;
  hide('countdown');
  show('pauseBtn');
}

let lastRun = null;
let shareFile = null;

// How big a deal is this run? Shown at the top of the game-over screen.
function celebrate(run) {
  const el = $('celebrate');
  const rank = run.rank;
  let title = '', sub = '', cls = '', level = 0;
  if (rank === 1) { title = 'NEW WORLD RECORD!'; cls = 'gold'; level = 3; }
  else if (rank && rank <= 3) { title = '#' + rank + ' IN THE WORLD!'; cls = 'gold'; level = 2; }
  else if (rank && rank <= BOARD_N) { title = '#' + rank + ' IN THE WORLD!'; cls = 'cyan'; level = 2; }
  else if (run.isBest) { title = 'NEW PERSONAL BEST!'; cls = 'yellow'; level = 1; }
  if (title && run.isBest && level >= 2) sub = 'and a new personal best';
  if (run.beatChallenge) sub = (sub ? sub + ' · ' : '') + 'you beat ' + run.beatChallenge + '!';
  if (!title && run.beatChallenge) { title = 'CHALLENGE BEATEN!'; cls = 'pink'; level = 1; sub = 'you beat ' + run.beatChallenge + '!'; }
  $('wrecked').classList.toggle('small', level > 0);
  if (!title) { el.classList.add('hidden'); return; }
  el.className = 'celebrate ' + cls;
  $('celebrateTitle').textContent = title;
  $('celebrateSub').textContent = sub;
  $('newBest').classList.add('hidden');
  if (level > (run.shownLevel || 0)) {
    run.shownLevel = level;
    startConfetti(level);
    sfx.fanfare();
    vibrate(level >= 2 ? [60, 50, 60, 50, 160] : [40, 40, 80]);
  }
}

function showOver() {
  G.state = 'over';
  G.overT = 0;
  hide('pauseBtn');
  const score = Math.floor(G.score);
  const prevBest = G.best;
  const run = { id: newRunId(), score, dist: Math.round(G.d * UNIT_M), kills: G.kills, rank: 0, isBest: score > prevBest && score > 0 };
  if (CHALLENGE && score > CHALLENGE.score) {
    run.beatChallenge = CHALLENGE.name;
    CHALLENGE = null;
    storeSet('speeder.challenge', '');
    updateTitleBest();
  }
  lastRun = run;
  if (run.isBest) {
    G.best = score;
    storeSet('speeder.best', String(score));
  }
  addLocalRun(run);
  $('finalScore').textContent = score.toLocaleString();
  $('newBest').classList.toggle('hidden', !run.isBest);
  $('celebrate').classList.add('hidden');
  $('wrecked').classList.remove('small');
  const dist = (run.dist / 1000).toFixed(2);
  $('stats').innerHTML =
    'Distance <b>' + dist + ' km</b><br>' +
    'Enemies destroyed <b>' + G.kills + '</b><br>' +
    'Best <b>' + G.best.toLocaleString() + '</b>';

  const status = $('saveStatus');
  status.textContent = '';
  const needsName = !SET.name && score > 0;
  $('nameBox').classList.toggle('hidden', !needsName);
  if (needsName) $('nameInput').value = '';
  celebrate(run);
  makeShareCard(run);
  checkRun(run, status);

  clearPanels();
  openPanel('over');
  const again = $('againBtn');
  again.disabled = true;
  setTimeout(() => { again.disabled = false; }, 700);
}

// Where does this run land in the world? Upload it if it makes the board (or is your best).
async function checkRun(run, statusEl) {
  const say = (t) => { if (statusEl && lastRun === run) statusEl.textContent = t; };
  if (run.score <= 0) return;
  say('Checking the world leaderboard…');
  let rows = null;
  try { await retryPending(); rows = await fetchTop(); } catch (e) { rows = null; }
  if (lastRun !== run) return;
  if (rows) {
    const above = rows.filter((r) => r.id !== run.id && (Number(r.score) || 0) >= run.score).length;
    run.rank = above < BOARD_N ? above + 1 : 0;
  }
  celebrate(run);
  makeShareCard(run);
  const qualifies = run.rank > 0 || run.score > onlineBest();
  if (!rows) {
    if (SET.name && qualifies) setPending(pendingRuns().concat([run]));
    say('Couldn’t reach the world leaderboard. Your score is kept on this device' + (SET.name ? ' and will upload when you’re back online.' : '.'));
    return;
  }
  if (!SET.name) {
    say(run.rank ? 'Add your name to claim spot #' + run.rank + '!' : 'Add your name to join the world leaderboard.');
    return;
  }
  if (!qualifies) {
    const r = await worldRank(run.score);
    say(r ? 'That’s #' + r.toLocaleString() + ' in the world. Top ' + BOARD_N + ' needs ' + (Number(rows[rows.length - 1].score) + 1).toLocaleString() + '.' : '');
    return;
  }
  say('Saving to the world leaderboard…');
  try {
    await writeRun(run);
    if (run.rank) say('Saved as ' + SET.name + '. You’re #' + run.rank + ' in the world!');
    else {
      const r = await worldRank(run.score);
      say('Saved as ' + SET.name + (r ? '. That’s #' + r.toLocaleString() + ' in the world.' : '.'));
    }
  } catch (e) {
    if (e && e.code === 'permission-denied') {
      say('The world leaderboard didn’t accept this score. It’s saved on this device.');
      return;
    }
    setPending(pendingRuns().concat([run]));
    say('Couldn’t save to the world leaderboard just now. Your score is kept and will upload later.');
  }
}

function saveNameAndScore() {
  const name = cleanName($('nameInput').value);
  if (!name) {
    $('saveStatus').textContent = 'Type a name first (letters and numbers, up to 12).';
    $('nameInput').focus();
    return;
  }
  SET.name = name;
  saveSettings();
  // earlier runs on this device were saved as "YOU" before you had a name
  const rows = localBoard().map((r) => (r.name === 'YOU' ? Object.assign(r, { name }) : r));
  storeSet('speeder.local', JSON.stringify(rows));
  $('nameInput').blur();
  $('nameBox').classList.add('hidden');
  if (lastRun) { makeShareCard(lastRun); checkRun(lastRun, $('saveStatus')); }
}

// ---------- Sharing ----------
function shareText(run) {
  const sc = run.score.toLocaleString();
  if (run.rank === 1) return 'I just set the WORLD RECORD on SPEEDER: ' + sc + ' points! Come beat me:';
  if (run.rank) return 'I’m #' + run.rank + ' in the world on SPEEDER with ' + sc + ' points. Can you beat me?';
  return 'I scored ' + sc + ' on SPEEDER (' + (run.dist / 1000).toFixed(1) + ' km). Can you beat me?';
}
function challengeUrl(run) {
  return shareUrl() + '?c=' + run.score + (SET.name ? '&n=' + encodeURIComponent(SET.name) : '');
}

// A picture of your score, made on the spot, to send along with the link.
function makeShareCard(run) {
  shareFile = null;
  try {
    const W2 = 1080, H2 = 1350;
    const c = makeCanvas(W2, H2), g = c.getContext('2d');
    const bg = g.createLinearGradient(0, 0, 0, H2);
    bg.addColorStop(0, '#12052e'); bg.addColorStop(0.55, '#2a0a4a'); bg.addColorStop(1, '#0b0420');
    g.fillStyle = bg; g.fillRect(0, 0, W2, H2);
    // striped sun
    const sy0 = 900, sr = 230;
    const sun = g.createLinearGradient(0, sy0 - sr, 0, sy0 + sr);
    sun.addColorStop(0, '#ffe66b'); sun.addColorStop(0.5, '#ff4fa8'); sun.addColorStop(1, '#8a2be2');
    g.save();
    g.beginPath(); g.arc(W2 / 2, sy0, sr, Math.PI, 0); g.closePath(); g.clip();
    g.fillStyle = sun; g.fillRect(0, sy0 - sr, W2, sr);
    g.fillStyle = '#2a0a4a';
    for (let i = 0; i < 7; i++) g.fillRect(0, sy0 - 100 + i * 15 + i * i * 1.2, W2, 3 + i * 2);
    g.restore();
    // neon grid floor
    g.fillStyle = '#12032a'; g.fillRect(0, sy0, W2, H2 - sy0);
    g.strokeStyle = 'rgba(255, 43, 214, 0.75)'; g.lineWidth = 3;
    g.beginPath();
    for (let i = -12; i <= 12; i++) { g.moveTo(W2 / 2 + i * 18, sy0); g.lineTo(W2 / 2 + i * 220, H2); }
    for (let k = 0; k < 12; k++) { const y = sy0 + Math.pow(k / 11, 2.2) * (H2 - sy0); g.moveTo(0, y); g.lineTo(W2, y); }
    g.stroke();
    g.textAlign = 'center'; g.textBaseline = 'middle';
    // logo
    g.font = 'italic 800 150px ' + FONT;
    const lg = g.createLinearGradient(0, 70, 0, 230);
    lg.addColorStop(0, '#fffbe0'); lg.addColorStop(0.35, '#ffd23c'); lg.addColorStop(0.7, '#ff2bd6'); lg.addColorStop(1, '#8a3cff');
    g.shadowColor = 'rgba(255, 43, 214, 0.8)'; g.shadowBlur = 30;
    g.fillStyle = lg; g.fillText('SPEEDER', W2 / 2, 160);
    g.shadowBlur = 0;
    // headline
    let head = '', hc = '#29f3ff';
    if (run.rank === 1) { head = 'NEW WORLD RECORD'; hc = '#ffd23c'; }
    else if (run.rank) { head = '#' + run.rank + ' IN THE WORLD'; hc = run.rank <= 3 ? '#ffd23c' : '#29f3ff'; }
    else if (run.isBest) { head = 'NEW PERSONAL BEST'; hc = '#ffd23c'; }
    if (head) {
      g.font = '800 64px ' + FONT;
      const hw = g.measureText(head).width + 80;
      g.fillStyle = 'rgba(11, 4, 32, 0.8)'; g.fillRect(W2 / 2 - hw / 2, 270, hw, 104);
      g.strokeStyle = hc; g.lineWidth = 5; g.strokeRect(W2 / 2 - hw / 2, 270, hw, 104);
      g.fillStyle = hc; g.fillText(head, W2 / 2, 324);
    }
    // score
    g.font = '800 200px ' + FONT;
    g.shadowColor = 'rgba(255, 255, 255, 0.5)'; g.shadowBlur = 24;
    g.fillStyle = '#ffffff';
    const sct = run.score.toLocaleString();
    const sw2 = g.measureText(sct).width;
    if (sw2 > W2 - 80) { g.font = '800 ' + Math.floor(200 * (W2 - 80) / sw2) + 'px ' + FONT; }
    g.fillText(sct, W2 / 2, 520);
    g.shadowBlur = 0;
    g.font = '500 44px ' + FONT;
    g.fillStyle = '#cbb7ff';
    g.fillText((run.dist / 1000).toFixed(2) + ' KM  ·  ' + run.kills + ' DESTROYED', W2 / 2, 630);
    // call to action
    g.fillStyle = 'rgba(11, 4, 32, 0.78)'; g.fillRect(0, 1090, W2, 260);
    g.font = '800 64px ' + FONT;
    g.fillStyle = '#ffd23c';
    g.fillText(SET.name ? 'CAN YOU BEAT ' + SET.name + '?' : 'CAN YOU BEAT ME?', W2 / 2, 1170);
    g.font = '500 40px ' + FONT;
    g.fillStyle = '#29f3ff';
    g.fillText('az-build.github.io/speeder', W2 / 2, 1265);
    c.toBlob((blob) => {
      if (!blob || lastRun !== run) return;
      try { shareFile = new File([blob], 'speeder-' + run.score + '.png', { type: 'image/png' }); } catch (e) { shareFile = null; }
    }, 'image/png');
  } catch (e) {
    shareFile = null;
  }
}

async function shareRun() {
  const run = lastRun;
  if (!run) return;
  const text = shareText(run);
  const url = challengeUrl(run);
  const status = $('shareStatus');
  status.textContent = '';
  try {
    if (shareFile && navigator.canShare && navigator.canShare({ files: [shareFile] })) {
      await navigator.share({ files: [shareFile], text: text + ' ' + url });
      return;
    }
    if (navigator.share) {
      await navigator.share({ title: 'Speeder', text, url });
      return;
    }
  } catch (e) {
    if (e && e.name === 'AbortError') return;   // you closed the share sheet
  }
  try {
    await navigator.clipboard.writeText(text + ' ' + url);
    status.textContent = 'Copied! Paste it into a message to a friend.';
  } catch (e) {
    status.textContent = text + ' ' + url;
  }
}

// ---------- Confetti (game-over celebrations) ----------
const CONF = { cvs: null, ctx: null, bits: [], raf: 0, t: 0 };
function startConfetti(level) {
  if (!CONF.cvs) {
    CONF.cvs = $('confetti');
    CONF.ctx = CONF.cvs.getContext('2d');
  }
  const c = CONF.cvs;
  c.width = Math.round(W * DPR); c.height = Math.round(H * DPR);
  CONF.ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.classList.remove('hidden');
  const cols = level >= 3 ? ['#ffd23c', '#fff4b0', '#ff9d2e', '#ffffff'] : ['#29f3ff', '#ff2bd6', '#ffd23c', '#a64cff', '#6dff7a'];
  const n = level >= 3 ? 220 : level === 2 ? 150 : 80;
  for (let i = 0; i < n; i++) {
    const fromLeft = i % 2 === 0;
    CONF.bits.push({
      x: fromLeft ? -10 : W + 10, y: H * rand(0.45, 0.8),
      vx: (fromLeft ? 1 : -1) * rand(180, 520), vy: -rand(380, 900),
      r: rand(0, 6.28), vr: rand(-12, 12), w: rand(5, 10), h: rand(8, 16),
      c: pick(cols), life: rand(2.6, 4),
    });
  }
  CONF.t = performance.now();
  if (!CONF.raf) CONF.raf = requestAnimationFrame(tickConfetti);
}
function tickConfetti(now) {
  const dt = Math.min(0.05, (now - CONF.t) / 1000);
  CONF.t = now;
  const g = CONF.ctx;
  g.clearRect(0, 0, W, H);
  for (const b of CONF.bits) {
    b.life -= dt;
    b.vy += 900 * dt; b.vx *= Math.exp(-dt * 1.2); b.vy = Math.min(b.vy, 260 + Math.sin(b.r) * 60);
    b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
    if (b.life <= 0 || b.y > H + 30) { b.dead = true; continue; }
    g.save();
    g.translate(b.x, b.y);
    g.rotate(b.r);
    g.scale(1, Math.cos(b.r * 1.7));
    g.globalAlpha = Math.min(1, b.life);
    g.fillStyle = b.c;
    g.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
    g.restore();
  }
  compact(CONF.bits);
  if (CONF.bits.length) CONF.raf = requestAnimationFrame(tickConfetti);
  else stopConfetti();
}
function stopConfetti() {
  if (CONF.raf) cancelAnimationFrame(CONF.raf);
  CONF.raf = 0;
  CONF.bits.length = 0;
  if (CONF.ctx) CONF.ctx.clearRect(0, 0, W, H);
  if (CONF.cvs) CONF.cvs.classList.add('hidden');
}

// ---------- Input ----------
function steerSensitivity() {
  // world units per pixel of finger movement, scaled by the "Steering speed" setting
  return (11 / Math.min(W, 520)) * (SET.sens / 100);
}

window.addEventListener('pointerdown', (e) => {
  if (e.target.closest && e.target.closest('.ui, .panel, button, input')) return;
  audioInit();
  if (ui) return;
  if (G.state === 'title') startGame();
  if (G.state !== 'play') return;
  drag = { id: e.pointerId, x0: e.clientX, t0: player.tx };
});

window.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id || G.state !== 'play') return;
  if (paused) {
    // during the resume countdown, just remember where the thumb is
    drag.x0 = e.clientX;
    drag.t0 = player.tx;
    return;
  }
  const lim = TRACK_HALF - 0.45;
  let t = drag.t0 + (e.clientX - drag.x0) * steerSensitivity();
  if (Math.abs(e.clientX - drag.x0) > 6) G.dragged = true;
  if (t > lim || t < -lim) {
    // re-anchor at the edge so reversing direction responds instantly
    t = clamp(t, -lim, lim);
    drag.t0 = t;
    drag.x0 = e.clientX;
  }
  player.tx = t;
});

function endDrag(e) {
  if (drag && e.pointerId === drag.id) drag = null;
}
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);

window.addEventListener('keydown', (e) => {
  if (e.target && e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
  if (e.key === 'Escape' || e.key === 'p') {
    if (ui === 'menu') resumeGame();
    else if (ui === 'settings' || ui === 'board') closePanel();
    else if (G.state === 'play' && resumeT <= 0) openMenu();
  }
  if ((e.key === ' ' || e.key === 'Enter') && !ui) {
    audioInit();
    if (G.state === 'title') startGame();
  }
  if (keys.left || keys.right) G.dragged = true;
});
window.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
});

$('mute').addEventListener('click', (e) => {

  if (SET.sound && SET.volume === 0) SET.volume = 50;

});

document.addEventListener('visibilitychange', () => {

    if (AU.ctx) AU.ctx.suspend();
  } else if (AU.ctx) {
    AU.ctx.resume();
  }
});

window.addEventListener('resize', resize);
window.addEventListener('contextmenu', (e) => e.preventDefault());

let deferredPrompt = null;

(function iosHint() {
  const ua = navigator.userAgent || '';
  const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;

})();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => { /* offline support unavailable */ });
  });
}

// ---------- Adaptive quality ----------
// On "Auto", if the game can't hold a smooth frame rate it steps down a level
// (fewer props, lower resolution). It never steps back up mid-session, to avoid flicker.
let perfAcc = 0, perfN = 0, perfCool = 2, perfBad = 0;
function setQuality(l) {
  qLevel = clamp(l, 0, 2);
  QUAL = QUALS[qLevel];
  resize();
}
function watchPerf(raw) {
  if (SET.gfx !== 'auto' || qLevel === 0 || G.state !== 'play' || paused || raw > 0.25) { perfAcc = 0; perfN = 0; return; }
  if (perfCool > 0) { perfCool -= raw; return; }
  perfAcc += raw; perfN++;
  if (perfN >= 150) {
    const avg = perfAcc / perfN;
    perfAcc = 0; perfN = 0;
    // two slow stretches in a row (about 5 seconds under ~42 fps) before stepping down
    perfBad = avg > 1 / 42 ? perfBad + 1 : 0;
    if (perfBad >= 2) { perfBad = 0; setQuality(qLevel - 1); perfCool = 3; }
  }
}

// ---------- Main loop ----------
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  watchPerf(dt);
  if (dt > 0.05) dt = 0.05;
  tickCountdown(dt);
  if (!paused) update(dt);
  else audioEngine();
  render();
  requestAnimationFrame(frame);
}

applySound();
resize();
updateTitleBest();
$('versionTag').textContent = 'v' + VERSION;
if (document.fonts && document.fonts.load) {
  document.fonts.load('800 20px Orbitron').catch(() => {});
}
setTimeout(() => {
  retryPending().then(() => fetchTop()).then(() => { if (G.state === 'play') buildLadder(); }).catch(() => {});
}, 1500);
requestAnimationFrame(frame);

// handy for testing in the browser console
window.SPEEDER = { shipScreen: () => [sx(player.x, VIEW_Z), sy(0.42, VIEW_Z)], G, player, objs, enemies, gates, shots, eshots, missiles, applyPower, spawnPattern, celebrate, die, get lastRun() { return lastRun; }, get shareFile() { return shareFile; }, startGame, openMenu, SET, curves, hills, setQuality, stats: STATS, get quality() { return QUAL.name; } };
