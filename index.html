      small.textContent = (Number(r.dist) / 1000).toFixed(2) + ' km';
      sc.appendChild(small);
    }
    li.append(rank, nm, sc);
    list.appendChild(li);
  });
}

async function loadBoard(tab) {
  boardTab = tab;
  const req = ++boardReq;
  $('tabWorld').setAttribute('aria-selected', String(tab === 'world'));
  $('tabLocal').setAttribute('aria-selected', String(tab === 'local'));
  const status = $('boardStatus');
  if (tab === 'local') {
    const rows = localBoard();
    renderRows(rows, null);
    status.textContent = rows.length ? 'Your 10 best runs on this device.' : 'No runs yet. Go ride!';
    return;
  }
  $('boardList').textContent = '';
  status.textContent = 'Loading the world leaderboard…';
  try {
    await retryPending();
    const F = await firebase();
    const { collection, query, orderBy, limit, getDocs } = F.fs;
    const snap = await withTimeout(getDocs(query(collection(F.db, SCORES), orderBy('score', 'desc'), limit(25))), 9000);
    if (req !== boardReq) return;
    const rows = snap.docs.map((d) => Object.assign({ id: d.id }, d.data()));
    renderRows(rows, playerId());
    if (!rows.length) status.textContent = 'No scores yet. Be the first!';
    else if (!SET.name) status.textContent = 'Top ' + rows.length + ' in the world. Finish a run to add your name.';
    else status.textContent = 'Top ' + rows.length + ' in the world.';
  } catch (e) {
    if (req !== boardReq) return;
    renderRows(localBoard(), null);
    status.textContent = 'Can’t reach the world leaderboard right now, so this shows your runs on this device.';
  }
}

$('tabWorld').addEventListener('click', () => loadBoard('world'));
$('tabLocal').addEventListener('click', () => loadBoard('local'));
$('boardBack').addEventListener('click', closePanel);

// ---------- Screens ----------
function updateTitleBest() {
  $('titleBest').textContent = G.best > 0 ? 'BEST  ' + G.best.toLocaleString() : '';
}

function startGame() {
  clearPanels();
  resetRun();
  G.state = 'play';
  paused = false;
  resumeT = 0;
  hide('countdown');
  show('pauseBtn');
}

let lastRun = null;

function showOver() {
  G.state = 'over';
  G.overT = 0;
  hide('pauseBtn');
  const score = Math.floor(G.score);
  const run = { score, dist: Math.round(G.d * UNIT_M), kills: G.kills };
  lastRun = run;
  const isBest = score > G.best;
  if (isBest) {
    G.best = score;
    storeSet('speeder.best', String(score));
  }
  addLocalRun(run);
  $('finalScore').textContent = score.toLocaleString();
  $('newBest').classList.toggle('hidden', !isBest);
  const dist = (run.dist / 1000).toFixed(2);
  $('stats').innerHTML =
    'Distance <b>' + dist + ' km</b><br>' +
    'Enemies destroyed <b>' + G.kills + '</b><br>' +
    'Best <b>' + G.best.toLocaleString() + '</b>';

  const status = $('saveStatus');
  status.textContent = '';
  const needsName = !SET.name && score > 0;
  $('nameBox').classList.toggle('hidden', !needsName);
  if (needsName) $('nameInput').value = '';
  else submitScore(run, status);

  clearPanels();
  openPanel('over');
  const again = $('againBtn');
  again.disabled = true;
  setTimeout(() => { again.disabled = false; }, 700);
}

function saveNameAndScore() {
  const name = cleanName($('nameInput').value);
  if (!name) {
    $('saveStatus').textContent = 'Type a name first (letters and numbers, up to 12).';
    $('nameInput').focus();
    return;
  }
  SET.name = name;
  saveSettings();
  // earlier runs on this device were saved as "YOU" before you had a name
  const rows = localBoard().map((r) => (r.name === 'YOU' ? Object.assign(r, { name }) : r));
  storeSet('speeder.local', JSON.stringify(rows));
  $('nameInput').blur();
  $('nameBox').classList.add('hidden');
  if (lastRun) submitScore(lastRun, $('saveStatus'));
}

$('saveScoreBtn').addEventListener('click', saveNameAndScore);
$('nameInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') saveNameAndScore();
});
$('againBtn').addEventListener('click', () => { audioInit(); startGame(); });
$('overBoardBtn').addEventListener('click', () => openPanel('board'));
$('overSettingsBtn').addEventListener('click', () => openPanel('settings'));
$('titleBoardBtn').addEventListener('click', () => openPanel('board'));
$('titleSettingsBtn').addEventListener('click', () => { audioInit(); openPanel('settings'); });
$('menuBoardBtn').addEventListener('click', () => openPanel('board'));
$('menuSettingsBtn').addEventListener('click', () => openPanel('settings'));
$('resumeBtn').addEventListener('click', resumeGame);
$('quitBtn').addEventListener('click', () => {
  const b = $('quitBtn');
  if (b.dataset.armed) {
    quitToTitle();
  } else {
    b.dataset.armed = '1';
    b.textContent = 'Tap again to quit';
  }
});
$('pauseBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  openMenu();
});

// ---------- Input ----------
function steerSensitivity() {
  // world units per pixel of finger movement, scaled by the "Steering speed" setting
  return (11 / Math.min(W, 520)) * (SET.sens / 100);
}

window.addEventListener('pointerdown', (e) => {
  if (e.target.closest && e.target.closest('.ui, .panel, button, input')) return;
  audioInit();
  if (ui) return;
  if (G.state === 'title') startGame();
  if (G.state !== 'play') return;
  drag = { id: e.pointerId, x0: e.clientX, t0: player.tx };
});

window.addEventListener('pointermove', (e) => {
  if (!drag || e.pointerId !== drag.id || G.state !== 'play') return;
  if (paused) {
    // during the resume countdown, just remember where the thumb is
    drag.x0 = e.clientX;
    drag.t0 = player.tx;
    return;
  }
  const lim = TRACK_HALF - 0.45;
  let t = drag.t0 + (e.clientX - drag.x0) * steerSensitivity();
  if (Math.abs(e.clientX - drag.x0) > 6) G.dragged = true;
  if (t > lim || t < -lim) {
    // re-anchor at the edge so reversing direction responds instantly
    t = clamp(t, -lim, lim);
    drag.t0 = t;
    drag.x0 = e.clientX;
  }
  player.tx = t;
});

function endDrag(e) {
  if (drag && e.pointerId === drag.id) drag = null;
}
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', endDrag);

window.addEventListener('keydown', (e) => {
  if (e.target && e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
  if (e.key === 'Escape' || e.key === 'p') {
    if (ui === 'menu') resumeGame();
    else if (ui === 'settings' || ui === 'board') closePanel();
    else if (G.state === 'play' && resumeT <= 0) openMenu();
  }
  if ((e.key === ' ' || e.key === 'Enter') && !ui) {
    audioInit();
    if (G.state === 'title') startGame();
  }
  if (keys.left || keys.right) G.dragged = true;
});
window.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
});

$('mute').addEventListener('click', (e) => {
  e.stopPropagation();
  audioInit();
  SET.sound = !(SET.sound && SET.volume > 0);
  if (SET.sound && SET.volume === 0) SET.volume = 50;
  saveSettings();
  applySound();
});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (G.state === 'play' && !ui) openMenu();
    if (AU.ctx) AU.ctx.suspend();
  } else if (AU.ctx) {
    AU.ctx.resume();
  }
});

window.addEventListener('resize', resize);
window.addEventListener('contextmenu', (e) => e.preventDefault());

// ---------- Install (PWA) ----------
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  $('installBtn').classList.remove('hidden');
});
$('installBtn').addEventListener('click', async (e) => {
  e.stopPropagation();
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  try { await deferredPrompt.userChoice; } catch (err) { /* ignore */ }
  deferredPrompt = null;
  $('installBtn').classList.add('hidden');
});
(function iosHint() {
  const ua = navigator.userAgent || '';
  const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (isIOS && !standalone) {
    const h = $('installHint');
    h.textContent = 'To install: tap the Share button, then “Add to Home Screen”.';
    h.classList.remove('hidden');
  }
})();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => { /* offline support unavailable */ });
  });
}

// ---------- Main loop ----------
let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  tickCountdown(dt);
  if (!paused) update(dt);
  else audioEngine();
  render();
  requestAnimationFrame(frame);
}

applySound();
resize();
updateTitleBest();
$('versionTag').textContent = 'v' + VERSION;
if (document.fonts && document.fonts.load) {
  document.fonts.load('800 20px Orbitron').catch(() => {});
}
setTimeout(retryPending, 3000);
requestAnimationFrame(frame);

// handy for testing in the browser console
window.SPEEDER = { G, player, objs, enemies, gates, shots, eshots, startGame, openMenu, SET };
</script>
