<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0420">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Speeder">
<meta name="description" content="Neon hover-speeder run. Drag to steer, guns fire on their own.">
<title>Speeder</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0420;
    --pink: #ff2bd6;
    --cyan: #29f3ff;
    --yellow: #ffd23c;
    --red: #ff2b4e;
    --text: #efe6ff;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: 'Orbitron', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color: #fff;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    display: block;
  }
  #safe {
    position: fixed;
    top: 0;
    left: 0;
    width: 0;
    height: env(safe-area-inset-top, 0px);
    visibility: hidden;
    pointer-events: none;
  }
  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
    pointer-events: none;
    padding: calc(env(safe-area-inset-top, 0px) + 24px) 20px calc(env(safe-area-inset-bottom, 0px) + 24px);
    box-sizing: border-box;
  }
  .hidden { display: none !important; }
  #title {
    justify-content: flex-start;
    padding-top: calc(env(safe-area-inset-top, 0px) + 11vh);
    background: linear-gradient(to bottom, rgba(8, 2, 24, 0.55), rgba(8, 2, 24, 0) 40%, rgba(8, 2, 24, 0) 55%, rgba(8, 2, 24, 0.75));
  }
  .logo {
    font-weight: 800;
    font-style: italic;
    font-size: clamp(46px, 15vw, 104px);
    letter-spacing: 0.05em;
    line-height: 1;
    background: linear-gradient(180deg, #fffbe0 0%, #ffd23c 32%, #ff2bd6 68%, #8a3cff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 14px rgba(255, 43, 214, 0.75));
    padding: 0 0.1em;
  }
  .logo.small { font-size: clamp(34px, 10vw, 64px); }
  .tag {
    font-size: 12px;
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: var(--cyan);
    text-shadow: 0 0 8px var(--cyan);
    margin-right: -0.5em;
  }
  .how {
    margin-top: 18px;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 16px;
    line-height: 1.9;
    color: var(--text);
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
  }
  .how b { color: #fff; }
  .cta {
    margin-top: 20px;
    font-size: 15px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--yellow);
    text-shadow: 0 0 10px rgba(255, 210, 60, 0.6);
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: 0.3; } }
  .best {
    font-size: 12px;
    letter-spacing: 0.2em;
    color: #cbb7ff;
  }
  .install {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 13px;
    color: #bfaee6;
    max-width: 300px;
    line-height: 1.5;
  }
  #installBtn {
    pointer-events: auto;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.2em;
    color: var(--cyan);
    background: rgba(41, 243, 255, 0.08);
    border: 1px solid rgba(41, 243, 255, 0.5);
    border-radius: 999px;
    padding: 10px 18px;
    touch-action: manipulation;
  }
  .wrecked {
    font-weight: 800;
    font-style: italic;
    font-size: clamp(40px, 12vw, 80px);
    color: var(--red);
    text-shadow: 0 0 18px var(--red);
    letter-spacing: 0.05em;
  }
  .final {
    font-weight: 800;
    font-size: clamp(38px, 12vw, 68px);
    text-shadow: 0 0 14px rgba(255, 255, 255, 0.4);
  }
  .newbest {
    font-size: 14px;
    letter-spacing: 0.3em;
    color: var(--yellow);
    text-shadow: 0 0 10px var(--yellow);
  }
  .stats {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 15px;
    line-height: 1.8;
    color: var(--text);
  }
  .hud-btn {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 10px);
    width: 40px;
    height: 40px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    background: rgba(20, 6, 40, 0.5);
    color: #fff;
    display: grid;
    place-items: center;
    padding: 0;
    z-index: 5;
    pointer-events: auto;
    touch-action: manipulation;
    cursor: pointer;
  }
  #mute { right: 12px; }
  #pauseBtn { right: 60px; }
  .hud-btn svg { width: 20px; height: 20px; }
  #mute .slash { display: none; }
  #mute.off .slash { display: inline; }
  #mute.off .waves { display: none; }

  /* ---- menus ---- */
  .ui { pointer-events: auto; }
  .overlay.panel {
    pointer-events: auto;
    overflow-y: auto;
    touch-action: pan-y;
    justify-content: safe center;
    background: rgba(8, 2, 24, 0.84);
    z-index: 6;
  }
  .panel-title {
    font-weight: 800;
    font-style: italic;
    font-size: clamp(28px, 9vw, 40px);
    letter-spacing: 0.06em;
    color: #fff;
    text-shadow: 0 0 14px var(--pink);
    margin-bottom: 6px;
  }
  .stack {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: min(320px, 100%);
  }
  .row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .stack .row > .btn { flex: 1; }
  .btn {
    font-family: inherit;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #fff;
    background: rgba(20, 6, 40, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 12px;
    padding: 0 18px;
    min-height: 48px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .btn.primary {
    color: #160626;
    background: var(--yellow);
    border-color: var(--yellow);
    box-shadow: 0 0 18px rgba(255, 210, 60, 0.4);
  }
  .btn.warn { color: var(--red); border-color: rgba(255, 43, 78, 0.6); }
  .btn:disabled { opacity: 0.4; }
  .btn:active { transform: scale(0.97); }
  .btn:focus-visible, .switch:focus-visible, input:focus-visible, .hud-btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .setting {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    min-height: 52px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 16px;
    color: var(--text);
    text-align: left;
  }
  .setting.col { flex-direction: column; align-items: stretch; gap: 8px; padding: 10px 0; }
  .setting small { color: #9c88d8; font-size: 12px; margin-left: 4px; }
  .switch {
    -webkit-appearance: none;
    appearance: none;
    flex: none;
    margin: 0;
    width: 50px;
    height: 28px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.18);
    position: relative;
    cursor: pointer;
    transition: background 0.15s;
  }
  .switch::after {
    content: "";
    position: absolute;
    top: 3px;
    left: 3px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #fff;
    transition: transform 0.15s;
  }
  .switch:checked { background: var(--pink); }
  .switch:checked::after { transform: translateX(22px); }
  input[type=range] { width: 150px; accent-color: var(--pink); touch-action: pan-x; }
  .name-input {
    font-family: inherit;
    font-weight: 800;
    font-size: 18px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-align: center;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid rgba(41, 243, 255, 0.5);
    background: rgba(41, 243, 255, 0.06);
    color: #fff;
    width: 100%;
    box-sizing: border-box;
    -webkit-user-select: text;
    user-select: text;
  }
  .name-input::placeholder { color: rgba(255, 255, 255, 0.35); }
  .tabs { display: flex; gap: 8px; width: min(340px, 100%); }
  .tabs .btn { flex: 1; min-height: 40px; font-size: 11px; }
  .tabs .btn[aria-selected="true"] { color: var(--cyan); border-color: var(--cyan); background: rgba(41, 243, 255, 0.08); }
  .board-list {
    list-style: none;
    margin: 0;
    padding: 0;
    width: min(340px, 100%);
    max-height: 50vh;
    overflow-y: auto;
    touch-action: pan-y;
    font-variant-numeric: tabular-nums;
  }
  .board-list li {
    display: grid;
    grid-template-columns: 2.2em minmax(0, 1fr) auto;
    gap: 10px;
    align-items: center;
    padding: 10px 4px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    font-size: 14px;
  }
  .board-list li.me { color: var(--yellow); }
  .board-list li.top .rank { color: var(--yellow); }
  .board-list .rank { color: #9c88d8; text-align: right; }
  .board-list .nm {
    text-align: left;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-weight: 700;
    letter-spacing: 0.04em;
  }
  .board-list .sc { text-align: right; font-weight: 800; }
  .board-list .sc small { display: block; font-weight: 500; font-size: 10px; color: #9c88d8; }
  .status {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    color: #cdbdf2;
    min-height: 1.5em;
    max-width: 320px;
  }
  #countdown { z-index: 6; }
  .count {
    font-weight: 800;
    font-style: italic;
    font-size: 96px;
    color: var(--yellow);
    text-shadow: 0 0 24px rgba(255, 210, 60, 0.7);
  }
  .version { font-size: 10px; letter-spacing: 0.2em; color: rgba(203, 183, 255, 0.5); }
  @media (prefers-reduced-motion: reduce) {
    .cta { animation: none; }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="safe"></div>

<button id="mute" class="hud-btn ui" aria-label="Sound on or off">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/>
    <g class="waves"><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></g>
    <g class="slash"><path d="M16 9l6 6M22 9l-6 6"/></g>
  </svg>
</button>

<button id="pauseBtn" class="hud-btn ui hidden" aria-label="Pause">
  <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
</button>

<div id="title" class="overlay">
  <div class="logo">SPEEDER</div>
  <div class="tag">Neon hover run</div>
  <div class="how">
    <div><b>Drag</b> anywhere to steer</div>
    <div>Your guns fire <b>on their own</b></div>
    <div>Drive through a <b>gate</b> to take its power</div>
  </div>
  <div class="cta">Touch to ride</div>
  <div class="best" id="titleBest"></div>
  <div class="row ui">
    <button class="btn" id="titleBoardBtn">Leaderboard</button>
    <button class="btn" id="titleSettingsBtn">Settings</button>
  </div>
  <button id="installBtn" class="hidden ui">INSTALL APP</button>
  <div class="install hidden" id="installHint"></div>
  <div class="version" id="versionTag"></div>
</div>

<div id="over" class="overlay panel hidden">
  <div class="wrecked">WRECKED</div>
  <div class="final" id="finalScore">0</div>
  <div class="newbest hidden" id="newBest">NEW BEST!</div>
  <div class="stats" id="stats"></div>
  <div class="stack hidden" id="nameBox">
    <label for="nameInput" class="status">Put your name on the world leaderboard</label>
    <input id="nameInput" class="name-input" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="YOUR NAME" enterkeyhint="done">
    <button class="btn" id="saveScoreBtn">Save my score</button>
  </div>
  <div class="status" id="saveStatus" aria-live="polite"></div>
  <div class="stack">
    <button class="btn primary" id="againBtn">Ride again</button>
    <div class="row">
      <button class="btn" id="overBoardBtn">Leaderboard</button>
      <button class="btn" id="overSettingsBtn">Settings</button>
    </div>
  </div>
</div>

<div id="menu" class="overlay panel hidden">
  <div class="panel-title">PAUSED</div>
  <div class="stack">
    <button class="btn primary" id="resumeBtn">Resume</button>
    <button class="btn" id="menuBoardBtn">Leaderboard</button>
    <button class="btn" id="menuSettingsBtn">Settings</button>
    <button class="btn warn" id="quitBtn">Quit run</button>
  </div>
</div>

<div id="settings" class="overlay panel hidden">
  <div class="panel-title">SETTINGS</div>
  <div class="stack">
    <div class="setting"><label for="setSound">Sound</label><input type="checkbox" id="setSound" class="switch"></div>
    <div class="setting"><label for="setVolume">Volume</label><input type="range" id="setVolume" min="0" max="100" step="5"></div>
    <div class="setting"><label for="setEngine">Engine hum</label><input type="checkbox" id="setEngine" class="switch"></div>
    <div class="setting"><label for="setHaptics">Vibration <small>Android only</small></label><input type="checkbox" id="setHaptics" class="switch"></div>
    <div class="setting"><label for="setSens">Steering speed <small id="sensLabel"></small></label><input type="range" id="setSens" min="50" max="160" step="10"></div>
    <div class="setting col"><label for="setName">Leaderboard name</label><input id="setName" class="name-input" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="YOUR NAME" enterkeyhint="done"></div>
    <button class="btn primary" id="settingsDone">Done</button>
  </div>
</div>

<div id="board" class="overlay panel hidden">
  <div class="panel-title">LEADERBOARD</div>
  <div class="tabs" role="tablist">
    <button class="btn" id="tabWorld" role="tab" aria-selected="true">World</button>
    <button class="btn" id="tabLocal" role="tab" aria-selected="false">This device</button>
  </div>
  <ol class="board-list" id="boardList"></ol>
  <div class="status" id="boardStatus" aria-live="polite"></div>
  <div class="stack"><button class="btn primary" id="boardBack">Back</button></div>
</div>

<div id="countdown" class="overlay hidden"><div class="count" id="countNum">3</div></div>

<script>
'use strict';

/* =========================================================
   SPEEDER  v0.1
   One HTML file + manifest + service worker.
   World units: x = left/right, y = up, d = distance forward.
   ========================================================= */

const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const $ = (id) => document.getElementById(id);

// ---------- Tuning ----------
const CAM_H = 4.0;          // camera height above the ground
const PLAYER_Z = 9;         // how far in front of the camera the speeder sits
const FAR = 240;            // draw distance
const SPAWN_AHEAD = 250;    // new things appear this far ahead
const TRACK_HALF = 5.5;     // half-width of the track
const PLAYER_HALF_W = 0.3;  // collision half-width (a little forgiving)
const MAX_HULL = 3;
const UNIT_M = 1.4;         // one world unit, in "meters", for display only
const FONT = 'Orbitron, system-ui, -apple-system, sans-serif';
const VERSION = '0.2.0';

// Online leaderboard: Speeder keeps its own list ("speeder_scores") inside the
// Firebase project that ORBit already uses. This key is meant to be public;
// the database rules decide what anyone can read or write.
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyCqMxJV7_hh8AHaSuYUi7QR16apt0QhPiE',
  authDomain: 'orbit-23921.firebaseapp.com',
  projectId: 'orbit-23921',
  storageBucket: 'orbit-23921.firebasestorage.app',
  messagingSenderId: '680718517274',
  appId: '1:680718517274:web:103918e8727a348c837da3',
};
const SCORES = 'speeder_scores';
const FIREBASE_SDK = 'https://www.gstatic.com/firebasejs/10.12.0/';

const COLORS = {
  cyan: '#29f3ff',
  pink: '#ff2bd6',
  purple: '#a64cff',
  yellow: '#ffd23c',
  red: '#ff2b4e',
  orange: '#ff9d2e',
};

const POWERS = {
  shield: { label: 'SHIELD', color: '#29f3ff' },
  weapon: { label: 'GUNS+', color: '#ffd23c' },
  rapid:  { label: 'RAPID', color: '#6dff7a' },
  repair: { label: 'REPAIR', color: '#ff5fa8' },
  nova:   { label: 'NOVA', color: '#ffffff' },
  mult:   { label: '2X SCORE', color: '#b98cff' },
};

// Shot patterns per gun level: [x offset, sideways speed]
const GUNS = {
  1: [[0, 0]],
  2: [[-0.2, 0], [0.2, 0]],
  3: [[-0.2, 0], [0.2, 0], [-0.3, -5], [0.3, 5]],
  4: [[0, 0], [-0.22, 0], [0.22, 0], [-0.3, -6], [0.3, 6]],
};

const PATTERNS = [
  { name: 'pylons',  min: 0,   w: 3 },
  { name: 'mines',   min: 0,   w: 2.5 },
  { name: 'wall',    min: 0.2, w: 2.4 },
  { name: 'slalom',  min: 0.35, w: 1.8 },
  { name: 'drones',  min: 0.45, w: 2.6 },
  { name: 'turrets', min: 0.8, w: 1.6 },
  { name: 'rams',    min: 1.1, w: 1.8 },
  { name: 'mixed',   min: 2.0, w: 2.2 },
];

// ---------- Small helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const pick = (arr) => arr[(Math.random() * arr.length) | 0];
function weighted(list) {
  let total = 0;
  for (const it of list) total += it.w;
  let r = Math.random() * total;
  for (const it of list) {
    r -= it.w;
    if (r <= 0) return it;
  }
  return list[list.length - 1];
}
function compact(arr) {
  let j = 0;
  for (let i = 0; i < arr.length; i++) {
    if (!arr[i].dead) arr[j++] = arr[i];
  }
  arr.length = j;
}
function storeGet(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function storeSet(key, val) {
  try { localStorage.setItem(key, val); } catch (e) { /* storage blocked: fine */ }
}
function vibrate(p) {
  if (!SET.haptics) return;
  try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) { /* not supported */ }
}

// ---------- Settings (saved on this device) ----------
const SETTINGS_DEFAULT = { sound: true, volume: 70, engine: true, haptics: true, sens: 100, name: '' };
function loadSettings() {
  let saved = {};
  try { saved = JSON.parse(storeGet('speeder.settings') || '{}') || {}; } catch (e) { saved = {}; }
  if (saved.sound === undefined && storeGet('speeder.muted') === '1') saved.sound = false;
  return Object.assign({}, SETTINGS_DEFAULT, saved);
}
const SET = loadSettings();
function saveSettings() { storeSet('speeder.settings', JSON.stringify(SET)); }

// ---------- Screen + projection ----------
let W = 0, H = 0, DPR = 1, HORIZON = 0, FOCAL = 1, CX = 0, SAFE_TOP = 0;
let skyGrad, groundGrad, vlineGrad, hazeGrad, sunCanvas, sunR = 100;
const cam = { x: 0 };

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  cvs.width = Math.round(W * DPR);
  cvs.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  HORIZON = Math.round(H * 0.24);
  CX = W / 2;
  // Put the speeder's ground point ~3/4 of the way down (leaves room for your thumb).
  FOCAL = ((H * (H > W ? 0.77 : 0.72)) - HORIZON) * PLAYER_Z / CAM_H;
  SAFE_TOP = $('safe').offsetHeight || 0;
  buildBackdrop();
}

// world -> screen
function sx(x, z) { return CX + (x - cam.x) * FOCAL / z; }
function sy(y, z) { return HORIZON + (CAM_H - y) * FOCAL / z; }
function fogA(z) { return clamp((FAR - z) / 60, 0, 1); }

// ---------- Backdrop (sky, sun, mountains, stars) ----------
let stars = [];
const mountainLayers = [];

function makeMountainPoints(n, rough) {
  const pts = [];
  const first = rand(0.2, 0.6);
  for (let i = 0; i <= n; i++) {
    let h = i === 0 || i === n ? first : rand(0.1, 1) * (Math.random() < rough ? 1 : 0.55);
    pts.push({ x: i / n, h });
  }
  return pts;
}

function buildBackdrop() {
  skyGrad = ctx.createLinearGradient(0, 0, 0, HORIZON);
  skyGrad.addColorStop(0, '#05010f');
  skyGrad.addColorStop(0.55, '#260845');
  skyGrad.addColorStop(0.85, '#7a1263');
  skyGrad.addColorStop(1, '#ff2d95');

  groundGrad = ctx.createLinearGradient(0, HORIZON, 0, H);
  groundGrad.addColorStop(0, '#2a0838');
  groundGrad.addColorStop(0.25, '#140424');
  groundGrad.addColorStop(1, '#07010f');

  vlineGrad = ctx.createLinearGradient(0, HORIZON, 0, H);
  vlineGrad.addColorStop(0, 'rgba(160, 70, 255, 0)');
  vlineGrad.addColorStop(0.2, 'rgba(160, 70, 255, 0.35)');
  vlineGrad.addColorStop(1, 'rgba(120, 90, 255, 0.65)');

  hazeGrad = ctx.createLinearGradient(0, HORIZON - 2, 0, HORIZON + H * 0.09);
  hazeGrad.addColorStop(0, 'rgba(255, 60, 170, 0.55)');
  hazeGrad.addColorStop(1, 'rgba(255, 60, 170, 0)');

  // Sun (drawn once to an offscreen canvas, with the classic stripes)
  sunR = Math.round(Math.min(W, H) * 0.3);
  const size = sunR * 3;
  sunCanvas = document.createElement('canvas');
  sunCanvas.width = Math.round(size * DPR);
  sunCanvas.height = Math.round(size * DPR);
  const s = sunCanvas.getContext('2d');
  s.scale(DPR, DPR);
  const c = size / 2;
  const glow = s.createRadialGradient(c, c, sunR * 0.8, c, c, sunR * 1.5);
  glow.addColorStop(0, 'rgba(255, 60, 160, 0.45)');
  glow.addColorStop(1, 'rgba(255, 60, 160, 0)');
  s.fillStyle = glow;
  s.fillRect(0, 0, size, size);
  const g = s.createLinearGradient(0, c - sunR, 0, c + sunR);
  g.addColorStop(0, '#fff3a0');
  g.addColorStop(0.45, '#ff9a3c');
  g.addColorStop(1, '#ff2fa0');
  s.fillStyle = g;
  s.beginPath();
  s.arc(c, c, sunR, 0, Math.PI * 2);
  s.fill();
  s.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 8; i++) {
    const y = c + sunR * 0.08 + i * sunR * 0.12;
    const h = 1.5 + i * sunR * 0.012;
    s.fillRect(0, y, size, h);
  }

  if (!stars.length) {
    for (let i = 0; i < 80; i++) {
      stars.push({ x: Math.random(), y: Math.random() * 0.92, r: Math.random() < 0.15 ? 2 : 1, tw: rand(0.5, 3), ph: rand(0, 6) });
    }
    mountainLayers.push({ pts: makeMountainPoints(18, 0.4), par: 3, hmax: 0.07, fill: '#1c0533', edge: 'rgba(255, 43, 214, 0.55)' });
    mountainLayers.push({ pts: makeMountainPoints(12, 0.6), par: 6, hmax: 0.045, fill: '#120222', edge: 'rgba(41, 243, 255, 0.45)' });
  }
}

function drawMountains(layer) {
  const span = W * 1.5;
  const off = (((-cam.x * layer.par) % span) + span) % span;
  const hmax = H * layer.hmax;
  ctx.beginPath();
  ctx.moveTo(-10, HORIZON + 1);
  for (let x0 = off - span; x0 < W + 1; x0 += span) {
    for (const p of layer.pts) {
      ctx.lineTo(x0 + p.x * span, HORIZON - p.h * hmax);
    }
  }
  ctx.lineTo(W + 10, HORIZON + 1);
  ctx.closePath();
  ctx.fillStyle = layer.fill;
  ctx.fill();
  ctx.strokeStyle = layer.edge;
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function drawSky() {
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, HORIZON + 1);
  ctx.fillStyle = '#fff';
  for (const s of stars) {
    ctx.globalAlpha = 0.35 + 0.65 * Math.abs(Math.sin(G.t * s.tw + s.ph));
    ctx.fillRect(s.x * W, s.y * HORIZON * 0.9, s.r, s.r);
  }
  ctx.globalAlpha = 1;
  const size = sunR * 3;
  ctx.drawImage(sunCanvas, CX - cam.x * 2 - size / 2, HORIZON - sunR * 0.3 - size / 2, size, size);
  drawMountains(mountainLayers[0]);
  drawMountains(mountainLayers[1]);
}

function drawGround() {
  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, HORIZON, W, H - HORIZON);

  const zn = 1.0;
  const camD = G.d - PLAYER_Z;

  // Track surface
  ctx.beginPath();
  ctx.moveTo(sx(-TRACK_HALF, zn), sy(0, zn));
  ctx.lineTo(sx(-TRACK_HALF, FAR), sy(0, FAR));
  ctx.lineTo(sx(TRACK_HALF, FAR), sy(0, FAR));
  ctx.lineTo(sx(TRACK_HALF, zn), sy(0, zn));
  ctx.closePath();
  ctx.fillStyle = 'rgba(255, 43, 214, 0.07)';
  ctx.fill();

  // Long lines (running toward the horizon)
  ctx.strokeStyle = vlineGrad;
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  for (let x = -40; x <= 40; x += 2.75) {
    ctx.moveTo(sx(x, zn), sy(0, zn));
    ctx.lineTo(sx(x, FAR), sy(0, FAR));
  }
  ctx.stroke();

  // Cross lines (these scroll, which is what sells the speed)
  const spacing = 4;
  let ld = Math.ceil((camD + 1.2) / spacing) * spacing;
  for (; ld < camD + FAR; ld += spacing) {
    const z = ld - camD;
    const y = sy(0, z);
    const a = clamp((1 - z / FAR) * 1.3, 0, 1);
    ctx.strokeStyle = 'rgba(255, 60, 220, ' + (a * 0.75).toFixed(3) + ')';
    ctx.lineWidth = clamp(0.035 * FOCAL / z, 0.5, 3);
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  // Rails at the track edges
  for (const side of [-1, 1]) {
    const x = side * TRACK_HALF;
    ctx.beginPath();
    ctx.moveTo(sx(x, zn), sy(0, zn));
    ctx.lineTo(sx(x, FAR), sy(0, FAR));
    ctx.strokeStyle = 'rgba(41, 243, 255, 0.25)';
    ctx.lineWidth = 7;
    ctx.stroke();
    ctx.strokeStyle = '#8ff9ff';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Rail posts
  const postGap = 12;
  ctx.strokeStyle = COLORS.cyan;
  for (let pd = Math.ceil((camD + 1) / postGap) * postGap; pd < camD + FAR; pd += postGap) {
    const z = pd - camD;
    const lw = clamp(0.1 * FOCAL / z, 1, 7);
    ctx.lineWidth = lw;
    ctx.globalAlpha = fogA(z);
    ctx.beginPath();
    for (const side of [-1, 1]) {
      const x = sx(side * (TRACK_HALF + 0.12), z);
      ctx.moveTo(x, sy(0, z));
      ctx.lineTo(x, sy(0.6, z));
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  ctx.fillStyle = hazeGrad;
  ctx.fillRect(0, HORIZON - 2, W, H * 0.09 + 2);
}

// ---------- Game state ----------
const G = {
  state: 'title', t: 0, speed: 34, d: 0, score: 0, kills: 0, best: 0,
  hull: MAX_HULL, shield: 0, weapon: 1, rapid: 0, mult: 0,
  invuln: 0, slow: 0, fireT: 0, nextSpawn: 0, nextGate: 0, overT: 0,
  flash: 0, flashColor: '#fff', shake: 0,
  toast: '', toastColor: '#fff', toastT: 0, dragged: false, runT: 0,
};
const player = { x: 0, tx: 0, vx: 0, bank: 0, alive: true };
const objs = [];      // obstacles: pylons, walls, mines
const enemies = [];   // drones, rams, turrets
const shots = [];     // your bullets
const eshots = [];    // enemy bullets
const parts = [];     // explosion particles
const gates = [];     // power-up gates
const popups = [];    // floating "+250" text (screen space)
const streaks = [];   // speed lines
const PLAYER_ITEM = { kind: 'player', _z: PLAYER_Z };
let paused = false;
let drag = null;
const keys = {};

G.best = parseInt(storeGet('speeder.best') || '0', 10) || 0;

function resetStreak(s, initial) {
  s.x = rand(-16, 16);
  if (Math.abs(s.x) < 1.6) s.x = (s.x < 0 ? -1 : 1) * rand(1.6, 4);
  s.y = rand(0.1, 3.4);
  s.d = G.d + (initial ? rand(0, FAR) : rand(FAR * 0.3, FAR));
}
for (let i = 0; i < 44; i++) {
  const s = {};
  resetStreak(s, true);
  streaks.push(s);
}

function resetRun() {
  Object.assign(G, {
    t: 0, speed: 32, d: 0, score: 0, kills: 0,
    hull: MAX_HULL, shield: 0, weapon: 1, rapid: 0, mult: 0,
    invuln: 0, slow: 0, fireT: 0.3, nextSpawn: 110, nextGate: 420, overT: 0,
    flash: 0, shake: 0, toastT: 0, runT: 0,
  });
  player.x = 0; player.tx = 0; player.vx = 0; player.bank = 0; player.alive = true;
  cam.x = 0;
  objs.length = 0; enemies.length = 0; shots.length = 0; eshots.length = 0;
  parts.length = 0; gates.length = 0; popups.length = 0;
  for (const s of streaks) resetStreak(s, true);
}

// ---------- Spawning ----------
function addObj(type, x, d, w, extra) {
  const o = Object.assign({ kind: 'obj', type, x, d, w, h: 1, dep: 0.6, y: 0, hp: Infinity, hit: false, t: Math.random() * 10 }, extra);
  objs.push(o);
  return o;
}
function addPylon(x, d) { return addObj('pylon', x, d, 0.9, { h: 4.8, dep: 0.9 }); }
function addMine(x, d) { return addObj('mine', x, d, 0.7, { h: 0.7, dep: 0.7, y: 0.25, hp: 2, pts: 50 }); }
function addWallSpan(x1, x2, d) {
  if (x2 - x1 < 0.15) return;
  addObj('wall', (x1 + x2) / 2, d, x2 - x1, { h: 1.1, dep: 0.5 });
}
function addEnemy(type, props) {
  const e = Object.assign({ kind: 'enemy', type, t: 0, flashT: 0, dep: 1 }, props);
  enemies.push(e);
  return e;
}
function activeDrones() {
  let n = 0;
  for (const e of enemies) if (e.type === 'drone' && e.mode !== 'leave') n++;
  return n;
}

function spawnDrone(at, lvl) {
  const behind = Math.random() < 0.4;
  const x = rand(-TRACK_HALF + 1, TRACK_HALF - 1);
  return addEnemy('drone', {
    x, tx: x, y: behind ? 3.2 : 0.95, rel: behind ? -12 : at - G.d,
    mode: behind ? 'wait' : 'enter', waitUntil: at - SPAWN_AHEAD + rand(40, 90),
    target: rand(30, 52), hp: 3, pts: 250, w: 1.3, d: at,
    fireT: rand(0.6, 1.2), stay: rand(7, 10), retarget: 0,
  });
}

function spawnPattern(at) {
  const lvl = G.d / 1000;
  let name = weighted(PATTERNS.filter((p) => lvl >= p.min)).name;
  const droneCap = Math.min(3, 1 + Math.floor(lvl / 1.5));
  if ((name === 'drones' || name === 'mixed') && activeDrones() >= droneCap) name = 'mines';
  const half = TRACK_HALF;

  if (name === 'pylons') {
    const n = Math.min(9, 3 + Math.floor(Math.random() * 3 + lvl));
    let d = at;
    for (let i = 0; i < n; i++) {
      addPylon(rand(-half + 0.6, half - 0.6), d);
      d += rand(8, 16);
    }
    return d - at;
  }
  if (name === 'mines') {
    const n = Math.min(10, 4 + Math.floor(lvl * 1.5));
    for (let i = 0; i < n; i++) addMine(rand(-half + 0.5, half - 0.5), at + rand(0, 40));
    return 40;
  }
  if (name === 'wall') {
    const count = lvl > 2 ? 2 : 1;
    const gapW = Math.max(1.7, 2.9 - lvl * 0.15);
    let gc = rand(-half + gapW / 2 + 0.3, half - gapW / 2 - 0.3);
    for (let k = 0; k < count; k++) {
      if (k > 0) gc = clamp(gc + rand(-4, 4), -half + gapW / 2 + 0.3, half - gapW / 2 - 0.3);
      addWallSpan(-half, gc - gapW / 2, at + k * 34);
      addWallSpan(gc + gapW / 2, half, at + k * 34);
    }
    return (count - 1) * 34 + 6;
  }
  if (name === 'slalom') {
    const n = 4 + Math.floor(Math.random() * 3);
    const step = Math.max(22, 34 - lvl * 2.5);
    let side = Math.random() < 0.5 ? -1 : 1;
    for (let i = 0; i < n; i++) {
      const edge = side * half;
      const inner = side * -0.2;
      addWallSpan(Math.min(edge, inner), Math.max(edge, inner), at + i * step);
      side = -side;
    }
    return (n - 1) * step + 6;
  }
  if (name === 'drones') {
    const n = Math.min(droneCap - activeDrones(), lvl > 3 ? 2 : 1);
    for (let i = 0; i < Math.max(1, n); i++) spawnDrone(at + i * 20, lvl);
    return 50;
  }
  if (name === 'turrets') {
    const n = 2 + (lvl > 3 ? 1 : 0);
    let side = pick([-1, 1]);
    for (let i = 0; i < n; i++) {
      const x = Math.random() < 0.25 ? rand(-1.5, 1.5) : side * rand(half - 2.2, half - 0.8);
      addEnemy('turret', { x, d: at + i * 28, y: 0, hp: 3, pts: 200, w: 1.0, fireT: rand(0.2, 0.9) });
      side = -side;
    }
    return n * 28;
  }
  if (name === 'rams') {
    const n = Math.min(5, 2 + Math.floor(lvl / 1.5));
    let d = at;
    for (let i = 0; i < n; i++) {
      addEnemy('ram', { x: rand(-half + 0.8, half - 0.8), d, y: 0.42, vd: -18, hp: 2, pts: 150, w: 0.8, steer: 2 + lvl * 0.35 });
      d += rand(18, 28);
    }
    return d - at;
  }
  // mixed: a pylon field with a drone overhead
  let d = at;
  const n = 3 + Math.floor(Math.random() * 3);
  for (let i = 0; i < n; i++) {
    addPylon(rand(-half + 0.6, half - 0.6), d);
    d += rand(10, 18);
  }
  spawnDrone(at, lvl);
  return d - at;
}

function choosePowers() {
  const opts = [
    { k: 'shield', w: G.shield >= 2 ? 0.4 : 3 },
    { k: 'weapon', w: G.weapon >= 4 ? 0 : 3.2 },
    { k: 'rapid', w: 2.4 },
    { k: 'repair', w: G.hull < MAX_HULL ? 3.5 : 0.4 },
    { k: 'nova', w: 1.4 },
    { k: 'mult', w: 1.8 },
  ].filter((o) => o.w > 0);
  const a = weighted(opts);
  const b = weighted(opts.filter((o) => o !== a));
  return [a.k, b.k];
}

function spawnGates(at) {
  const types = choosePowers();
  const pair = { resolved: false, gates: [] };
  const off = 2.6;
  [-off, off].forEach((x, i) => {
    const g = { kind: 'gate', x, d: at, w: 3.0, h: 2.6, type: types[i], pair, alpha: 1, taken: false, missed: false };
    pair.gates.push(g);
    gates.push(g);
  });
  // Risk vs reward: sometimes one gate is guarded by mines you need to shoot or weave past.
  if (G.d > 500 && Math.random() < 0.5) {
    const gx = pick([-off, off]);
    const n = 2 + (G.d > 2500 ? 1 : 0);
    for (let i = 0; i < n; i++) addMine(gx + rand(-0.9, 0.9), at - 14 - i * 8);
  }
}

function runSpawner() {
  const ahead = G.d + SPAWN_AHEAD;
  while (G.nextSpawn < ahead) {
    let at = G.nextSpawn;
    if (G.nextGate < at + 60) {
      at = Math.max(at, G.nextGate);
      spawnGates(at);
      G.nextGate = at + rand(620, 860);
      G.nextSpawn = at + 45;
      continue;
    }
    const len = spawnPattern(at);
    const lvl = G.d / 1000;
    G.nextSpawn = at + len + Math.max(14, 42 - lvl * 5) + rand(0, 16);
  }
}

// ---------- Combat ----------
function addScore(n) { G.score += n * (G.mult > 0 ? 2 : 1); }

function toast(text, color) {
  G.toast = text;
  G.toastColor = color || '#fff';
  G.toastT = 1.4;
}

function popup(text, x, y, d, color) {
  const z = d - (G.d - PLAYER_Z);
  if (z < 1) return;
  popups.push({ text, x: sx(x, z), y: sy(y + 0.6, z), t: 0, color: color || '#fff' });
}

function burst(x, y, d, color, n, spd, vdBase, life) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = rand(0.3, 1) * spd;
    parts.push({
      kind: 'part', x, y, d,
      vx: Math.cos(a) * v, vy: Math.abs(Math.sin(a)) * v * 0.9 + rand(0, 2),
      vd: vdBase + rand(-1, 1) * spd,
      life: rand(0.5, 1) * (life || 0.8), max: life || 0.8,
      color, size: rand(0.04, 0.1),
    });
  }
}

function explode(x, y, d, color, big, vdBase) {
  burst(x, y, d, color, big ? 34 : 14, big ? 7 : 4, vdBase || 0, big ? 1 : 0.6);
  burst(x, y, d, '#fff4c0', big ? 12 : 5, big ? 4 : 2, vdBase || 0, 0.4);
  G.shake = Math.max(G.shake, big ? 0.35 : 0.15);
  if (big) sfx.boom(); else sfx.pop();
}

function killEnemy(e) {
  if (e.dead) return;
  e.dead = true;
  G.kills++;
  addScore(e.pts);
  const vd = e.type === 'drone' ? G.speed * 0.9 : (e.vd || 0);
  explode(e.x, e.y + 0.3, e.d, COLORS.red, true, vd);
  burst(e.x, e.y + 0.3, e.d, COLORS.orange, 14, 5, vd, 0.8);
  popup('+' + e.pts * (G.mult > 0 ? 2 : 1), e.x, e.y, e.d, COLORS.yellow);
}

function hurt() {
  if (G.invuln > 0 || !player.alive) return false;
  if (G.shield > 0) {
    G.shield--;
    G.invuln = 0.9;
    G.flash = 0.6; G.flashColor = COLORS.cyan;
    G.shake = Math.max(G.shake, 0.3);
    burst(player.x, 0.5, G.d, COLORS.cyan, 26, 5, G.speed, 0.6);
    sfx.shield();
    vibrate(40);
    return true;
  }
  G.hull--;
  G.invuln = 1.6;
  G.slow = 1.0;
  G.flash = 0.9; G.flashColor = COLORS.red;
  G.shake = Math.max(G.shake, 0.6);
  burst(player.x, 0.5, G.d, COLORS.orange, 24, 5, G.speed * 0.8, 0.7);
  sfx.hurt();
  vibrate(90);
  if (G.hull <= 0) die();
  return true;
}

function die() {
  player.alive = false;
  G.state = 'dying';
  G.overT = 0;
  G.flash = 1; G.flashColor = '#ffffff';
  G.shake = 1.1;
  burst(player.x, 0.5, G.d, COLORS.cyan, 50, 9, G.speed * 0.5, 1.4);
  burst(player.x, 0.5, G.d, COLORS.pink, 40, 7, G.speed * 0.5, 1.2);
  burst(player.x, 0.5, G.d, '#fff4c0', 30, 5, G.speed * 0.5, 0.8);
  sfx.bigBoom();
  vibrate([70, 40, 160]);
}

function nova() {
  for (const e of enemies) {
    const rel = e.d - G.d;
    if (rel > -2 && rel < FAR && e.mode !== 'wait') killEnemy(e);
  }
  for (const o of objs) {
    const rel = o.d - G.d;
    if (o.type === 'mine' && rel > -2 && rel < FAR) {
      o.dead = true;
      explode(o.x, 0.6, o.d, COLORS.orange, false, 0);
    }
  }
  for (const s of eshots) s.dead = true;
  G.flash = 1; G.flashColor = '#ffffff';
  G.shake = 0.8;
}

function applyPower(type) {
  const P = POWERS[type];
  if (type === 'shield') { G.shield = Math.min(2, G.shield + 1); toast('SHIELD UP', P.color); }
  if (type === 'weapon') { G.weapon = Math.min(4, G.weapon + 1); toast('GUNS LV ' + G.weapon, P.color); }
  if (type === 'rapid') { G.rapid = 12; toast('RAPID FIRE', P.color); }
  if (type === 'repair') {
    if (G.hull < MAX_HULL) { G.hull++; toast('HULL REPAIRED', P.color); }
    else { addScore(500); toast('+500', P.color); }
  }
  if (type === 'nova') { nova(); toast('NOVA!', P.color); }
  if (type === 'mult') { G.mult = 15; toast('2X SCORE', P.color); }
  if (type !== 'nova') { G.flash = Math.max(G.flash, 0.35); G.flashColor = P.color; }
  sfx.power();
  vibrate(30);
}

function fire() {
  for (const [ox, vx] of GUNS[G.weapon]) {
    shots.push({ kind: 'shot', x: player.x + ox, d: G.d + 0.6, pd: G.d + 0.6, vx, vd: G.speed + 110 });
  }
  sfx.shoot();
}

function enemyFire(e, fromY) {
  const rel = e.d - G.d;
  if (rel < 10) return;
  const lvl = G.d / 1000;
  const approach = e.type === 'drone' ? Math.min(34, 24 + lvl * 2) : G.speed + 18;
  const t = rel / approach;
  const vx = clamp((player.x - e.x) / t, -6, 6);
  eshots.push({ kind: 'eshot', x: e.x, y: fromY, d: e.d - 0.5, vx, vy: (0.45 - fromY) / t, vd: G.speed - approach, t: 0 });
  e.flashT = 0.15;
  sfx.zap();
}

// ---------- Update ----------
function update(dt) {
  G.t += dt;
  G.flash = Math.max(0, G.flash - dt * 2.5);
  G.shake = Math.max(0, G.shake - dt * 2.2);
  if (G.toastT > 0) G.toastT -= dt;

  if (G.state === 'title') {
    G.speed = 34;
    G.d += G.speed * dt;
    player.tx = Math.sin(G.t * 0.7) * 2.2;
  } else if (G.state === 'play') {
    G.runT += dt;
    const base = 32 + 58 * (1 - Math.exp(-G.d / 4500));
    const target = base * (G.slow > 0 ? 0.6 : 1);
    G.speed += (target - G.speed) * Math.min(1, dt * (G.slow > 0 ? 6 : 1.5));
    G.d += G.speed * dt;
    G.score += G.speed * dt * 0.5 * (G.mult > 0 ? 2 : 1);
    G.invuln = Math.max(0, G.invuln - dt);
    G.slow = Math.max(0, G.slow - dt);
    G.rapid = Math.max(0, G.rapid - dt);
    G.mult = Math.max(0, G.mult - dt);

    if (keys.left) player.tx -= 11 * dt;
    if (keys.right) player.tx += 11 * dt;

    runSpawner();

    G.fireT -= dt;
    if (G.fireT <= 0) {
      G.fireT += G.rapid > 0 ? 0.075 : 0.15;
      fire();
    }
  } else {
    // dying / over: coast to a stop
    G.speed *= Math.exp(-dt * 1.6);
    G.d += G.speed * dt;
    G.overT += dt;
    if (G.state === 'dying' && G.overT > 1.4) showOver();
  }

  // Player movement
  const lim = TRACK_HALF - 0.45;
  player.tx = clamp(player.tx, -lim, lim);
  const prevX = player.x;
  if (player.alive) player.x += (player.tx - player.x) * (1 - Math.exp(-dt * 14));
  player.x = clamp(player.x, -lim, lim);
  player.vx = (player.x - prevX) / Math.max(dt, 1e-4);
  const bankTarget = clamp(player.vx * 0.05, -0.55, 0.55);
  player.bank += (bankTarget - player.bank) * (1 - Math.exp(-dt * 10));
  cam.x += (player.x * 0.85 - cam.x) * (1 - Math.exp(-dt * 6));

  const camD = G.d - PLAYER_Z;
  const playing = G.state === 'play' && player.alive;
  const lvl = G.d / 1000;

  // Speed lines
  for (const s of streaks) if (s.d - camD < 1) resetStreak(s, false);

  // Your bullets
  for (const b of shots) {
    b.pd = b.d;
    b.d += b.vd * dt;
    b.x += b.vx * dt;
    if (b.d - G.d > 170) b.dead = true;
  }

  // Obstacles
  for (const o of objs) {
    o.t += dt;
    const rel = o.d - G.d;
    if (rel < -PLAYER_Z - 2) { o.dead = true; continue; }
    if (rel > FAR) continue;
    // bullets hit obstacles
    for (const b of shots) {
      if (b.dead) continue;
      if (b.d >= o.d && b.pd <= o.d + o.dep && Math.abs(b.x - o.x) < o.w / 2 + 0.08) {
        b.dead = true;
        if (o.type === 'mine') {
          o.hp--;
          o.flashT = 0.1;
          if (o.hp <= 0) {
            o.dead = true;
            addScore(o.pts);
            explode(o.x, 0.6, o.d, COLORS.orange, false, 0);
            popup('+' + o.pts * (G.mult > 0 ? 2 : 1), o.x, 0.6, o.d, COLORS.orange);
            break;
          }
        } else {
          burst(b.x, 0.5, o.d, '#d9a6ff', 3, 2, 0, 0.25);
        }
      }
    }
    // you hit obstacles
    if (playing && !o.dead && !o.hit && rel < 0.5 && rel + o.dep > -0.5 && Math.abs(player.x - o.x) < o.w / 2 + PLAYER_HALF_W) {
      o.hit = true;
      if (hurt()) {
        if (o.type === 'mine') {
          o.dead = true;
          explode(o.x, 0.6, o.d, COLORS.orange, true, 0);
        } else {
          burst(player.x, 0.6, o.d, '#ffffff', 16, 6, 0, 0.5);
        }
      }
    }
  }

  // Enemies
  for (const e of enemies) {
    if (e.dead) continue;
    e.t += dt;
    e.flashT = Math.max(0, (e.flashT || 0) - dt);
    if (e.type === 'drone') {
      if (e.mode === 'wait') {
        if (G.d >= e.waitUntil && G.state === 'play') { e.mode = 'enter'; e.rel = -12; }
        else continue;
      }
      if (e.mode === 'enter') {
        const dir = Math.sign(e.target - e.rel);
        e.rel += dir * 42 * dt;
        e.y += (0.95 - e.y) * (1 - Math.exp(-dt * 2));
        if (Math.abs(e.target - e.rel) < 1.5) e.mode = 'hover';
      } else if (e.mode === 'hover') {
        e.rel += (e.target + Math.sin(e.t * 1.3) * 4 - e.rel) * dt;
        e.y += (0.95 + Math.sin(e.t * 3) * 0.08 - e.y) * dt * 3;
        if (playing) {
          e.fireT -= dt;
          if (e.fireT <= 0) {
            enemyFire(e, e.y);
            e.fireT = Math.max(0.85, 1.8 - lvl * 0.15) + rand(0, 0.5);
          }
        }
        if (e.t > e.stay || !playing) e.mode = 'leave';
      } else {
        e.rel += 55 * dt;
        e.y += dt * 0.8;
        if (e.rel > FAR + 20) e.dead = true;
      }
      e.retarget -= dt;
      if (e.retarget <= 0) {
        e.tx = clamp(player.x + rand(-2.5, 2.5), -TRACK_HALF + 0.8, TRACK_HALF - 0.8);
        e.retarget = rand(1, 2);
      }
      e.x += (e.tx - e.x) * (1 - Math.exp(-dt * 1.8));
      e.d = G.d + e.rel;
    } else if (e.type === 'ram') {
      e.d += e.vd * dt;
      const rel = e.d - G.d;
      if (rel < 130 && rel > 4 && playing) e.x += clamp(player.x - e.x, -1, 1) * e.steer * dt;
      e.x = clamp(e.x, -TRACK_HALF + 0.5, TRACK_HALF - 0.5);
    } else if (e.type === 'turret') {
      const rel = e.d - G.d;
      if (playing && rel > 30 && rel < 115) {
        e.fireT -= dt;
        if (e.fireT <= 0) {
          enemyFire(e, 0.7);
          e.fireT = Math.max(0.8, 1.3 - lvl * 0.06) + rand(0, 0.3);
        }
      }
    }
    const rel = e.d - G.d;
    if (rel < -PLAYER_Z - 2) { e.dead = true; continue; }

    // bullets hit enemies
    if (rel < FAR) {
      for (const b of shots) {
        if (b.dead) continue;
        if (b.d >= e.d - 0.5 && b.pd <= e.d + 0.5 && Math.abs(b.x - e.x) < e.w / 2 + 0.1) {
          b.dead = true;
          e.hp--;
          e.flashT = 0.08;
          burst(b.x, e.y + 0.2, e.d, '#ffd0d8', 3, 2, e.type === 'drone' ? G.speed : 0, 0.25);
          sfx.tick();
          if (e.hp <= 0) { killEnemy(e); break; }
        }
      }
    }
    // rams and turrets can hit you
    if (playing && !e.dead && e.type !== 'drone' && rel < 0.6 && rel > -0.8 && Math.abs(player.x - e.x) < e.w / 2 + PLAYER_HALF_W) {
      if (hurt()) {
        e.dead = true;
        explode(e.x, 0.5, e.d, COLORS.red, true, 0);
      }
    }
  }

  // Enemy bullets
  for (const s of eshots) {
    const prevRel = s.d - G.d;
    s.t += dt;
    s.d += s.vd * dt;
    s.x += s.vx * dt;
    s.y = Math.max(0.3, s.y + s.vy * dt);
    const rel = s.d - G.d;
    if (playing && prevRel > -0.4 && rel < 0.4 && Math.abs(s.x - player.x) < 0.42) {
      s.dead = true;
      hurt();
      continue;
    }
    if (rel < -6 || rel > FAR + 40) s.dead = true;
  }

  // Gates
  for (const g of gates) {
    const rel = g.d - G.d;
    if (!g.pair.resolved && rel <= 0) {
      g.pair.resolved = true;
      let took = null;
      if (playing) {
        for (const pg of g.pair.gates) {
          if (Math.abs(player.x - pg.x) < pg.w / 2) took = pg;
        }
      }
      for (const pg of g.pair.gates) {
        if (pg === took) {
          pg.taken = true;
          burst(pg.x, 1.3, pg.d, POWERS[pg.type].color, 40, 6, G.speed * 0.7, 0.8);
          applyPower(pg.type);
        } else {
          pg.missed = true;
        }
      }
    }
    if (g.taken) g.alpha = 0;
    else if (g.missed) g.alpha = Math.max(0, g.alpha - dt * 3);
    if (rel < -PLAYER_Z - 1) g.dead = true;
  }

  // Particles
  for (const p of parts) {
    p.life -= dt;
    if (p.life <= 0) { p.dead = true; continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.d += p.vd * dt;
    p.vy -= 9 * dt;
    if (p.y < 0.02) { p.y = 0.02; p.vy *= -0.4; p.vx *= 0.7; }
  }

  for (const p of popups) {
    p.t += dt;
    if (p.t > 0.9) p.dead = true;
  }

  compact(shots); compact(objs); compact(enemies); compact(eshots);
  compact(gates); compact(parts); compact(popups);

  audioEngine();
}

// ---------- Drawing ----------
function quad(ax, ay, bx, by, cx2, cy2, dx, dy) {
  ctx.beginPath();
  ctx.moveTo(ax, ay);
  ctx.lineTo(bx, by);
  ctx.lineTo(cx2, cy2);
  ctx.lineTo(dx, dy);
  ctx.closePath();
}

// A 3D box sitting at height y0, front face at depth z.
function drawBox(x, y0, z, w, h, dep, c, a) {
  const zn = Math.max(0.9, z);
  const zf = z + dep;
  if (zf <= zn) return null;
  const xl = x - w / 2, xr = x + w / 2, yt = y0 + h;
  const s1 = FOCAL / zn, s2 = FOCAL / zf;
  const nxl = CX + (xl - cam.x) * s1, nxr = CX + (xr - cam.x) * s1;
  const nyb = HORIZON + (CAM_H - y0) * s1, nyt = HORIZON + (CAM_H - yt) * s1;
  const fxl = CX + (xl - cam.x) * s2, fxr = CX + (xr - cam.x) * s2;
  const fyb = HORIZON + (CAM_H - y0) * s2, fyt = HORIZON + (CAM_H - yt) * s2;
  ctx.globalAlpha = a;
  const lw = clamp(0.04 * s1, 1, 3.5);
  ctx.lineWidth = lw;
  ctx.strokeStyle = c.edge;
  ctx.lineJoin = 'round';
  if (cam.x < xl) {
    quad(nxl, nyt, fxl, fyt, fxl, fyb, nxl, nyb);
    ctx.fillStyle = c.side; ctx.fill(); ctx.stroke();
  }
  if (cam.x > xr) {
    quad(nxr, nyt, fxr, fyt, fxr, fyb, nxr, nyb);
    ctx.fillStyle = c.side; ctx.fill(); ctx.stroke();
  }
  if (yt < CAM_H) {
    quad(nxl, nyt, nxr, nyt, fxr, fyt, fxl, fyt);
    ctx.fillStyle = c.top; ctx.fill(); ctx.stroke();
  }
  ctx.fillStyle = c.face;
  ctx.fillRect(nxl, nyt, nxr - nxl, nyb - nyt);
  ctx.strokeRect(nxl, nyt, nxr - nxl, nyb - nyt);
  ctx.globalAlpha = 1;
  return { nxl, nxr, nyt, nyb, s: s1 };
}

const PYLON_C = { face: '#1d0838', side: '#2c0d52', top: '#3a1466', edge: '#b85cff' };
const WALL_C = { face: '#2a0a3a', side: '#3a0f4f', top: '#5a1a70', edge: '#ff2bd6' };
const TURRET_C = { face: '#2a0710', side: '#3d0a18', top: '#511023', edge: '#ff2b4e' };

function shadow(x, z, rw, a) {
  const s = FOCAL / z;
  ctx.globalAlpha = a;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(sx(x, z), sy(0, z), rw * s, rw * s * 0.18, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

function drawObj(o) {
  const z = o._z;
  const a = fogA(z);
  if (o.type === 'pylon') {
    const r = drawBox(o.x, 0, z, o.w, o.h, o.dep, PYLON_C, a);
    if (!r) return;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = a * 0.9;
    const cxp = (r.nxl + r.nxr) / 2;
    const sw = Math.max(1, 0.1 * r.s);
    ctx.fillStyle = '#ff7bf0';
    ctx.fillRect(cxp - sw / 2, r.nyt, sw, r.nyb - r.nyt);
    ctx.globalAlpha = a * 0.25;
    ctx.fillRect(cxp - sw * 2, r.nyt, sw * 4, r.nyb - r.nyt);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  } else if (o.type === 'wall') {
    const r = drawBox(o.x, 0, z, o.w, o.h, o.dep, WALL_C, a);
    if (!r) return;
    ctx.globalAlpha = a;
    ctx.strokeStyle = 'rgba(255, 120, 230, 0.8)';
    ctx.lineWidth = Math.max(1, 0.05 * r.s);
    const h = r.nyb - r.nyt;
    ctx.beginPath();
    ctx.moveTo(r.nxl, r.nyt + h * 0.38); ctx.lineTo(r.nxr, r.nyt + h * 0.38);
    ctx.moveTo(r.nxl, r.nyt + h * 0.62); ctx.lineTo(r.nxr, r.nyt + h * 0.62);
    ctx.stroke();
    ctx.globalAlpha = 1;
  } else if (o.type === 'mine') {
    if (z < 1) return;
    const s = FOCAL / z;
    const y = 0.6 + Math.sin(o.t * 3) * 0.1;
    shadow(o.x, z, 0.3, a * 0.5);
    const px = sx(o.x, z), py = sy(y, z);
    const spin = Math.cos(o.t * 4);
    const rw = 0.32 * s * (0.35 + 0.65 * Math.abs(spin)), rh = 0.4 * s;
    ctx.globalAlpha = a;
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255, 140, 40, 0.25)';
    ctx.beginPath();
    ctx.arc(px, py, rh * 1.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.beginPath();
    ctx.moveTo(px, py - rh); ctx.lineTo(px + rw, py); ctx.lineTo(px, py + rh); ctx.lineTo(px - rw, py);
    ctx.closePath();
    ctx.fillStyle = o.flashT > 0 ? '#ffffff' : '#3a1606';
    ctx.fill();
    ctx.strokeStyle = COLORS.orange;
    ctx.lineWidth = clamp(0.05 * s, 1, 3);
    ctx.stroke();
    ctx.fillStyle = (Math.sin(o.t * 10) > 0) ? '#ffe08a' : COLORS.orange;
    ctx.beginPath();
    ctx.arc(px, py, Math.max(1, rh * 0.18), 0, Math.PI * 2);
    ctx.fill();
    o.flashT = Math.max(0, (o.flashT || 0) - 1 / 60);
    ctx.globalAlpha = 1;
  }
}

function drawEnemy(e) {
  const z = e._z;
  if (z < 1) return;
  const a = fogA(z);
  const s = FOCAL / z;
  const hitFlash = e.flashT > 0;
  if (e.type === 'drone') {
    shadow(e.x, z, 0.55, a * 0.35);
    const px = sx(e.x, z), py = sy(e.y, z);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(px, py);
    ctx.rotate(clamp((e.tx - e.x) * 0.12, -0.35, 0.35));
    ctx.scale(s, s);
    // glow
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255, 43, 78, 0.18)';
    ctx.beginPath(); ctx.ellipse(0, 0.05, 0.8, 0.3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    // wings
    ctx.beginPath();
    ctx.moveTo(-0.66, -0.02); ctx.lineTo(-0.22, -0.16); ctx.lineTo(0.22, -0.16); ctx.lineTo(0.66, -0.02);
    ctx.lineTo(0.24, 0.1); ctx.lineTo(-0.24, 0.1); ctx.closePath();
    ctx.fillStyle = hitFlash ? '#ffffff' : '#2a0712';
    ctx.fill();
    ctx.strokeStyle = COLORS.red; ctx.lineWidth = 0.035; ctx.stroke();
    // hanging pod
    ctx.beginPath();
    ctx.moveTo(-0.12, 0.08); ctx.lineTo(0.12, 0.08); ctx.lineTo(0.06, 0.34); ctx.lineTo(-0.06, 0.34); ctx.closePath();
    ctx.fillStyle = '#1a040b'; ctx.fill(); ctx.stroke();
    // eye
    const pulse = 0.7 + 0.3 * Math.sin(e.t * 8);
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255, 60, 90, ' + (0.5 * pulse).toFixed(2) + ')';
    ctx.beginPath(); ctx.arc(0, -0.03, 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = e.flashT > 0.1 ? '#fff' : '#ff7088';
    ctx.beginPath(); ctx.arc(0, -0.03, 0.08, 0, Math.PI * 2); ctx.fill();
    // thrusters
    ctx.fillStyle = 'rgba(255, 157, 46, 0.8)';
    ctx.beginPath(); ctx.arc(-0.42, 0.06, 0.05, 0, Math.PI * 2); ctx.arc(0.42, 0.06, 0.05, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();
  } else if (e.type === 'ram') {
    shadow(e.x, z, 0.42, a * 0.45);
    const px = sx(e.x, z), py = sy(e.y + Math.sin(e.t * 7) * 0.03, z);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(px, py);
    ctx.scale(s, s);
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255, 43, 78, 0.25)';
    ctx.beginPath(); ctx.ellipse(0, 0.38, 0.5, 0.1, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.beginPath();
    ctx.moveTo(0, -0.22); ctx.lineTo(0.36, 0.06); ctx.lineTo(0.22, 0.14); ctx.lineTo(-0.22, 0.14); ctx.lineTo(-0.36, 0.06);
    ctx.closePath();
    ctx.fillStyle = hitFlash ? '#fff' : '#300a1a';
    ctx.fill();
    ctx.strokeStyle = COLORS.red; ctx.lineWidth = 0.035; ctx.stroke();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255, 220, 220, 0.9)';
    ctx.beginPath(); ctx.ellipse(0, 0.04, 0.09, 0.04, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255, 60, 90, 0.35)';
    ctx.beginPath(); ctx.ellipse(0, 0.04, 0.3, 0.12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();
  } else if (e.type === 'turret') {
    const r = drawBox(e.x, 0, z, 1.0, 0.7, 1.0, hitFlash ? { face: '#fff', side: '#fff', top: '#fff', edge: '#fff' } : TURRET_C, a);
    if (!r) return;
    const cxp = (r.nxl + r.nxr) / 2;
    const domeR = 0.3 * s;
    ctx.globalAlpha = a;
    ctx.fillStyle = '#3d0a18';
    ctx.strokeStyle = COLORS.red;
    ctx.lineWidth = clamp(0.04 * s, 1, 3);
    ctx.beginPath();
    ctx.arc(cxp, r.nyt, domeR, Math.PI, 0);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.globalCompositeOperation = 'lighter';
    const charge = e.flashT > 0 ? 1 : 0.4 + 0.3 * Math.sin(e.t * 6);
    ctx.fillStyle = 'rgba(255, 80, 60, ' + charge.toFixed(2) + ')';
    ctx.beginPath(); ctx.arc(cxp, r.nyt - domeR * 0.45, Math.max(1.5, domeR * 0.3), 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }
}

function drawGate(g) {
  const z = g._z;
  if (z < 1 || g.alpha <= 0.01) return;
  const P = POWERS[g.type];
  const a = fogA(z) * g.alpha;
  const s = FOCAL / z;
  const xl = sx(g.x - g.w / 2, z), xr = sx(g.x + g.w / 2, z);
  const yb = sy(0, z), yt = sy(g.h, z);
  // the shimmering field you drive through
  ctx.globalAlpha = a * 0.2;
  ctx.fillStyle = P.color;
  ctx.fillRect(xl, yt, xr - xl, yb - yt);
  ctx.globalAlpha = a * 0.45;
  ctx.strokeStyle = P.color;
  ctx.lineWidth = Math.max(1, 0.03 * s);
  ctx.beginPath();
  const lines = 6;
  for (let i = 0; i < lines; i++) {
    const f = ((i / lines) + G.t * 0.6) % 1;
    const y = yb + (yt - yb) * f;
    ctx.moveTo(xl, y); ctx.lineTo(xr, y);
  }
  ctx.stroke();
  const postC = { face: P.color, side: P.color, top: '#ffffff', edge: '#ffffff' };
  drawBox(g.x - g.w / 2, 0, z, 0.2, g.h, 0.2, postC, a);
  drawBox(g.x + g.w / 2, 0, z, 0.2, g.h, 0.2, postC, a);
  drawBox(g.x, g.h, z, g.w + 0.2, 0.22, 0.2, postC, a);
  // label
  let fs = 0.48 * s;
  if (fs > 6) {
    ctx.font = '800 ' + fs.toFixed(1) + 'px ' + FONT;
    const tw = ctx.measureText(P.label).width;
    const maxW = (xr - xl) * 0.86;
    if (tw > maxW) {
      fs *= maxW / tw;
      ctx.font = '800 ' + fs.toFixed(1) + 'px ' + FONT;
    }
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.globalAlpha = a;
    ctx.fillStyle = '#0b0420';
    ctx.fillText(P.label, (xl + xr) / 2 + fs * 0.06, sy(g.h * 0.55, z) + fs * 0.06);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(P.label, (xl + xr) / 2, sy(g.h * 0.55, z));
  }
  ctx.globalAlpha = 1;
}

function drawShot(b) {
  const z = b._z;
  if (z < 1) return;
  const z2 = z + 2.4;
  const x1 = sx(b.x, z), y1 = sy(0.5, z);
  const x2 = sx(b.x + b.vx * 0.02, z2), y2 = sy(0.5, z2);
  const lw = clamp(0.1 * FOCAL / z, 1, 8);
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = 'rgba(41, 243, 255, 0.55)';
  ctx.lineWidth = lw * 2;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.strokeStyle = '#e8ffff';
  ctx.lineWidth = lw * 0.6;
  ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
}

function drawEShot(e) {
  const z = e._z;
  if (z < 1) return;
  const s = FOCAL / z;
  const a = fogA(z);
  shadow(e.x, z, 0.14, a * 0.5);
  const px = sx(e.x, z), py = sy(e.y, z);
  const r = Math.max(2.5, 0.2 * s);
  ctx.globalAlpha = a;
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'rgba(255, 70, 40, 0.35)';
  ctx.beginPath(); ctx.arc(px, py, r * 2.1, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255, 120, 60, 0.9)';
  ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff2c0';
  ctx.beginPath(); ctx.arc(px, py, r * 0.45, 0, Math.PI * 2); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

function drawPart(p) {
  const z = p._z;
  if (z < 0.8) return;
  const size = clamp(p.size * FOCAL / z, 1, 9);
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
  ctx.fillStyle = p.color;
  ctx.fillRect(sx(p.x, z) - size / 2, sy(p.y, z) - size / 2, size, size);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawStreaks() {
  const camD = G.d - PLAYER_Z;
  const base = clamp((G.speed - 24) / 60, 0, 0.55);
  if (base <= 0) return;
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = '#d8c8ff';
  ctx.lineWidth = 1;
  for (const s of streaks) {
    const z = s.d - camD;
    if (z < 1) continue;
    const z2 = z + G.speed * 0.06;
    ctx.globalAlpha = base * fogA(z);
    ctx.beginPath();
    ctx.moveTo(sx(s.x, z), sy(s.y, z));
    ctx.lineTo(sx(s.x, z2), sy(s.y, z2));
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawPlayer() {
  if (!player.alive) return;
  const z = PLAYER_Z;
  const s = FOCAL / z;
  const bob = Math.sin(G.t * 6) * 0.025;
  const px = sx(player.x, z), py = sy(0.42 + bob, z), gy = sy(0, z);
  const blink = G.invuln > 0 && Math.floor(G.t * 18) % 2 === 0;

  // shadow + underglow
  ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
  ctx.beginPath(); ctx.ellipse(px, gy, 0.42 * s, 0.07 * s, 0, 0, Math.PI * 2); ctx.fill();
  ctx.globalCompositeOperation = 'lighter';
  const ug = ctx.createRadialGradient(px, gy, 0, px, gy, 0.7 * s);
  ug.addColorStop(0, 'rgba(41, 243, 255, 0.45)');
  ug.addColorStop(1, 'rgba(41, 243, 255, 0)');
  ctx.fillStyle = ug;
  ctx.beginPath(); ctx.ellipse(px, gy, 0.7 * s, 0.16 * s, 0, 0, Math.PI * 2); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  ctx.save();
  ctx.translate(px, py);
  ctx.rotate(player.bank);
  ctx.scale(s, s);
  if (blink) ctx.globalAlpha = 0.35;

  // engine flames (they point back toward the camera, so downward on screen)
  ctx.globalCompositeOperation = 'lighter';
  const flick = 0.1 + Math.random() * 0.07 + (G.speed / 90) * 0.06;
  for (const ex of [-0.3, 0, 0.3]) {
    const fw = ex === 0 ? 0.07 : 0.055;
    const fg = ctx.createLinearGradient(0, 0.06, 0, 0.06 + flick + 0.06);
    fg.addColorStop(0, 'rgba(200, 255, 255, 0.95)');
    fg.addColorStop(0.4, 'rgba(41, 243, 255, 0.7)');
    fg.addColorStop(1, 'rgba(255, 43, 214, 0)');
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.moveTo(ex - fw, 0.06);
    ctx.lineTo(ex + fw, 0.06);
    ctx.lineTo(ex, 0.06 + flick + 0.06);
    ctx.closePath();
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  ctx.lineJoin = 'round';
  // side engine pods
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(side * 0.37, 0.08);
    ctx.lineTo(side * 0.23, 0.08);
    ctx.lineTo(side * 0.22, -0.15);
    ctx.lineTo(side * 0.33, -0.2);
    ctx.closePath();
    ctx.fillStyle = '#2a1450';
    ctx.fill();
    ctx.strokeStyle = COLORS.pink;
    ctx.lineWidth = 0.018;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255, 43, 214, 0.7)';
    ctx.beginPath();
    ctx.moveTo(side * 0.23, -0.04);
    ctx.lineTo(side * 0.15, -0.06);
    ctx.stroke();
  }
  // main hull
  const hg = ctx.createLinearGradient(0, -0.42, 0, 0.08);
  hg.addColorStop(0, '#3a3f8a');
  hg.addColorStop(1, '#0d1030');
  ctx.beginPath();
  ctx.moveTo(0, -0.44);
  ctx.lineTo(0.17, -0.1);
  ctx.lineTo(0.2, 0.06);
  ctx.lineTo(0, 0.1);
  ctx.lineTo(-0.2, 0.06);
  ctx.lineTo(-0.17, -0.1);
  ctx.closePath();
  ctx.fillStyle = hg;
  ctx.fill();
  ctx.strokeStyle = COLORS.cyan;
  ctx.lineWidth = 0.02;
  ctx.stroke();
  // center light strip
  ctx.strokeStyle = COLORS.pink;
  ctx.lineWidth = 0.016;
  ctx.beginPath();
  ctx.moveTo(0, -0.4);
  ctx.lineTo(0, -0.24);
  ctx.stroke();
  // canopy
  const cg = ctx.createLinearGradient(0, -0.24, 0, 0);
  cg.addColorStop(0, '#ff7bf0');
  cg.addColorStop(1, '#5a1a9a');
  ctx.fillStyle = cg;
  ctx.beginPath();
  ctx.ellipse(0, -0.11, 0.075, 0.11, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
  ctx.beginPath();
  ctx.ellipse(-0.025, -0.15, 0.018, 0.04, 0, 0, Math.PI * 2);
  ctx.fill();
  // exhaust rings
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = '#bffcff';
  for (const ex of [-0.3, 0.3]) {
    ctx.beginPath(); ctx.arc(ex, 0.07, 0.045, 0, Math.PI * 2); ctx.fill();
  }
  ctx.beginPath(); ctx.arc(0, 0.08, 0.055, 0, Math.PI * 2); ctx.fill();
  // shield bubble
  if (G.shield > 0) {
    const pulse = 0.6 + 0.4 * Math.sin(G.t * 5);
    ctx.globalAlpha = 0.18 + 0.1 * pulse;
    ctx.fillStyle = COLORS.cyan;
    ctx.beginPath(); ctx.ellipse(0, -0.12, 0.56, 0.4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.7;
    ctx.strokeStyle = COLORS.cyan;
    ctx.lineWidth = G.shield > 1 ? 0.04 : 0.022;
    ctx.stroke();
  }
  ctx.restore();
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

const drawList = [];
function drawWorld() {
  const camD = G.d - PLAYER_Z;
  drawList.length = 0;
  for (const o of objs) {
    o._z = o.d - camD;
    if (o._z + o.dep > 0.9 && o._z < FAR) drawList.push(o);
  }
  for (const e of enemies) {
    if (e.mode === 'wait') continue;
    e._z = e.d - camD;
    if (e._z > 1 && e._z < FAR) drawList.push(e);
  }
  for (const g of gates) {
    g._z = g.d - camD;
    if (g._z > 1 && g._z < FAR) drawList.push(g);
  }
  for (const b of shots) { b._z = b.d - camD; if (b._z > 1 && b._z < FAR) drawList.push(b); }
  for (const s of eshots) { s._z = s.d - camD; if (s._z > 1 && s._z < FAR) drawList.push(s); }
  for (const p of parts) { p._z = p.d - camD; if (p._z > 0.8 && p._z < FAR) drawList.push(p); }
  if (player.alive) drawList.push(PLAYER_ITEM);
  drawList.sort((a, b) => b._z - a._z);
  for (const it of drawList) {
    switch (it.kind) {
      case 'obj': drawObj(it); break;
      case 'enemy': drawEnemy(it); break;
      case 'gate': drawGate(it); break;
      case 'shot': drawShot(it); break;
      case 'eshot': drawEShot(it); break;
      case 'part': drawPart(it); break;
      case 'player': drawPlayer(); break;
    }
  }
}

// ---------- HUD ----------
function hex(x, y, r, filled, color) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 6 + i * Math.PI / 3;
    const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  if (filled) { ctx.fillStyle = color; ctx.fill(); }
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function timerChip(x, y, label, color, frac) {
  ctx.font = '800 10px ' + FONT;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = color;
  ctx.fillText(label, x, y);
  const lw = ctx.measureText(label).width;
  ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
  ctx.fillRect(x + lw + 6, y - 2, 46, 4);
  ctx.fillStyle = color;
  ctx.fillRect(x + lw + 6, y - 2, 46 * frac, 4);
  return lw + 60;
}

function drawHUD() {
  // low-hull warning glow
  if (G.state === 'play' && G.hull === 1) {
    const a = 0.25 + 0.2 * Math.sin(G.t * 6);
    const vg = ctx.createRadialGradient(CX, H / 2, Math.min(W, H) * 0.35, CX, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(255, 30, 60, 0)');
    vg.addColorStop(1, 'rgba(255, 30, 60, ' + a.toFixed(2) + ')');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }
  if (G.flash > 0) {
    ctx.globalAlpha = G.flash * 0.45;
    ctx.fillStyle = G.flashColor;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  if (G.state !== 'play' && G.state !== 'dying') return;

  const top = SAFE_TOP + 12;
  const left = 16;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = '800 26px ' + FONT;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
  const scoreText = Math.floor(G.score).toLocaleString();
  ctx.fillText(scoreText, left + 1, top + 2);
  ctx.fillStyle = '#ffffff';
  ctx.fillText(scoreText, left, top);
  if (G.mult > 0) {
    const sw = ctx.measureText(scoreText).width;
    ctx.font = '800 14px ' + FONT;
    ctx.fillStyle = POWERS.mult.color;
    ctx.fillText('x2', left + sw + 8, top + 4);
  }

  // hull + shield pips
  let x = left + 8;
  const py = top + 44;
  for (let i = 0; i < MAX_HULL; i++) {
    hex(x, py, 7, i < G.hull, COLORS.pink);
    x += 19;
  }
  for (let i = 0; i < G.shield; i++) {
    hex(x + 4, py, 7, true, COLORS.cyan);
    x += 19;
  }
  // gun level
  ctx.font = '800 10px ' + FONT;
  ctx.textBaseline = 'middle';
  ctx.fillStyle = COLORS.yellow;
  ctx.fillText('GUNS', x + 10, py);
  const gx = x + 10 + ctx.measureText('GUNS').width + 6;
  for (let i = 0; i < 4; i++) {
    ctx.fillStyle = i < G.weapon ? COLORS.yellow : 'rgba(255, 255, 255, 0.18)';
    ctx.fillRect(gx + i * 7, py - 5, 4, 10);
  }

  // timers
  let tx = left;
  const ty = py + 20;
  if (G.rapid > 0) tx += timerChip(tx, ty, 'RAPID', POWERS.rapid.color, G.rapid / 12);
  if (G.mult > 0) tx += timerChip(tx, ty, '2X', POWERS.mult.color, G.mult / 15);

  // speed (top right, under the sound button)
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  ctx.font = '800 15px ' + FONT;
  ctx.fillStyle = '#ffffff';
  ctx.fillText(Math.round(G.speed * UNIT_M * 3.6), W - 16, top + 44);
  ctx.font = '500 9px ' + FONT;
  ctx.fillStyle = '#cbb7ff';
  ctx.fillText('KM/H', W - 16, top + 62);

  // gate preview banner, so you can choose before the gates are close enough to read
  let next = null;
  for (const g of (G.state === 'play' ? gates : [])) {
    const rel = g.d - G.d;
    if (!g.pair.resolved && rel > 6 && rel < 200) { next = g.pair; break; }
  }
  if (next) {
    const [gl, gr] = next.gates[0].x < next.gates[1].x ? next.gates : [next.gates[1], next.gates[0]];
    const by = top + 100;
    const pulse = 0.75 + 0.25 * Math.sin(G.t * 8);
    ctx.font = '800 13px ' + FONT;
    ctx.textBaseline = 'middle';
    const chip = (label, color, cx, align) => {
      const w = ctx.measureText(label).width + 22;
      const x0 = align === 'right' ? cx - w : cx;
      ctx.globalAlpha = 0.85;
      ctx.fillStyle = 'rgba(11, 4, 32, 0.75)';
      ctx.fillRect(x0, by - 13, w, 26);
      ctx.globalAlpha = pulse;
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.strokeRect(x0, by - 13, w, 26);
      ctx.globalAlpha = 1;
      ctx.fillStyle = color;
      ctx.textAlign = 'center';
      ctx.fillText(label, x0 + w / 2, by + 1);
    };
    chip('◀ ' + POWERS[gl.type].label, POWERS[gl.type].color, CX - 6, 'right');
    chip(POWERS[gr.type].label + ' ▶', POWERS[gr.type].color, CX + 6, 'left');
  }

  // toast
  if (G.toastT > 0) {
    const t = G.toastT;
    const a = clamp(t / 0.4, 0, 1);
    const sc = 1 + Math.max(0, t - 1.2) * 2;
    ctx.save();
    ctx.translate(CX, H * 0.4);
    ctx.scale(sc, sc);
    ctx.globalAlpha = a;
    ctx.font = '800 30px ' + FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
    ctx.fillText(G.toast, 2, 3);
    ctx.fillStyle = G.toastColor;
    ctx.fillText(G.toast, 0, 0);
    ctx.restore();
  }

  // score popups
  ctx.font = '800 14px ' + FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const p of popups) {
    ctx.globalAlpha = clamp(1 - p.t / 0.9, 0, 1);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y - p.t * 50);
  }
  ctx.globalAlpha = 1;

  // first-run steering hint
  if (G.state === 'play' && !G.dragged && G.runT < 6) {
    const a = 0.6 + 0.4 * Math.sin(G.t * 5);
    const hx = CX + Math.sin(G.t * 2.5) * 40;
    ctx.globalAlpha = a;
    ctx.font = '800 14px ' + FONT;
    ctx.fillStyle = '#ffffff';
    ctx.fillText('◀  DRAG TO STEER  ▶', CX, H * 0.88);
    ctx.beginPath();
    ctx.arc(hx, H * 0.88 + 30, 12, 0, Math.PI * 2);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function render() {
  ctx.save();
  if (G.shake > 0) {
    const m = G.shake * 9;
    ctx.translate(rand(-m, m), rand(-m, m));
  }
  drawSky();
  drawGround();
  drawStreaks();
  drawWorld();
  ctx.restore();
  drawHUD();
}

// ---------- Sound (all generated, no audio files) ----------
const AU = { ctx: null, master: null, noise: null, engOsc: null, engGain: null, engFilter: null, lastShot: 0, lastTick: 0 };
function masterLevel() { return SET.sound ? (SET.volume / 100) * 0.85 : 0; }

function audioInit() {
  if (AU.ctx) {
    if (AU.ctx.state === 'suspended') AU.ctx.resume();
    return;
  }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    AU.ctx = new AC();
    AU.master = AU.ctx.createGain();
    AU.master.gain.value = masterLevel();
    AU.master.connect(AU.ctx.destination);
    const len = AU.ctx.sampleRate;
    AU.noise = AU.ctx.createBuffer(1, len, AU.ctx.sampleRate);
    const data = AU.noise.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    AU.engOsc = AU.ctx.createOscillator();
    AU.engOsc.type = 'sawtooth';
    AU.engOsc.frequency.value = 50;
    AU.engFilter = AU.ctx.createBiquadFilter();
    AU.engFilter.type = 'lowpass';
    AU.engFilter.frequency.value = 300;
    AU.engGain = AU.ctx.createGain();
    AU.engGain.gain.value = 0;
    AU.engOsc.connect(AU.engFilter);
    AU.engFilter.connect(AU.engGain);
    AU.engGain.connect(AU.master);
    AU.engOsc.start();
  } catch (e) {
    AU.ctx = null;
  }
}

function tone(f1, f2, dur, type, vol, delay) {
  if (!AU.ctx || !SET.sound) return;
  const t0 = AU.ctx.currentTime + (delay || 0);
  const o = AU.ctx.createOscillator();
  const g = AU.ctx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f1, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g);
  g.connect(AU.master);
  o.start(t0);
  o.stop(t0 + dur + 0.02);
}

function noiseBurst(dur, vol, freq) {
  if (!AU.ctx || !SET.sound) return;
  const t0 = AU.ctx.currentTime;
  const src = AU.ctx.createBufferSource();
  src.buffer = AU.noise;
  const f = AU.ctx.createBiquadFilter();
  f.type = 'lowpass';
  f.frequency.setValueAtTime(freq, t0);
  f.frequency.exponentialRampToValueAtTime(60, t0 + dur);
  const g = AU.ctx.createGain();
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f);
  f.connect(g);
  g.connect(AU.master);
  src.start(t0, Math.random() * 0.5);
  src.stop(t0 + dur + 0.05);
}

const sfx = {
  shoot() {
    if (!AU.ctx) return;
    const now = AU.ctx.currentTime;
    if (now - AU.lastShot < 0.11) return;
    AU.lastShot = now;
    tone(1400, 600, 0.05, 'square', 0.02);
  },
  tick() { tone(500, 260, 0.04, 'square', 0.025); },
  pop() { noiseBurst(0.25, 0.25, 2500); },
  boom() { noiseBurst(0.5, 0.4, 1800); tone(140, 40, 0.4, 'sawtooth', 0.12); },
  bigBoom() { noiseBurst(1.2, 0.6, 1400); tone(110, 30, 1.0, 'sawtooth', 0.2); },
  hurt() { noiseBurst(0.35, 0.45, 900); tone(220, 60, 0.3, 'sawtooth', 0.15); },
  shield() { tone(900, 300, 0.25, 'triangle', 0.15); tone(1300, 500, 0.2, 'sine', 0.08); },
  zap() { tone(700, 200, 0.14, 'sawtooth', 0.025); },
  power() {
    [523, 659, 784, 1046].forEach((f, i) => tone(f, f * 1.01, 0.12, 'triangle', 0.12, i * 0.06));
  },
};

function audioEngine() {
  if (!AU.ctx || !AU.engGain) return;
  const t = AU.ctx.currentTime;
  const on = (G.state === 'play') && !paused && SET.sound && SET.engine;
  AU.engGain.gain.setTargetAtTime(on ? 0.05 : 0, t, 0.1);
  AU.engOsc.frequency.setTargetAtTime(40 + G.speed * 0.9 + Math.abs(player.vx) * 2, t, 0.1);
  AU.engFilter.frequency.setTargetAtTime(220 + G.speed * 5, t, 0.1);
}

function applySound() {
  if (AU.master) AU.master.gain.value = masterLevel();
  $('mute').classList.toggle('off', !SET.sound || SET.volume === 0);
}

// ---------- Panels (menu, settings, leaderboard, game over) ----------
// "ui" is the panel currently on screen, or null while racing / on the title screen.
let ui = null;
const panelStack = [];
const PANELS = ['menu', 'settings', 'board', 'over', 'title'];
const show = (id) => $(id).classList.remove('hidden');
const hide = (id) => $(id).classList.add('hidden');
const isShown = (id) => !$(id).classList.contains('hidden');

function openPanel(id) {
  const cur = PANELS.find((p) => p !== id && isShown(p));
  if (cur) {
    panelStack.push(cur);
    hide(cur);
  }
  show(id);
  ui = id;
  if (id === 'settings') fillSettings();
  if (id === 'board') loadBoard(boardTab);
}

function closePanel() {
  if (!ui) return;
  hide(ui);
  const prev = panelStack.pop();
  if (prev) show(prev);
  ui = prev && prev !== 'title' ? prev : null;
}

function clearPanels() {
  for (const p of PANELS) hide(p);
  panelStack.length = 0;
  ui = null;
}

// ---------- Pause + countdown ----------
let resumeT = 0;

function openMenu() {
  if (G.state !== 'play' || ui) return;
  paused = true;
  resumeT = 0;
  drag = null;
  hide('countdown');
  $('quitBtn').textContent = 'Quit run';
  $('quitBtn').dataset.armed = '';
  openPanel('menu');
}

function resumeGame() {
  clearPanels();
  resumeT = 1.5;
  $('countNum').textContent = '3';
  show('countdown');
  audioInit();
}

function tickCountdown(dt) {
  if (resumeT <= 0) return;
  resumeT -= dt;
  if (resumeT <= 0) {
    resumeT = 0;
    paused = false;
    hide('countdown');
  } else {
    $('countNum').textContent = String(Math.ceil(resumeT / 0.5));
  }
}

function quitToTitle() {
  clearPanels();
  hide('countdown');
  resetRun();
  G.state = 'title';
  G.speed = 34;
  paused = false;
  resumeT = 0;
  hide('pauseBtn');
  show('title');
  updateTitleBest();
}

// ---------- Settings panel ----------
function fillSettings() {
  $('setSound').checked = SET.sound;
  $('setVolume').value = SET.volume;
  $('setEngine').checked = SET.engine;
  $('setHaptics').checked = SET.haptics;
  $('setSens').value = SET.sens;
  $('sensLabel').textContent = SET.sens + '%';
  $('setName').value = SET.name;
}

function cleanName(raw) {
  return String(raw || '')
    .toUpperCase()
    .replace(/[^A-Z0-9 _.\-]/g, '')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, 12);
}

$('setSound').addEventListener('change', (e) => {
  SET.sound = e.target.checked;
  if (SET.sound && SET.volume === 0) { SET.volume = 50; $('setVolume').value = 50; }
  saveSettings();
  audioInit();
  applySound();
  sfx.power();
});
$('setVolume').addEventListener('input', (e) => {
  SET.volume = parseInt(e.target.value, 10) || 0;
  SET.sound = SET.volume > 0;
  $('setSound').checked = SET.sound;
  saveSettings();
  audioInit();
  applySound();
  if (AU.ctx && AU.ctx.currentTime - AU.lastTick > 0.12) {
    AU.lastTick = AU.ctx.currentTime;
    tone(880, 660, 0.06, 'triangle', 0.15);
  }
});
$('setEngine').addEventListener('change', (e) => { SET.engine = e.target.checked; saveSettings(); });
$('setHaptics').addEventListener('change', (e) => {
  SET.haptics = e.target.checked;
  saveSettings();
  vibrate(40);
});
$('setSens').addEventListener('input', (e) => {
  SET.sens = parseInt(e.target.value, 10) || 100;
  $('sensLabel').textContent = SET.sens + '%';
  saveSettings();
});
function commitSettingsName() {
  const name = cleanName($('setName').value);
  $('setName').value = name;
  if (name && name !== SET.name) {
    SET.name = name;
    saveSettings();
    renameOnline();
  }
}
$('setName').addEventListener('change', commitSettingsName);
$('settingsDone').addEventListener('click', () => {
  commitSettingsName();
  closePanel();
});

// ---------- Leaderboard: this device ----------
function localBoard() {
  try {
    const rows = JSON.parse(storeGet('speeder.local') || '[]');
    return Array.isArray(rows) ? rows : [];
  } catch (e) {
    return [];
  }
}
function addLocalRun(run) {
  const rows = localBoard();
  rows.push({ name: SET.name || 'YOU', score: run.score, dist: run.dist, t: Date.now() });
  rows.sort((a, b) => b.score - a.score);
  storeSet('speeder.local', JSON.stringify(rows.slice(0, 10)));
}

// ---------- Leaderboard: world (Firebase, loaded only when needed) ----------
const FB = { ready: null, db: null, fs: null };

function withTimeout(promise, ms) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms)),
  ]);
}

function firebase() {
  if (!FB.ready) {
    FB.ready = (async () => {
      const appMod = await import(FIREBASE_SDK + 'firebase-app.js');
      const fs = await import(FIREBASE_SDK + 'firebase-firestore-lite.js');
      const app = appMod.initializeApp(FIREBASE_CONFIG, 'speeder');
      FB.db = fs.getFirestore(app);
      FB.fs = fs;
      return FB;
    })();
    FB.ready.catch(() => { FB.ready = null; });
  }
  return withTimeout(FB.ready, 9000);
}

function playerId() {
  let id = storeGet('speeder.pid');
  if (!id) {
    const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
    id = 'p';
    for (let i = 0; i < 19; i++) id += chars[(Math.random() * chars.length) | 0];
    storeSet('speeder.pid', id);
  }
  return id;
}
function onlineBest() { return parseInt(storeGet('speeder.onlineBest') || '0', 10) || 0; }

async function writeOnline(run) {
  const F = await firebase();
  const { doc, setDoc, serverTimestamp } = F.fs;
  await withTimeout(setDoc(doc(F.db, SCORES, playerId()), {
    name: SET.name,
    score: run.score,
    dist: run.dist,
    kills: run.kills,
    v: VERSION,
    ts: serverTimestamp(),
  }), 9000);
  storeSet('speeder.onlineBest', String(run.score));
  storeSet('speeder.onlineRun', JSON.stringify(run));
  storeSet('speeder.pending', '');
}

async function worldRank(score) {
  try {
    const F = await firebase();
    const { collection, query, where, getCount } = F.fs;
    if (!getCount) return 0;
    const snap = await withTimeout(getCount(query(collection(F.db, SCORES), where('score', '>', score))), 9000);
    return snap.data().count + 1;
  } catch (e) {
    return 0;
  }
}

// Saves a run to the world board if it beats this player's best there.
async function submitScore(run, statusEl) {
  const say = (t) => { if (statusEl) statusEl.textContent = t; };
  if (!SET.name || run.score <= 0) return;
  if (run.score <= onlineBest()) {
    say('Your world best is ' + onlineBest().toLocaleString() + '. Beat it to move up.');
    return;
  }
  say('Saving to the world leaderboard…');
  try {
    await writeOnline(run);
    const rank = await worldRank(run.score);
    say('Saved as ' + SET.name + (rank ? '. You’re #' + rank + ' in the world!' : '.'));
  } catch (e) {
    storeSet('speeder.pending', JSON.stringify(run));
    say('Couldn’t reach the world leaderboard. Your score is kept on this device and will upload next time you’re online.');
  }
}

// A score that couldn't upload earlier gets another try.
async function retryPending() {
  let run = null;
  try { run = JSON.parse(storeGet('speeder.pending') || 'null'); } catch (e) { run = null; }
  if (!run || !SET.name || run.score <= onlineBest()) return;
  try { await writeOnline(run); } catch (e) { /* still offline */ }
}

// Changing your name re-saves your existing best under the new name.
async function renameOnline() {
  let run = null;
  try { run = JSON.parse(storeGet('speeder.onlineRun') || 'null'); } catch (e) { run = null; }
  if (!run || !SET.name) return;
  try { await writeOnline(run); } catch (e) { /* will be corrected on the next upload */ }
}

let boardTab = 'world';
let boardReq = 0;

function renderRows(rows, meId) {
  const list = $('boardList');
  list.textContent = '';
  rows.forEach((r, i) => {
    const li = document.createElement('li');
    if (meId && r.id === meId) li.classList.add('me');
    if (i < 3) li.classList.add('top');
    const rank = document.createElement('span');
    rank.className = 'rank';
    rank.textContent = String(i + 1);
    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = cleanName(r.name) || '???';
    const sc = document.createElement('span');
    sc.className = 'sc';
    sc.textContent = (Number(r.score) || 0).toLocaleString();
    if (r.dist) {
      const small = document.createElement('small');
