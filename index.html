    if (t.hp <= 0) killEnemy(t);
    else explode(m.x, m.y, m.d, COLORS.orange, false, vd);
  } else {
    t.dead = true;
    addScore(t.pts);
    explode(t.x, 0.6, t.d, COLORS.orange, false, 0);
    popup('+' + t.pts * scoreX(), t.x, 0.6, t.d, COLORS.orange);
  }
  burst(m.x, m.y, m.d, '#ffd08a', 10, 4, vd, 0.4);
}
function updateMissiles(dt) {
  for (const m of missiles) {
    if (m.wait > 0) {
      m.wait -= dt;
      m.x = player.x; m.y = player.y + 0.5; m.d = G.d + 0.3;
      if (m.wait <= 0) sfx.launch();
      continue;
    }
    m.t += dt;
    m.life -= dt;
    if (m.life <= 0 || G.state === 'title') {
      m.dead = true;
      burst(m.x, m.y, m.d, COLORS.orange, 6, 3, G.speed * 0.5, 0.35);
      continue;
    }
    // lost its target? pick the closest free one
    if (m.target && (m.target.dead || m.target.d - G.d < 1)) m.target = null;
    if (!m.target && m.t > 0.15) {
      const ts = missileTargets(190);
      m.target = ts.find((t) => claimed(t) === 0) || ts[0] || null;
    }
    const sp = G.speed + (m.wing ? 75 : 62);
    let dx, dy, dd;
    if (m.target) {
      const t = m.target;
      const ty = t.kind === 'enemy' ? t.y + 0.3 : 0.6;
      dx = t.x - m.x; dy = ty - m.y; dd = t.d - m.d;
      const dist = Math.hypot(dx, dy, dd);
      if (dist < 0.9) { missileHit(m, t); m.dead = true; continue; }
      dx /= dist; dy /= dist; dd /= dist;
    } else {
      // nothing to chase: level out and keep going
      dx = -m.x * 0.02; dy = (2.2 - m.y) * 0.1; dd = 1;
      const l = Math.hypot(dx, dy, dd); dx /= l; dy /= l; dd /= l;
    }
    // a short free-flight fan-out, then it locks on and turns harder and harder
    const turn = m.t < 0.18 ? 1.5 : Math.min(14, 4 + m.t * 10);
    const k = 1 - Math.exp(-dt * turn);
    const carry = m.target && m.target.type === 'drone' ? G.speed * 0.6 : 0;   // drones fly with you
    m.vx += (dx * sp - m.vx) * k;
    m.vy += (dy * sp - m.vy) * k;
    m.vd += (dd * sp + carry - m.vd) * k;
    m.x += m.vx * dt;
    m.y = Math.max(0.25, m.y + m.vy * dt);
    m.d += m.vd * dt;
    // smoke trail history
    m.tT -= dt;
    if (m.tT <= 0) {
      m.tT = 0.022;
      m.tk = (m.tk + 1) % 8;
      m.tx[m.tk] = m.x; m.ty[m.tk] = m.y; m.td[m.tk] = m.d;
      m.tn = Math.min(8, m.tn + 1);
    }
    if (m.d - G.d > FAR + 20 || m.d - G.d < -PLAYER_Z) m.dead = true;
  }
  compact(missiles);
}

function applyPower(type) {
  const P = POWERS[type];
  if (type === 'shield') { G.shield = Math.min(2, G.shield + 1); toast('SHIELD UP', P.color); }
  if (type === 'weapon') {
    G.weapon = Math.min(GUN_MAX, G.weapon + 1);
    toast(G.weapon === GUN_MAX ? 'GUNS MAXED!' : 'GUNS LV ' + G.weapon, P.color, GUN_PERKS[G.weapon] || '');
    if (G.weapon >= 6) G.wingT = Math.min(G.wingT, 0.4);
  }
  if (type === 'rapid') { G.rapid = 12; toast('RAPID FIRE', P.color); }
  if (type === 'repair') {
    if (G.hull < MAX_HULL) { G.hull++; toast('HULL REPAIRED', P.color); }
    else { addScore(500); toast('+500', P.color); }
  }
  if (type === 'missile') { missileSwarm(); toast('MISSILES!', P.color); }
  if (type === 'mult') {
    const wasOn = G.mult > 0;
    G.mx = MULT_MAX;
    G.mult = MULT_TIME;
    toast('2X SCORE', P.color, wasOn ? 'timer reset' : '');
  }
  if (type !== 'missile') { G.flash = Math.max(G.flash, 0.3); G.flashColor = P.color; }
  // a ring bursts off the speeder and the view surges forward for a moment
  G.pulse = 1; G.pulseColor = P.color; G.kick = 1;
  G.shake = Math.max(G.shake, 0.12);
  sfx.power();
  vibrate(30);
}

function fire() {
  const lv = G.weapon;
  const pierce = lv >= 5, dmg = lv >= 7 ? 2 : 1, vd = G.speed + (lv >= 8 ? 150 : 110);
  for (const [ox, vx] of GUNS[Math.min(4, lv)]) {
    shots.push({ kind: 'shot', x: player.x + ox, d: G.d + 0.6, pd: G.d + 0.6, vx, vd, y: 0.5 + player.y * 0.8, turn: 0, dmg, pierce, hits: null });
  }
  sfx.shoot();
}
// a piercing bullet hits each thing only once
function shotHits(b, t) {
  if (!b.pierce) return true;
  if (b.hits && b.hits.includes(t)) return false;
  (b.hits || (b.hits = [])).push(t);
  return true;
}

function enemyFire(e, fromY) {
  const rel = e.d - G.d;
  if (rel < 10) return;
  const lvl = G.d / 1000;
  const approach = e.type === 'drone' ? Math.min(34, 24 + lvl * 2) : G.speed + 18;
  const t = rel / approach;
  const vx = clamp((player.x - e.x) / t, -6, 6);
  eshots.push({ kind: 'eshot', x: e.x, y: fromY, d: e.d - 0.5, vx, vy: (0.45 - fromY) / t, vd: G.speed - approach, t: 0 });
  e.flashT = 0.15;
  sfx.zap();
}

// ---------- Update ----------
function update(dt) {
  G.t += dt;
  G.flash = Math.max(0, G.flash - dt * 2.5);
  G.shake = Math.max(0, G.shake - dt * 2.2);
  G.kick = Math.max(0, G.kick - dt * 1.6);
  G.pulse = Math.max(0, G.pulse - dt * 1.8);
  if (G.zoneT > 0) G.zoneT -= dt;
  if (G.toastT > 0) G.toastT -= dt;

  if (G.state === 'title') {
    G.speed = 34;
    G.d += G.speed * dt;
    player.tx = Math.sin(G.t * 0.7) * 2.2;
  } else if (G.state === 'play') {
    G.runT += dt;
    const base = 32 + 58 * (1 - Math.exp(-G.d / 4500));
    const target = base * (G.slow > 0 ? 0.6 : 1);
    G.speed += (target - G.speed) * Math.min(1, dt * (G.slow > 0 ? 6 : 1.5));
    G.d += G.speed * dt;
    G.score += G.speed * dt * 0.5 * scoreX();
    G.invuln = Math.max(0, G.invuln - dt);
    G.slow = Math.max(0, G.slow - dt);
    G.rapid = Math.max(0, G.rapid - dt);
    G.mult = Math.max(0, G.mult - dt);
    if (G.mult <= 0) G.mx = 1;

    if (keys.left) player.tx -= 11 * dt;
    if (keys.right) player.tx += 11 * dt;

    // Turns gently push you toward the outside, like a real car. It builds
    // up smoothly with the bend, so you can feel it coming and steer against it.
    if (player.alive) {
      const push = clamp(-curvAt(G.d) * G.speed * G.speed * DRIFT, -2, 2) * dt;
      player.tx += push;
      if (drag) drag.t0 += push;
    }

    const zi = Math.floor(G.d / ZONE_LEN);
    if (zi !== G.zoneIdx) {
      G.zoneIdx = zi;
      G.zoneName = THEMES[zi % THEMES.length].name;
      G.zoneT = 3;
    }

    runSpawner();
    updateLadder(dt);

    G.fireT -= dt;
    if (G.fireT <= 0) {
      G.fireT += G.rapid > 0 ? 0.075 : 0.15;
      fire();
    }
    if (G.weapon >= 6 && player.alive) {
      G.wingT -= dt;
      if (G.wingT <= 0) G.wingT = wingMissile() ? (G.weapon >= 8 ? 0.8 : 1.6) : 0.25;
    }
  } else {
    // dying / over: coast to a stop
    G.speed *= Math.exp(-dt * 1.6);
    G.d += G.speed * dt;
    G.overT += dt;
    if (G.state === 'dying' && G.overT > 1.4) showOver();
  }

  // Player movement
  const lim = TRACK_HALF - 0.45;
  player.tx = clamp(player.tx, -lim, lim);
  const prevX = player.x;
  if (player.alive) player.x += (player.tx - player.x) * (1 - Math.exp(-dt * 14));
  player.x = clamp(player.x, -lim, lim);
  player.vx = (player.x - prevX) / Math.max(dt, 1e-4);
  // Lean into the turn: a gentle steer tilts a little, a quick flick rolls the speeder
  // almost onto its side (it looks skinny), then it settles back level.
  const bankTarget = BANK_MAX * Math.tanh(player.vx * BANK_GAIN);
  const leaningIn = Math.abs(bankTarget) > Math.abs(player.bank);
  player.bank += (bankTarget - player.bank) * (1 - Math.exp(-dt * (leaningIn ? 14 : 4.5)));
  cam.x += (player.x * 0.85 - cam.x) * (1 - Math.exp(-dt * 6));

  // In the air: gravity pulls you back down; you can still steer.
  if (player.y > 0 || player.vy > 0) {
    player.vy -= JUMP_G * dt;
    player.y += player.vy * dt;
    if (player.y <= 0) {
      const hard = player.vy < -4;
      player.y = 0; player.vy = 0;
      if (hard && player.alive) {
        G.shake = Math.max(G.shake, 0.18);
        burst(player.x, 0.1, G.d, COLORS.cyan, 14, 4, G.speed * 0.8, 0.4);
        sfx.land();
        vibrate(20);
        if (G.air > 0 && G.state === 'play') {
          const pts = 150 * G.air;
          addScore(pts);
          popup('AIR +' + pts * scoreX(), player.x, 1.2, G.d + 4, RAMP_C);
        }
      }
      G.air = 0;
    }
  }

  buildView(dt);
  updateScenery(dt);
  const camD = VIEW_D;
  const playing = G.state === 'play' && player.alive;
  const lvl = G.d / 1000;

  // Speed lines
  for (const s of streaks) if (s.d - camD < 1) resetStreak(s, false);

  // Thruster trail history (a sample every ~1/40 s)
  trailTimer -= dt;
  if (trailTimer <= 0) {
    trailTimer = 0.025;
    trailHead = (trailHead + 1) % TRAIL_N;
    trailX[trailHead] = player.x;
    trailD[trailHead] = G.d;
    trailY[trailHead] = player.y;
  }

  // Your bullets
  for (const b of shots) {
    b.pd = b.d;
    const step = b.vd * dt;
    b.d += step;
    // Bullets fly dead straight. When the road bends, it turns away underneath them,
    // so in a bend they drift toward the outside and sail off over the rail.
    b.turn += curvAt(b.d) * step;
    b.x += b.vx * dt - b.turn * step;
    if (b.d - G.d > 170 || Math.abs(b.x) > 40) b.dead = true;
  }

  // Obstacles
  for (const o of objs) {
    o.t += dt;
    moveObj(o);
    const rel = o.d - G.d;
    if (rel < -PLAYER_Z - 2) { o.dead = true; continue; }
    if (rel > FAR) continue;
    if (o.type === 'ramp') {
      // Riding up the ramp lifts you; leaving the top edge launches you.
      const on = -rel;   // how far along the ramp you are
      if (player.alive && on >= 0 && on < o.dep && Math.abs(player.x - o.x) < o.w / 2 + 0.15 && player.vy <= 0) {
        const h = RAMP_H * on / o.dep;
        if (player.y <= h + 0.05) { player.y = h; player.vy = 0; player.ramp = o; }
      } else if (player.ramp === o) {
        player.ramp = null;
        if (on >= o.dep - 0.01 && player.alive) {
          player.y = RAMP_H;
          player.vy = JUMP_VY;
          G.kick = Math.max(G.kick, 0.6);
          STATS.jumps++;
          sfx.jump();
          vibrate(15);
        }
      }
      continue;
    }
    // bullets hit obstacles (they pass straight through laser beams)
    for (const b of o.type === 'laser' ? NONE : shots) {
      if (b.dead) continue;
      if (b.d >= o.d && b.pd <= o.d + o.dep && Math.abs(b.x - o.x) < o.w / 2 + 0.08) {
        if (o.type === 'mine') {
          if (!shotHits(b, o)) continue;
          if (!b.pierce) b.dead = true;
          o.hp -= b.dmg;
          o.flashT = 0.1;
          if (o.hp <= 0) {
            o.dead = true;
            addScore(o.pts);
            explode(o.x, 0.6, o.d, COLORS.orange, false, 0);
            popup('+' + o.pts * scoreX(), o.x, 0.6, o.d, COLORS.orange);
            break;
          }
        } else {
          b.dead = true;
          burst(b.x, 0.5, o.d, '#d9a6ff', 3, 2, 0, 0.25);
        }
      }
    }
    // you hit obstacles (unless you're flying over them)
    if (playing && !o.dead && !o.hit && rel < 0.5 && rel + o.dep > -0.5 && Math.abs(player.x - o.x) < o.w / 2 + PLAYER_HALF_W) {
      o.hit = true;
      const top = o.type === 'mine' ? 1.0 : o.y + o.h;
      if (player.y > top - 0.1) { G.air++; STATS.air++; continue; }
      if (o.jump) STATS.wallHits++;
      if (hurt()) {
        if (o.type === 'mine') {
          o.dead = true;
          explode(o.x, 0.6, o.d, COLORS.orange, true, 0);
        } else {
          burst(player.x, 0.6, o.d, '#ffffff', 16, 6, 0, 0.5);
        }
      }
    }
  }

  // Enemies
  for (const e of enemies) {
    if (e.dead) continue;
    e.t += dt;
    e.flashT = Math.max(0, (e.flashT || 0) - dt);
    if (e.type === 'drone') {
      if (e.mode === 'wait') {
        if (G.d >= e.waitUntil && G.state === 'play') { e.mode = 'enter'; e.rel = -12; }
        else continue;
      }
      if (e.mode === 'enter') {
        const dir = Math.sign(e.target - e.rel);
        e.rel += dir * 42 * dt;
        e.y += (0.95 - e.y) * (1 - Math.exp(-dt * 2));
        if (Math.abs(e.target - e.rel) < 1.5) e.mode = 'hover';
      } else if (e.mode === 'hover') {
        e.rel += (e.target + Math.sin(e.t * 1.3) * 4 - e.rel) * dt;
        e.y += (0.95 + Math.sin(e.t * 3) * 0.08 - e.y) * dt * 3;
        if (playing) {
          e.fireT -= dt;
          if (e.fireT <= 0) {
            enemyFire(e, e.y);
            e.fireT = Math.max(0.85, 1.8 - lvl * 0.15) + rand(0, 0.5);
          }
        }
        if (e.t > e.stay || !playing) e.mode = 'leave';
      } else {
        e.rel += 55 * dt;
        e.y += dt * 0.8;
        if (e.rel > FAR + 20) e.dead = true;
      }
      e.retarget -= dt;
      if (e.retarget <= 0) {
        e.tx = clamp(player.x + rand(-2.5, 2.5), -TRACK_HALF + 0.8, TRACK_HALF - 0.8);
        e.retarget = rand(1, 2);
      }
      e.x += (e.tx - e.x) * (1 - Math.exp(-dt * 1.8));
      e.d = G.d + e.rel;
    } else if (e.type === 'ram') {
      e.d += e.vd * dt;
      const rel = e.d - G.d;
      if (rel < 130 && rel > 4 && playing) e.x += clamp(player.x - e.x, -1, 1) * e.steer * dt;
      e.x = clamp(e.x, -TRACK_HALF + 0.5, TRACK_HALF - 0.5);
    } else if (e.type === 'turret') {
      const rel = e.d - G.d;
      if (playing && rel > 30 && rel < 115) {
        e.fireT -= dt;
        if (e.fireT <= 0) {
          enemyFire(e, 0.7);
          e.fireT = Math.max(0.8, 1.3 - lvl * 0.06) + rand(0, 0.3);
        }
      }
    }
    const rel = e.d - G.d;
    if (rel < -PLAYER_Z - 2) { e.dead = true; continue; }

    // bullets hit enemies
    if (rel < FAR) {
      for (const b of shots) {
        if (b.dead) continue;
        if (b.d >= e.d - 0.5 && b.pd <= e.d + 0.5 && Math.abs(b.x - e.x) < e.w / 2 + 0.1) {
          if (!shotHits(b, e)) continue;
          if (!b.pierce) b.dead = true;
          e.hp -= b.dmg;
          e.flashT = 0.08;
          burst(b.x, e.y + 0.2, e.d, '#ffd0d8', 3, 2, e.type === 'drone' ? G.speed : 0, 0.25);
          sfx.tick();
          if (e.hp <= 0) { killEnemy(e); break; }
        }
      }
    }
    // rams and turrets can hit you
    if (playing && !e.dead && e.type !== 'drone' && player.y < 0.9 && rel < 0.6 && rel > -0.8 && Math.abs(player.x - e.x) < e.w / 2 + PLAYER_HALF_W) {
      if (hurt()) {
        e.dead = true;
        explode(e.x, 0.5, e.d, COLORS.red, true, 0);
      }
    }
  }

  // Enemy bullets
  for (const s of eshots) {
    const prevRel = s.d - G.d;
    s.t += dt;
    s.d += s.vd * dt;
    s.x += s.vx * dt;
    s.y = Math.max(0.3, s.y + s.vy * dt);
    const rel = s.d - G.d;
    if (playing && prevRel > -0.4 && rel < 0.4 && Math.abs(s.x - player.x) < 0.42 && player.y < s.y + 0.3) {
      s.dead = true;
      hurt();
      continue;
    }
    if (rel < -6 || rel > FAR + 40) s.dead = true;
  }

  // Gates
  for (const g of gates) {
    const rel = g.d - G.d;
    if (!g.pair.resolved && rel <= 0) {
      g.pair.resolved = true;
      let took = null;
      if (playing) {
        for (const pg of g.pair.gates) {
          if (Math.abs(player.x - pg.x) < pg.w / 2) took = pg;
        }
      }
      for (const pg of g.pair.gates) {
        if (pg === took) {
          pg.taken = true;
          burst(pg.x, 1.3, pg.d, POWERS[pg.type].color, 40, 6, G.speed * 0.7, 0.8);
          applyPower(pg.type);
        } else {
          pg.missed = true;
        }
      }
    }
    if (g.taken) g.alpha = 0;
    else if (g.missed) g.alpha = Math.max(0, g.alpha - dt * 3);
    if (rel < -PLAYER_Z - 1) g.dead = true;
  }

  // Particles
  for (const p of parts) {
    p.life -= dt;
    if (p.life <= 0) { p.dead = true; continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.d += p.vd * dt;
    p.vy -= 9 * dt;
    if (p.y < 0.02) { p.y = 0.02; p.vy *= -0.4; p.vx *= 0.7; }
  }

  for (const p of popups) {
    p.t += dt;
    if (p.t > 0.9) p.dead = true;
  }

  updateMissiles(dt);
  compact(shots); compact(objs); compact(enemies); compact(eshots);
  compact(gates); compact(parts); compact(popups);

  audioEngine();
}

// ---------- Drawing ----------
function quad(ax, ay, bx, by, cx2, cy2, dx, dy) {
  ctx.beginPath();
  ctx.moveTo(ax, ay);
  ctx.lineTo(bx, by);
  ctx.lineTo(cx2, cy2);
  ctx.lineTo(dx, dy);
  ctx.closePath();
}

// A 3D box sitting at height y0, front face at depth z.
// ground = true measures height from the ground plane (scenery) instead of the track.
const SCN_BOX = { face: '', side: '', top: '', edge: '' };
function drawBox(x, y0, z, w, h, dep, c, a, ground) {
  const zn = Math.max(0.9, z);
  const zf = z + dep;
  if (zf <= zn) return null;
  const fy = ground ? gy : sy;
  const xl = x - w / 2, xr = x + w / 2, yt = y0 + h;
  const s1 = FOCAL / zn;
  const nxl = sx(xl, zn), nxr = sx(xr, zn);
  const nyb = fy(y0, zn), nyt = fy(yt, zn);
  const fxl = sx(xl, zf), fxr = sx(xr, zf);
  const fyb = fy(y0, zf), fyt = fy(yt, zf);
  if (!c) c = SCN_BOX;   // scenery colors, set once per frame in drawScenery
  ctx.globalAlpha = a;
  const lw = clamp(0.04 * s1, 1, 3.5);
  ctx.lineWidth = lw;
  ctx.strokeStyle = c.edge;
  ctx.lineJoin = 'round';
  if (nxl > fxl) {
    quad(nxl, nyt, fxl, fyt, fxl, fyb, nxl, nyb);
    ctx.fillStyle = c.side; ctx.fill(); ctx.stroke();
  }
  if (nxr < fxr) {
    quad(nxr, nyt, fxr, fyt, fxr, fyb, nxr, nyb);
    ctx.fillStyle = c.side; ctx.fill(); ctx.stroke();
  }
  if (nyt > fyt) {
    quad(nxl, nyt, nxr, nyt, fxr, fyt, fxl, fyt);
    ctx.fillStyle = c.top; ctx.fill(); ctx.stroke();
  }
  ctx.fillStyle = c.face;
  ctx.fillRect(nxl, nyt, nxr - nxl, nyb - nyt);
  ctx.strokeRect(nxl, nyt, nxr - nxl, nyb - nyt);
  ctx.globalAlpha = 1;
  return { nxl, nxr, nyt, nyb, s: s1 };
}

const RAMP_C = '#b6ff2e';
const PYLON_C = { face: '#1d0838', side: '#2c0d52', top: '#7a3ac0', edge: '#d58cff' };
const WALL_C = { face: '#1c0628', side: '#33104a', top: '#7a2a96', edge: '#ff5fe0' };
const TURRET_C = { face: '#2a0710', side: '#3d0a18', top: '#511023', edge: '#ff2b4e' };
const LASER_C = { face: '#2a0710', side: '#3d0a18', top: '#ff2b4e', edge: '#ff8a9c' };

// A laser fence segment: two glowing beams with emitter posts at each end.
function drawLaser(o, z, a) {
  const zz = Math.max(z, 1);
  const s = FOCAL / zz;
  const x1 = o.x - o.w / 2, x2 = o.x + o.w / 2;
  const gapEdge = o.side < 0 ? x2 : x1;
  ctx.globalCompositeOperation = 'lighter';
  glow(SPR.red, sx(o.x, zz), sy(0, zz), (o.w * 0.6 + 0.4) * s, 0.25 * s, a * 0.5);
  for (const y of [0.32, 0.72, 1.05]) {
    const flick = 0.7 + 0.3 * Math.sin(G.t * 37 + y * 13 + o.side);
    const ax = sx(x1, zz), bx = sx(x2, zz), yy = sy(y, zz);
    ctx.globalAlpha = a * 0.45 * flick;
    ctx.strokeStyle = '#ff2b4e';
    ctx.lineWidth = clamp(0.2 * s, 2, 14);
    ctx.beginPath(); ctx.moveTo(ax, yy); ctx.lineTo(bx, yy); ctx.stroke();
    ctx.globalAlpha = a * flick;
    ctx.strokeStyle = '#ffd6dd';
    ctx.lineWidth = clamp(0.05 * s, 1, 4);
    ctx.stroke();
  }
  // a spark racing along each beam toward the gap
  const f = (G.t * 1.8) % 1;
  const spx = o.side < 0 ? x1 + (x2 - x1) * f : x2 - (x2 - x1) * f;
  glow(SPR.white, sx(spx, zz), sy(0.72, zz), 0.3 * s, 0.3 * s, a * 0.9);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  // emitter posts: the one at the gap edge blinks, so the way through stands out
  drawBox(o.side < 0 ? -TRACK_HALF : TRACK_HALF, 0, zz, 0.24, 1.25, 0.24, LASER_C, a);
  drawBox(gapEdge, 0, zz, 0.26, 1.35, 0.26, LASER_C, a);
  ctx.globalCompositeOperation = 'lighter';
  glow(SPR.yellow, sx(gapEdge, zz), sy(1.45, zz), 0.35 * s, 0.35 * s, a * (0.6 + 0.4 * Math.sin(G.t * 9)));
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

function shadow(x, z, rw, a) {
  const s = FOCAL / z;
  ctx.globalAlpha = a;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(sx(x, z), sy(0, z), rw * s, rw * s * 0.18, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;
}

function drawRamp(o, z, a) {
  const z1 = Math.max(z, 1), z2 = z + o.dep;
  if (z2 <= 1.05) return;
  const h1 = RAMP_H * (z1 - z) / o.dep;
  const xl = o.x - o.w / 2, xr = o.x + o.w / 2;
  const flx = sx(xl, z1), frx = sx(xr, z1), fly = sy(h1, z1), fgy = sy(0, z1);
  const blx = sx(xl, z2), brx = sx(xr, z2), bty = sy(RAMP_H, z2), bgy = sy(0, z2);
  ctx.globalAlpha = a;
  ctx.lineJoin = 'round';
  // glow on the road leading in
  ctx.globalCompositeOperation = 'lighter';
  const gs = FOCAL / z1;
  glow(SPR.yellow, (flx + frx) / 2, fgy, o.w * 0.75 * gs, 0.35 * gs, a * 0.5);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = a;
  // sides
  ctx.fillStyle = '#16260a';
  ctx.strokeStyle = RAMP_C;
  ctx.lineWidth = clamp(0.04 * gs, 1, 3);
  quad(flx, fgy, flx, fly, blx, bty, blx, bgy); ctx.fill(); ctx.stroke();
  quad(frx, fgy, frx, fly, brx, bty, brx, bgy); ctx.fill(); ctx.stroke();
  // sloped surface
  quad(flx, fly, frx, fly, brx, bty, blx, bty);
  ctx.fillStyle = '#2c4a0c';
  ctx.fill();
  ctx.stroke();
  // bright top lip
  ctx.strokeStyle = '#f2ffd0';
  ctx.lineWidth = clamp(0.08 * FOCAL / z2, 1, 4);
  ctx.beginPath(); ctx.moveTo(blx, bty); ctx.lineTo(brx, bty); ctx.stroke();
  // chevrons running up the ramp
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = RAMP_C;
  ctx.lineWidth = clamp(0.07 * gs, 1, 5);
  ctx.beginPath();
  for (let i = 0; i < 3; i++) {
    const f = ((i / 3) + G.t * 1.2) % 1;
    const zc = z + o.dep * f;
    if (zc < 1.05) continue;
    const zt = Math.min(z2, zc + o.dep * 0.18);
    const yc = RAMP_H * (zc - z) / o.dep, yt = RAMP_H * (zt - z) / o.dep;
    ctx.moveTo(sx(o.x - o.w * 0.3, zc), sy(yc, zc));
    ctx.lineTo(sx(o.x, zt), sy(yt, zt));
    ctx.lineTo(sx(o.x + o.w * 0.3, zc), sy(yc, zc));
  }
  ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

// Things you've already passed fade out quickly, so they don't clutter the space under the speeder.
function passFade(zFar) { return clamp((zFar - (VIEW_Z - 3.2)) / 2.6, 0, 1); }

function drawObj(o) {
  const z = o._z;
  const a = fogA(z) * passFade(z + o.dep);
  if (a < 0.01) return;
  if (o.type === 'ramp') { drawRamp(o, z, a); return; }
  if (o.type === 'laser') { drawLaser(o, z, a); return; }
  if (o.type === 'pylon') {
    const zc = z + o.dep / 2;
    if (zc < 1.2) return;
    const gs = FOCAL / zc;
    const bx = sx(o.x, zc), by = sy(0, zc);
    if (o.osc) {
      // a glowing groove on the road shows how far a sliding pylon travels
      const L = o.osc.base - o.osc.amp, R = o.osc.base + o.osc.amp;
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = a * 0.55;
      ctx.strokeStyle = '#ff5fe0';
      ctx.lineWidth = clamp(0.06 * gs, 1, 4);
      ctx.beginPath(); ctx.moveTo(sx(L, zc), by); ctx.lineTo(sx(R, zc), by); ctx.stroke();
      ctx.lineWidth = clamp(0.04 * gs, 1, 3);
      ctx.beginPath();
      ctx.moveTo(sx(L, zc), by - 0.25 * gs); ctx.lineTo(sx(L, zc), by + 0.25 * gs);
      ctx.moveTo(sx(R, zc), by - 0.25 * gs); ctx.lineTo(sx(R, zc), by + 0.25 * gs);
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
    // warning ring pulsing on the road around its base
    ctx.globalCompositeOperation = 'lighter';
    glow(SPR.pink, bx, by, 1.5 * gs, 0.32 * gs, a * 0.6);
    const ring = (G.t * 1.6 + o.t) % 1;
    ctx.globalAlpha = a * (1 - ring) * 0.8;
    ctx.strokeStyle = '#ff5fe0';
    ctx.lineWidth = clamp(0.05 * gs, 1, 3);
    ctx.beginPath(); ctx.ellipse(bx, by, (0.7 + ring * 0.9) * gs, (0.7 + ring * 0.9) * gs * 0.16, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.globalCompositeOperation = 'source-over';
    if (0.9 * gs < 7) {
      // far away: a simple glowing spike is enough
      ctx.globalAlpha = a;
      ctx.fillStyle = '#5a1a8a';
      const hw = 0.34 * gs, ty = sy(o.h, zc);
      ctx.beginPath(); ctx.moveTo(bx - hw, by); ctx.lineTo(bx - hw * 0.75, sy(4.3, zc)); ctx.lineTo(bx, ty); ctx.lineTo(bx + hw * 0.75, sy(4.3, zc)); ctx.lineTo(bx + hw, by); ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#ff5fe0'; ctx.lineWidth = 1; ctx.stroke();
      ctx.globalAlpha = 1;
      return;
    }
    MT.x = o.x; MT.y = 0; MT.z = zc; MT.roll = 0; MT.pitch = 0; MT.yaw = o.t * 0.7; MT.scale = 1;
    if (!drawMesh(PYLON_MESH, MT, a, 0.045)) return;
    // energy rings sliding up the tower (only the half facing you)
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = '#ff7bf0';
    for (let i = 0; i < 3; i++) {
      const f = (G.t * 0.45 + i / 3 + o.t * 0.13) % 1;
      const y = 0.4 + f * 3.7, r = 0.42 - f * 0.11 + 0.03;
      ctx.globalAlpha = a * Math.sin(f * Math.PI) * 0.95;
      ctx.lineWidth = clamp(0.07 * gs, 1, 5);
      ctx.beginPath();
      for (let k = 0; k <= 12; k++) {
        const t = Math.PI * (k / 12);   // front half only
        const X = o.x + Math.cos(t) * r, Z = zc - Math.sin(t) * r;
        if (k === 0) ctx.moveTo(sx(X, Z), sy(y, Z)); else ctx.lineTo(sx(X, Z), sy(y, Z));
      }
      ctx.stroke();
    }
    // beacon blinking on the tip
    const bl = Math.sin(G.t * 6 + o.t * 3) > 0 ? 1 : 0.35;
    glow(SPR.pink, bx, sy(4.95, zc), 0.55 * gs, 0.55 * gs, a * bl);
    glow(SPR.white, bx, sy(4.95, zc), 0.18 * gs, 0.18 * gs, a * bl);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  } else if (o.type === 'wall') {
    ctx.globalCompositeOperation = 'lighter';
    const gs = FOCAL / Math.max(z, 1);
    glow(SPR.pink, sx(o.x, z), sy(0, z), (o.w * 0.7 + 0.5) * gs, 0.3 * gs, a * 0.45);
    ctx.globalCompositeOperation = 'source-over';
    const r = drawBox(o.x, 0, z, o.w, o.h, o.dep, WALL_C, a);
    if (!r) return;
    const fw = r.nxr - r.nxl, fh = r.nyb - r.nyt;
    // which way is the way through? (arrows on the barrier point to the gap)
    const touchL = o.x - o.w / 2 <= -TRACK_HALF + 0.05, touchR = o.x + o.w / 2 >= TRACK_HALF - 0.05;
    const dir = touchL && !touchR ? 1 : touchR && !touchL ? -1 : 0;
    ctx.save();
    ctx.beginPath(); ctx.rect(r.nxl, r.nyt, fw, fh); ctx.clip();
    ctx.globalAlpha = a;
    if (o.jump) {
      // up-arrows: you need the ramp to clear this one
      ctx.strokeStyle = RAMP_C;
      ctx.lineWidth = Math.max(1, 0.08 * r.s);
      const step = Math.max(14, 1.3 * r.s), lift = ((G.t * 1.5) % 1) * fh * 0.25;
      ctx.beginPath();
      for (let x = r.nxl + step / 2; x < r.nxr; x += step) {
        ctx.moveTo(x - fh * 0.22, r.nyt + fh * 0.72 - lift);
        ctx.lineTo(x, r.nyt + fh * 0.32 - lift);
        ctx.lineTo(x + fh * 0.22, r.nyt + fh * 0.72 - lift);
      }
      ctx.stroke();
    } else if (fh > 4) {
      // neon chevrons sliding toward the gap
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = 'rgba(255, 95, 224, 0.9)';
      ctx.lineWidth = Math.max(1, 0.1 * r.s);
      const step = Math.max(10, 0.9 * r.s), m = fh * 0.3;
      const off = dir ? ((G.t * 2.2) % 1) * step * dir : 0;
      const d2 = dir || 1;
      ctx.beginPath();
      for (let x = r.nxl - step + off; x < r.nxr + step; x += step) {
        if (dir) {
          ctx.moveTo(x - m * 0.6 * d2, r.nyt + fh * 0.2);
          ctx.lineTo(x + m * 0.6 * d2, r.nyt + fh * 0.5);
          ctx.lineTo(x - m * 0.6 * d2, r.nyt + fh * 0.8);
        } else {
          ctx.moveTo(x, r.nyb); ctx.lineTo(x + fh * 0.7, r.nyt);
        }
      }
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = a;
    // glowing top rail with running lights
    ctx.fillStyle = '#ffd0fb';
    ctx.fillRect(r.nxl, r.nyt, fw, Math.max(1, 0.06 * r.s));
    ctx.fillStyle = '#ff5fe0';
    ctx.fillRect(r.nxl, r.nyb - Math.max(1, 0.05 * r.s), fw, Math.max(1, 0.05 * r.s));
    if (r.s > 14) {
      ctx.globalCompositeOperation = 'lighter';
      const n = Math.max(2, Math.round(o.w / 1.2));
      for (let i = 0; i <= n; i++) {
        const on = ((i + Math.floor(G.t * 6)) % 3) === 0 ? 1 : 0.35;
        glow(SPR.pink, r.nxl + fw * (i / n), r.nyt, 0.22 * r.s, 0.22 * r.s, a * on);
      }
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.globalAlpha = 1;
  } else if (o.type === 'mine') {
    // a spiked, spinning space mine with a pulsing core (2 shots to pop)
    if (z < 1) return;
    const s = FOCAL / z;
    const y = 0.6 + Math.sin(o.t * 3) * 0.1;
    shadow(o.x, z, 0.32, a * 0.5);
    const px = sx(o.x, z), py = sy(y, z), R = 0.3 * s;
    const hot = o.flashT > 0;
    const beat = 0.5 + 0.5 * Math.sin(o.t * (o.hp < 2 ? 16 : 7));
    ctx.globalAlpha = a;
    // warning halo
    ctx.globalCompositeOperation = 'lighter';
    glow(SPR.orange, px, py, R * 2.6, R * 2.6, a * (0.35 + 0.25 * beat));
    ctx.globalCompositeOperation = 'source-over';
    // spikes (8 around, turning)
    const spin = o.t * 1.6;
    ctx.fillStyle = hot ? '#ffffff' : '#ff9a2e';
    ctx.beginPath();
    for (let k = 0; k < 8; k++) {
      const t = spin + k * Math.PI / 4;
      const c = Math.cos(t), sn = Math.sin(t), w = 0.28;
      const tilt = 0.75 + 0.25 * Math.cos(t * 2 + o.t);   // spikes going round the back look shorter
      ctx.moveTo(px + Math.cos(t - w) * R * 0.85, py + Math.sin(t - w) * R * 0.85);
      ctx.lineTo(px + c * R * 1.65 * tilt, py + sn * R * 1.65 * tilt);
      ctx.lineTo(px + Math.cos(t + w) * R * 0.85, py + Math.sin(t + w) * R * 0.85);
    }
    ctx.fill();
    // armored shell
    const shell = ctx.createRadialGradient(px - R * 0.35, py - R * 0.4, R * 0.1, px, py, R);
    shell.addColorStop(0, hot ? '#ffffff' : '#7a3a14');
    shell.addColorStop(1, hot ? '#ffd0a0' : '#200a04');
    ctx.fillStyle = shell;
    ctx.beginPath(); ctx.arc(px, py, R, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = COLORS.orange;
    ctx.lineWidth = clamp(0.05 * s, 1, 3);
    ctx.stroke();
    // seam band around the middle, turning with the spikes
    ctx.beginPath(); ctx.ellipse(px, py, R, R * 0.28, Math.sin(spin) * 0.3, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255, 170, 70, 0.7)'; ctx.stroke();
    // glowing core that beats faster once it's been hit
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = beat > 0.5 ? '#ffe08a' : COLORS.orange;
    ctx.beginPath(); ctx.arc(px, py, Math.max(1, R * (0.22 + 0.12 * beat)), 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    o.flashT = Math.max(0, (o.flashT || 0) - 1 / 60);
    ctx.globalAlpha = 1;
  }
}

function drawEnemy(e) {
  const z = e._z;
  if (z < 1) return;
  const a = fogA(z) * passFade(z + 0.6);
  if (a < 0.01) return;
  const s = FOCAL / z;
  const hitFlash = e.flashT > 0;
  if (e.type === 'drone') {
    shadow(e.x, z, 0.55, a * 0.35);
    const px = sx(e.x, z), py = sy(e.y, z);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(px, py);
    ctx.rotate(clamp((e.tx - e.x) * 0.12, -0.35, 0.35));
    ctx.scale(s, s);
    // glow
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255, 43, 78, 0.18)';
    ctx.beginPath(); ctx.ellipse(0, 0.05, 0.8, 0.3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    // wings
    ctx.beginPath();
    ctx.moveTo(-0.66, -0.02); ctx.lineTo(-0.22, -0.16); ctx.lineTo(0.22, -0.16); ctx.lineTo(0.66, -0.02);
    ctx.lineTo(0.24, 0.1); ctx.lineTo(-0.24, 0.1); ctx.closePath();
    ctx.fillStyle = hitFlash ? '#ffffff' : '#2a0712';
    ctx.fill();
    ctx.strokeStyle = COLORS.red; ctx.lineWidth = 0.035; ctx.stroke();
    // hanging pod
    ctx.beginPath();
    ctx.moveTo(-0.12, 0.08); ctx.lineTo(0.12, 0.08); ctx.lineTo(0.06, 0.34); ctx.lineTo(-0.06, 0.34); ctx.closePath();
    ctx.fillStyle = '#1a040b'; ctx.fill(); ctx.stroke();
    // eye
    const pulse = 0.7 + 0.3 * Math.sin(e.t * 8);
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255, 60, 90, ' + (0.5 * pulse).toFixed(2) + ')';
    ctx.beginPath(); ctx.arc(0, -0.03, 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = e.flashT > 0.1 ? '#fff' : '#ff7088';
    ctx.beginPath(); ctx.arc(0, -0.03, 0.08, 0, Math.PI * 2); ctx.fill();
    // thrusters
    ctx.fillStyle = 'rgba(255, 157, 46, 0.8)';
    ctx.beginPath(); ctx.arc(-0.42, 0.06, 0.05, 0, Math.PI * 2); ctx.arc(0.42, 0.06, 0.05, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    // spinning rotors on the wingtips
    for (const side of [-1, 1]) {
      const rx = side * 0.7;
      ctx.fillStyle = 'rgba(255, 90, 120, 0.16)';
      ctx.beginPath(); ctx.ellipse(rx, -0.1, 0.3, 0.07, 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255, 200, 210, 0.75)'; ctx.lineWidth = 0.025;
      const bl = Math.cos(e.t * 40 + side) * 0.3;
      ctx.beginPath(); ctx.moveTo(rx - bl, -0.1 - 0.03); ctx.lineTo(rx + bl, -0.1 + 0.03); ctx.stroke();
      ctx.fillStyle = '#ff2b4e';
      ctx.fillRect(rx - 0.03, -0.1, 0.06, 0.12);
    }
    ctx.restore();
  } else if (e.type === 'ram') {
    // headlight beams thrown on the road in front of it (toward you)
    if (z > 2.2) {
      const z2 = Math.max(1.05, z - 3.2);
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = a * 0.22;
      ctx.fillStyle = '#ff6a7e';
      ctx.beginPath();
      ctx.moveTo(sx(e.x - 0.18, z), sy(0, z)); ctx.lineTo(sx(e.x + 0.18, z), sy(0, z));
      ctx.lineTo(sx(e.x + 0.75, z2), sy(0, z2)); ctx.lineTo(sx(e.x - 0.75, z2), sy(0, z2));
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
    shadow(e.x, z, 0.42, a * 0.45);
    const px = sx(e.x, z), py = sy(e.y + Math.sin(e.t * 7) * 0.03, z);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(px, py);
    ctx.scale(s, s);
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255, 43, 78, 0.25)';
    ctx.beginPath(); ctx.ellipse(0, 0.38, 0.5, 0.1, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.beginPath();
    ctx.moveTo(0, -0.22); ctx.lineTo(0.36, 0.06); ctx.lineTo(0.22, 0.14); ctx.lineTo(-0.22, 0.14); ctx.lineTo(-0.36, 0.06);
    ctx.closePath();
    ctx.fillStyle = hitFlash ? '#fff' : '#300a1a';
    ctx.fill();
    ctx.strokeStyle = COLORS.red; ctx.lineWidth = 0.035; ctx.stroke();
    ctx.globalCompositeOperation = 'lighter';
    // ram plate spikes
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#ff2b4e';
    ctx.beginPath();
    for (const sx2 of [-0.24, -0.08, 0.08, 0.24]) { ctx.moveTo(sx2 - 0.05, 0.14); ctx.lineTo(sx2, 0.26); ctx.lineTo(sx2 + 0.05, 0.14); }
    ctx.fill();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = 'rgba(255, 230, 230, 0.95)';
    ctx.beginPath(); ctx.ellipse(-0.13, 0.05, 0.06, 0.035, 0, 0, Math.PI * 2); ctx.ellipse(0.13, 0.05, 0.06, 0.035, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255, 60, 90, 0.35)';
    ctx.beginPath(); ctx.ellipse(0, 0.04, 0.3, 0.12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();
  } else if (e.type === 'turret') {
    const r = drawBox(e.x, 0, z, 1.0, 0.7, 1.0, hitFlash ? { face: '#fff', side: '#fff', top: '#fff', edge: '#fff' } : TURRET_C, a);
    if (!r) return;
    const cxp = (r.nxl + r.nxr) / 2;
    const domeR = 0.3 * s;
    ctx.globalAlpha = a;
    ctx.fillStyle = '#3d0a18';
    ctx.strokeStyle = COLORS.red;
    ctx.lineWidth = clamp(0.04 * s, 1, 3);
    // barrel swings to follow you
    const aim = clamp((player.x - e.x) * 0.25, -0.9, 0.9);
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#2a0710';
    ctx.lineWidth = Math.max(2, 0.16 * s);
    ctx.beginPath(); ctx.moveTo(cxp, r.nyt - domeR * 0.4);
    ctx.lineTo(cxp + Math.sin(aim) * domeR * 1.3, r.nyt - domeR * 0.4 + Math.cos(aim) * domeR * 0.9); ctx.stroke();
    ctx.strokeStyle = COLORS.red;
    ctx.lineWidth = Math.max(1, 0.05 * s);
    ctx.stroke();
    ctx.lineCap = 'butt';
    ctx.fillStyle = '#3d0a18';
    ctx.beginPath();
    ctx.arc(cxp, r.nyt, domeR, Math.PI, 0);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.globalCompositeOperation = 'lighter';
    const charge = e.flashT > 0 ? 1 : 0.4 + 0.3 * Math.sin(e.t * 6);
    ctx.fillStyle = 'rgba(255, 80, 60, ' + charge.toFixed(2) + ')';
    ctx.beginPath(); ctx.arc(cxp, r.nyt - domeR * 0.45, Math.max(1.5, domeR * 0.3), 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }
}

function drawGate(g) {
  const z = g._z;
  if (z < 1 || g.alpha <= 0.01) return;
  const P = POWERS[g.type];
  const a = fogA(z) * g.alpha;
  const s = FOCAL / z;
  const xl = sx(g.x - g.w / 2, z), xr = sx(g.x + g.w / 2, z);
  const yb = sy(0, z), yt = sy(g.h, z);
  // the shimmering field you drive through
  ctx.globalAlpha = a * 0.2;
  ctx.fillStyle = P.color;
  ctx.fillRect(xl, yt, xr - xl, yb - yt);
  ctx.globalAlpha = a * 0.45;
  ctx.strokeStyle = P.color;
  ctx.lineWidth = Math.max(1, 0.03 * s);
  ctx.beginPath();
  const lines = 6;
  for (let i = 0; i < lines; i++) {
    const f = ((i / lines) + G.t * 0.6) % 1;
    const y = yb + (yt - yb) * f;
    ctx.moveTo(xl, y); ctx.lineTo(xr, y);
  }
  ctx.stroke();
  ctx.globalCompositeOperation = 'lighter';
  glow(SPR.white, (xl + xr) / 2, yb, (xr - xl) * 0.7, (xr - xl) * 0.12, a * 0.35);
  ctx.globalCompositeOperation = 'source-over';
  const postC = g.postC || (g.postC = { face: P.color, side: P.color, top: '#ffffff', edge: '#ffffff' });
  drawBox(g.x - g.w / 2, 0, z, 0.2, g.h, 0.2, postC, a);
  drawBox(g.x + g.w / 2, 0, z, 0.2, g.h, 0.2, postC, a);
  drawBox(g.x, g.h, z, g.w + 0.2, 0.22, 0.2, postC, a);
  // lights chasing round the frame
  ctx.globalCompositeOperation = 'lighter';
  const fh = yb - yt, fw2 = xr - xl, per = fh * 2 + fw2;
  const dot = Math.max(1.5, 0.09 * s);
  ctx.fillStyle = '#ffffff';
  ctx.globalAlpha = a * 0.9;
  for (let i = 0; i < 8; i++) {
    let u = (((i / 8) + G.t * 0.35) % 1) * per, px, py;
    if (u < fh) { px = xl; py = yb - u; } else if (u < fh + fw2) { px = xl + (u - fh); py = yt; } else { px = xr; py = yt + (u - fh - fw2); }
    ctx.fillRect(px - dot, py - dot, dot * 2, dot * 2);
  }
  // floating badge with a picture of the power-up (easy to read before you can read the word)
  if (s > 7) {
    const bob = Math.sin(G.t * 2.4 + g.x) * 0.12;
    const bcx = (xl + xr) / 2, bcy = sy(g.h + 0.95 + bob, z), br = 0.62 * s;
    ctx.globalAlpha = a * 0.35;
    ctx.fillStyle = P.color;
    ctx.beginPath(); ctx.arc(bcx, bcy, br * 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = a;
    hex(bcx, bcy, br, true, '#0b0420');
    ctx.lineWidth = Math.max(1.5, 0.07 * s);
    ctx.strokeStyle = P.color;
    ctx.stroke();
    powerIcon(g.type, bcx, bcy, br * 0.58, P.color, Math.max(1.2, 0.08 * s));
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = a;
  // label
  let fs = 0.48 * s;
  if (fs > 6) {
    ctx.font = '800 ' + fs.toFixed(1) + 'px ' + FONT;
    const label = powerLabel(g.type);
    const tw = ctx.measureText(label).width;
    const maxW = (xr - xl) * 0.86;
    if (tw > maxW) {
      fs *= maxW / tw;
      ctx.font = '800 ' + fs.toFixed(1) + 'px ' + FONT;
    }
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // dark plate behind the label so it's readable against any background
    const ly2 = sy(g.h * 0.55, z);
    const pw = Math.min(xr - xl - 4, ctx.measureText(label).width + fs * 0.8);
    ctx.globalAlpha = a * 0.75;
    ctx.fillStyle = '#0b0420';
    ctx.fillRect((xl + xr) / 2 - pw / 2, ly2 - fs * 0.75, pw, fs * 1.5);
    ctx.globalAlpha = a;
    ctx.strokeStyle = P.color;
    ctx.lineWidth = Math.max(1, fs * 0.06);
    ctx.strokeRect((xl + xr) / 2 - pw / 2, ly2 - fs * 0.75, pw, fs * 1.5);
    ctx.fillStyle = '#0b0420';
    ctx.fillText(label, (xl + xr) / 2 + fs * 0.06, sy(g.h * 0.55, z) + fs * 0.06);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(label, (xl + xr) / 2, sy(g.h * 0.55, z));
  }
  ctx.globalAlpha = 1;
}

// little pictures for each power-up, drawn in a box of radius r
function powerIcon(type, x, y, r, color, lw) {
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = color; ctx.fillStyle = color;
  ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.beginPath();
  if (type === 'shield') {
    ctx.moveTo(0, -r); ctx.lineTo(r * 0.85, -r * 0.6); ctx.lineTo(r * 0.7, r * 0.3); ctx.lineTo(0, r);
    ctx.lineTo(-r * 0.7, r * 0.3); ctx.lineTo(-r * 0.85, -r * 0.6); ctx.closePath(); ctx.stroke();
  } else if (type === 'weapon') {
    for (const ox of [-0.55, 0, 0.55]) {
      ctx.moveTo(ox * r, r * 0.8); ctx.lineTo(ox * r, -r * 0.3);
      ctx.moveTo(ox * r - r * 0.22, -r * 0.3); ctx.lineTo(ox * r, -r * 0.8); ctx.lineTo(ox * r + r * 0.22, -r * 0.3);
    }
    ctx.stroke();
  } else if (type === 'rapid') {
    ctx.moveTo(r * 0.25, -r); ctx.lineTo(-r * 0.55, r * 0.1); ctx.lineTo(0, r * 0.1); ctx.lineTo(-r * 0.25, r);
    ctx.lineTo(r * 0.55, -r * 0.1); ctx.lineTo(0, -r * 0.1); ctx.closePath(); ctx.fill();
  } else if (type === 'repair') {
    const t = r * 0.32;
    ctx.rect(-t, -r * 0.85, t * 2, r * 1.7); ctx.rect(-r * 0.85, -t, r * 1.7, t * 2); ctx.fill();
  } else if (type === 'missile') {
    // three little rockets climbing in a fan
    for (const [ox, rot] of [[-0.55, -0.35], [0, 0], [0.55, 0.35]]) {
      ctx.save();
      ctx.translate(ox * r, r * 0.15);
      ctx.rotate(rot);
      ctx.beginPath();
      ctx.moveTo(0, -r * 0.8); ctx.lineTo(r * 0.15, -r * 0.5); ctx.lineTo(r * 0.15, r * 0.3);
      ctx.lineTo(r * 0.28, r * 0.55); ctx.lineTo(-r * 0.28, r * 0.55); ctx.lineTo(-r * 0.15, r * 0.3);
      ctx.lineTo(-r * 0.15, -r * 0.5); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  } else if (type === 'mult') {
    const lbl = powerLabel('mult').split(' ')[0];
    ctx.font = '900 ' + (r * (lbl.length > 2 ? 1.1 : 1.25)).toFixed(1) + 'px ' + FONT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(lbl, 0, r * 0.08);
  }
  ctx.restore();
}

function drawShot(b) {
  const z = b._z;
  if (z < 1) return;
  const z2 = z + 2.4;
  const x1 = sx(b.x, z), y1 = sy(b.y, z);
  const x2 = sx(b.x + b.vx * 0.02 - b.turn * 2.4, z2), y2 = sy(b.y, z2);
  const lw = clamp((b.dmg > 1 ? 0.13 : 0.1) * FOCAL / z, 1, 8);
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = b.dmg > 1 ? 'rgba(255, 90, 220, 0.6)' : b.pierce ? 'rgba(120, 160, 255, 0.6)' : 'rgba(41, 243, 255, 0.55)';
  ctx.lineWidth = lw * 2;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.strokeStyle = b.dmg > 1 ? '#fff0fb' : '#e8ffff';
  ctx.lineWidth = lw * 0.6;
  ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
}

function drawMissile(m) {
  const z = m._z;
  if (z < 1 || m.wait > 0) return;
  const s = FOCAL / z;
  // smoke trail: newest point first, back through the history
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  let px = sx(m.x, z), py = sy(m.y, z);
  for (let i = 0; i < m.tn; i++) {
    const k = (m.tk - i + 8) % 8;
    const tz = m.td[k] - VIEW_D;
    if (tz < 1) break;
    const qx = sx(m.tx[k], tz), qy = sy(m.ty[k], tz);
    ctx.globalAlpha = 0.55 * (1 - i / 8);
    ctx.strokeStyle = i < 2 ? '#ffd08a' : '#ff7a3d';
    ctx.lineWidth = clamp(0.16 * FOCAL / tz, 2, 8) * (1 - i / 10);
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(qx, qy); ctx.stroke();
    px = qx; py = qy;
  }
  const hx = sx(m.x, z), hy = sy(m.y, z);
  ctx.globalAlpha = 1;
  const hr = Math.max(0.9 * s, 7);
  glow(SPR.orange, hx, hy, hr, hr, 1);
  glow(SPR.white, hx, hy, hr * 0.35, hr * 0.35, 1);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

function drawEShot(e) {
  const z = e._z;
  if (z < 1) return;
  const s = FOCAL / z;
  const a = fogA(z);
  shadow(e.x, z, 0.14, a * 0.5);
  const px = sx(e.x, z), py = sy(e.y, z);
  const r = Math.max(2.5, 0.2 * s);
  ctx.globalAlpha = a;
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = 'rgba(255, 70, 40, 0.35)';
  ctx.beginPath(); ctx.arc(px, py, r * 2.1, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255, 120, 60, 0.9)';
  ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff2c0';
  ctx.beginPath(); ctx.arc(px, py, r * 0.45, 0, Math.PI * 2); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

function drawPart(p) {
  const z = p._z;
  if (z < 0.8) return;
  const size = clamp(p.size * FOCAL / z, 1, 9);
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
  ctx.fillStyle = p.color;
  ctx.fillRect(sx(p.x, z) - size / 2, sy(p.y, z) - size / 2, size, size);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawStreaks() {
  const camD = VIEW_D;
  const base = clamp((G.speed - 24) / 60, 0, 0.6);
  if (base <= 0) return;
  const n = Math.min(streaks.length, QUAL.streaks);
  const railC = rgba(PAL.rail, 1);
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const s = streaks[i];
    const z = s.d - camD;
    if (z < 1) continue;
    const z2 = z + G.speed * (s.rail ? 0.09 : 0.06);
    ctx.globalAlpha = base * fogA(z) * (s.rail ? 1.3 : 1);
    ctx.strokeStyle = s.rail ? railC : '#d8c8ff';
    ctx.lineWidth = s.rail ? clamp(0.04 * FOCAL / z, 1, 3) : 1;
    ctx.beginPath();
    ctx.moveTo(sx(s.x, z), sy(s.y, z));
    ctx.lineTo(sx(s.x, z2), sy(s.y, z2));
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

// Light trails from the three engines, following where the speeder has been.
const TRZ = new Float32Array(TRAIL_N + 1), TRX = new Float32Array(TRAIL_N + 1), TRY = new Float32Array(TRAIL_N + 1);
function drawTrails() {
  if (!QUAL.trails || !player.alive) return;
  // collect the trail points once (newest first), stopping just in front of the camera
  let n = 0;
  TRZ[n] = VIEW_Z; TRX[n] = player.x; TRY[n] = player.y; n++;
  let lastZ = VIEW_Z;
  for (let i = 0; i < TRAIL_N; i++) {
    const k = (trailHead - i + TRAIL_N) % TRAIL_N;
    let z = trailD[k] - VIEW_D;
    if (z >= lastZ - 0.01) continue;
    if (z < 1.05) z = 1.05;
    TRZ[n] = z; TRX[n] = trailX[k]; TRY[n] = trailY[k]; n++;
    lastZ = z;
    if (z <= 1.05) break;
  }
  if (n < 2) return;
  const sp = clamp((G.speed - 28) / 60, 0, 1);
  ctx.globalCompositeOperation = 'lighter';
  ctx.fillStyle = trailGrad;
  for (let e = -1; e <= 1; e++) {
    // engine pods swing in and up/down as the speeder rolls
    const ex = e * SHIP_POD_X * SHIP_SCALE * Math.cos(player.bank), hw = e === 0 ? 0.04 : 0.045;
    const ey = e * SHIP_POD_X * SHIP_SCALE * Math.sin(-player.bank);
    ctx.globalAlpha = (0.22 + 0.4 * sp + 0.3 * G.kick) * (e === 0 ? 1 : 0.8);
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const w = hw * (1 - (i / n) * 0.4);
      const lift = ey * (1 - i / n);
      const x = sx(TRX[i] + ex - w, TRZ[i]), y = sy(0.44 + TRY[i] + lift, TRZ[i]);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    for (let i = n - 1; i >= 0; i--) {
      const w = hw * (1 - (i / n) * 0.4);
      ctx.lineTo(sx(TRX[i] + ex + w, TRZ[i]), sy(0.44 + TRY[i] + ey * (1 - i / n), TRZ[i]));
    }
    ctx.closePath();
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawPlayer() {
  if (!player.alive) return;
  const z = VIEW_Z;
  const s = FOCAL / z;
  const bob = Math.sin(G.t * 6) * 0.025;
  const px = sx(player.x, z), py = sy(0.42 + bob + player.y, z), gyy = sy(0, z);
  const air = clamp(1 - player.y / 3, 0.3, 1);   // shadow fades as you climb
  const blink = G.invuln > 0 && Math.floor(G.t * 18) % 2 === 0;
  const sp = clamp((G.speed - 28) / 60, 0, 1);

  // shadow + underglow on the track
  ctx.fillStyle = 'rgba(0, 0, 0, ' + (0.5 * air).toFixed(2) + ')';
  const thin = 0.45 + 0.55 * Math.cos(player.bank);   // rolled over = narrower shadow
  ctx.beginPath(); ctx.ellipse(px, gyy, 0.6 * s * air * thin, 0.09 * s * air, 0, 0, Math.PI * 2); ctx.fill();
  ctx.globalCompositeOperation = 'lighter';
  glow(SPR.cyan, px, gyy, 0.95 * s * air * thin, 0.18 * s * air, 0.5 * air);
  ctx.globalAlpha = 1;

  drawTrails();

  // the 3D speeder: it rolls into a steer, noses into the turn, and pitches on jumps
  MT.x = player.x; MT.y = 0.42 + bob + player.y; MT.z = z;
  MT.roll = -player.bank; MT.yaw = player.bank * 0.35;
  MT.pitch = SHIP_TILT - clamp(player.vy * 0.03, -0.18, 0.28);
  MT.scale = SHIP_SCALE;
  const baseA = blink ? 0.35 : 1;
  // hover pads glowing on the road under each engine pod
  ctx.globalCompositeOperation = 'lighter';
  for (const side of [-1, 1]) {
    const p = shipPoint(MT, side * SHIP_POD_X, 0, -0.1);
    const fl = 0.8 + 0.2 * Math.sin(G.t * 31 + side);
    glow(SPR.cyan, sx(p[0], p[2]), sy(0, p[2]), 0.42 * s * air, 0.09 * s * air, 0.6 * air * fl);
  }
  ctx.globalCompositeOperation = 'source-over';
  drawMesh(SHIP, MT, baseA, 0.013);
  // engines: glowing nozzles with flames streaming back toward you
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < SHIP_ENGINES.length; i++) {
    const E = SHIP_ENGINES[i];
    let p = shipPoint(MT, E[0], E[1], E[2]);
    const ex = sx(p[0], p[2]), ey = sy(p[1], p[2]), r = E[3] * SHIP_SCALE * FOCAL / p[2];
    const len = 0.25 + sp * 0.4 + G.kick * 0.35 + Math.sin(G.t * 47 + i * 2.1) * 0.04 + Math.random() * 0.06;
    p = shipPoint(MT, E[0], E[1], E[2] - len);
    const fx = sx(p[0], p[2]), fy = sy(p[1], p[2]);
    ctx.globalAlpha = baseA * 0.55;
    ctx.fillStyle = i === 2 ? '#ff4fdc' : '#29f3ff';
    flame(ex, ey, fx, fy, r * 1.15);
    ctx.globalAlpha = baseA * 0.95;
    ctx.fillStyle = '#e8ffff';
    flame(ex, ey, ex + (fx - ex) * 0.55, ey + (fy - ey) * 0.55, r * 0.55);
    glow(i === 2 ? SPR.pink : SPR.cyan, ex, ey, r * 1.9, r * 1.9, baseA * (0.6 + G.kick * 0.3));
    ctx.globalAlpha = baseA;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(ex, ey, r * 0.5, 0, Math.PI * 2); ctx.fill();
  }
  // blinking lights on the tips of the fins
  const tip = Math.sin(G.t * 5) > 0;
  for (const side of [-1, 1]) {
    const p = shipPoint(MT, side * (SHIP_POD_X + 0.11), 0.42, -0.62);
    glow((side < 0) === tip ? SPR.pink : SPR.cyan, sx(p[0], p[2]), sy(p[1], p[2]), 0.1 * s, 0.1 * s, baseA);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  // shield bubble
  if (G.shield > 0) {
    const pulse = 0.6 + 0.4 * Math.sin(G.t * 5);
    const by = sy(0.5 + bob + player.y, z);
    ctx.globalAlpha = 0.16 + 0.1 * pulse;
    ctx.fillStyle = COLORS.cyan;
    ctx.beginPath(); ctx.ellipse(px, by, 0.68 * s, 0.42 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.75;
    ctx.strokeStyle = COLORS.cyan;
    ctx.lineWidth = Math.max(1.5, (G.shield > 1 ? 0.035 : 0.018) * s);
    ctx.stroke();
    if (G.shield > 1) {
      ctx.globalAlpha = 0.4;
      ctx.beginPath(); ctx.ellipse(px, by, 0.76 * s, 0.48 * s, 0, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  // power-up ring bursting off the speeder
  if (G.pulse > 0) {
    const r = (0.45 + (1 - G.pulse) * 1.5) * s;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = G.pulse * 0.9;
    ctx.strokeStyle = G.pulseColor;
    ctx.lineWidth = Math.max(1.5, 0.07 * s * G.pulse);
    ctx.beginPath(); ctx.ellipse(px, py, r, r * 0.45, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
}
// a tapered flame from (ax, ay) to the tip (bx, by)
function flame(ax, ay, bx, by, w) {
  let nx = by - ay, ny = ax - bx;
  const l = Math.hypot(nx, ny) || 1;
  nx *= w / l; ny *= w / l;
  ctx.beginPath();
  ctx.moveTo(ax + nx, ay + ny); ctx.lineTo(bx, by); ctx.lineTo(ax - nx, ay - ny);
  ctx.closePath(); ctx.fill();
}

/* ---------- Tiny 3D model renderer ----------
   The speeder and the pylons are small 3D models (a few dozen flat-shaded faces),
   projected through the same camera as everything else. That's what lets the speeder
   really roll and turn when you steer, and lets pylons show their sides in a bend.
   Model space: x = right, y = up, z = forward (away from the camera). */
const LIGHT = (() => { const l = [0.45, 0.8, -0.4], m = Math.hypot(l[0], l[1], l[2]); return [l[0] / m, l[1] / m, l[2] / m]; })();

// faces: [vertex indices, color [r,g,b], edge color or null, flags]
//   flags: e = emissive (not shaded), d = double-sided, b = drawn on top of its neighbours
function makeMesh(verts, faces, center) {
  const nv = verts.length / 3;
  const m = {
    v: Float32Array.from(verts), nv,
    px: new Float32Array(nv), py: new Float32Array(nv), wz: new Float32Array(nv),
    rx: new Float32Array(nv), ry: new Float32Array(nv), rz: new Float32Array(nv),
    f: [], order: [],
  };
  const V = m.v;
  for (const [idx, col, edge, flags] of faces) {
    let cx = 0, cy = 0, cz = 0;
    for (const i of idx) { cx += V[i * 3]; cy += V[i * 3 + 1]; cz += V[i * 3 + 2]; }
    cx /= idx.length; cy /= idx.length; cz /= idx.length;
    // normal from the first three corners, flipped to point away from the part's center
    const a = idx[0] * 3, b = idx[1] * 3, c = idx[2] * 3;
    const ux = V[b] - V[a], uy = V[b + 1] - V[a + 1], uz = V[b + 2] - V[a + 2];
    const vx = V[c] - V[a], vy = V[c + 1] - V[a + 1], vz = V[c + 2] - V[a + 2];
    let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    const o = (flags && flags.o) || center;
    if (nx * (cx - o[0]) + ny * (cy - o[1]) + nz * (cz - o[2]) < 0) { nx = -nx; ny = -ny; nz = -nz; }
    const nl = Math.hypot(nx, ny, nz) || 1;
    m.f.push({
      idx, col, edge, n: [nx / nl, ny / nl, nz / nl], c: [cx, cy, cz],
      emit: !!(flags && flags.e), ds: !!(flags && flags.d), bias: (flags && flags.b) || 0,
      depth: 0, shade: 1, rn: [0, 0, 0],
    });
  }
  return m;
}

// Build a 6-sided prism/taper between two rings; returns new vertex start index.
function ringVerts(out, cx, cy, cz, r, n, axis, rot) {
  const start = out.length / 3;
  for (let k = 0; k < n; k++) {
    const t = (k / n) * Math.PI * 2 + (rot || 0);
    if (axis === 'y') out.push(cx + Math.cos(t) * r, cy, cz + Math.sin(t) * r);
    else out.push(cx + Math.cos(t) * r, cy + Math.sin(t) * r, cz);   // ring around the z axis
  }
  return start;
}
function ringSides(faces, a, b, n, col, edge, flags) {
  for (let k = 0; k < n; k++) {
    const k2 = (k + 1) % n;
    faces.push([[a + k, a + k2, b + k2, b + k], col, edge, flags]);
  }
}

const MT = { x: 0, y: 0, z: 0, roll: 0, yaw: 0, pitch: 0, scale: 1 };
// Transform, project, cull, sort and paint a model. Returns false if it was behind the camera.
function drawMesh(m, T, alpha, edgeW) {
  const V = m.v;
  const cr = Math.cos(T.roll), sr = Math.sin(T.roll);
  const cp = Math.cos(T.pitch), sp = Math.sin(T.pitch);
  const cyw = Math.cos(T.yaw), syw = Math.sin(T.yaw);
  const S = T.scale;
  for (let i = 0; i < m.nv; i++) {
    let x = V[i * 3] * S, y = V[i * 3 + 1] * S, z = V[i * 3 + 2] * S;
    // roll (around z), pitch (around x), yaw (around y)
    let x1 = x * cr - y * sr, y1 = x * sr + y * cr;
    let y2 = y1 * cp - z * sp, z2 = y1 * sp + z * cp;
    let x3 = x1 * cyw + z2 * syw, z3 = -x1 * syw + z2 * cyw;
    const X = T.x + x3, Y = T.y + y2, Z = T.z + z3;
    if (Z < 0.6) return false;
    m.rx[i] = X; m.ry[i] = Y; m.rz[i] = Z;
    m.px[i] = sx(X, Z); m.py[i] = sy(Y, Z);
  }
  // where the camera is, seen from the model (the road's bend shifts it sideways)
  const camX = cam.x - lx(T.z), camY = CAM_H + CAM_LIFT - ly(T.z);
  m.order.length = 0;
  for (const f of m.f) {
    // rotate the normal the same way
    const nx0 = f.n[0], ny0 = f.n[1], nz0 = f.n[2];
    const nx1 = nx0 * cr - ny0 * sr, ny1 = nx0 * sr + ny0 * cr;
    const ny2 = ny1 * cp - nz0 * sp, nz2 = ny1 * sp + nz0 * cp;
    const nx3 = nx1 * cyw + nz2 * syw, nz3 = -nx1 * syw + nz2 * cyw;
    // face center in the world
    let cx = 0, cy = 0, cz = 0;
    for (const i of f.idx) { cx += m.rx[i]; cy += m.ry[i]; cz += m.rz[i]; }
    const k = 1 / f.idx.length;
    cx *= k; cy *= k; cz *= k;
    const vx = camX - cx, vy = camY - cy, vz = -cz;
    let facing = nx3 * vx + ny2 * vy + nz3 * vz;
    let nx = nx3, ny = ny2, nz = nz3;
    if (facing <= 0) {
      if (!f.ds) continue;
      nx = -nx; ny = -ny; nz = -nz;
    }
    f.shade = 0.32 + 0.68 * Math.max(0, nx * LIGHT[0] + ny * LIGHT[1] + nz * LIGHT[2]);
    f.depth = vx * vx + vy * vy + vz * vz - f.bias;
    m.order.push(f);
  }
  m.order.sort((a, b) => b.depth - a.depth);
  const s = FOCAL / T.z;
  ctx.lineJoin = 'round';
  for (const f of m.order) {
    const idx = f.idx;
    ctx.beginPath();
    ctx.moveTo(m.px[idx[0]], m.py[idx[0]]);
    for (let j = 1; j < idx.length; j++) ctx.lineTo(m.px[idx[j]], m.py[idx[j]]);
    ctx.closePath();
    const c = f.col, sh = f.emit ? 1 : f.shade;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgb(' + ((c[0] * sh) | 0) + ',' + ((c[1] * sh) | 0) + ',' + ((c[2] * sh) | 0) + ')';
    ctx.fill();
    if (f.edge) {
      ctx.strokeStyle = f.edge;
      ctx.lineWidth = clamp(edgeW * s, 0.6, 3);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  return true;
}

/* ---------- The speeder model ----------
   A low arrowhead hull with a glass canopy, two engine pods on short wings and
   twin tail fins, so it reads clearly from behind even at speed. */
const SHIP_SCALE = 0.8;
const SHIP_TILT = -0.3;            // nose tipped up a little so the low camera can see its deck
const SHIP_POD_X = 0.43;            // engine pods, left and right of the hull
const SHIP = (() => {
  const v = [
    0, -0.02, 1.05,      // 0 nose
    -0.1, 0.08, 0.55,    // 1 front top L
    0.1, 0.08, 0.55,     // 2 front top R
    -0.16, 0.16, 0.05,   // 3 mid top L
    0.16, 0.16, 0.05,    // 4 mid top R
    -0.15, 0.15, -0.45,  // 5 rear top L
    0.15, 0.15, -0.45,   // 6 rear top R
    -0.24, -0.04, 0.05,  // 7 mid low L
    0.24, -0.04, 0.05,   // 8 mid low R
    -0.2, -0.06, -0.48,  // 9 rear low L
    0.2, -0.06, -0.48,   // 10 rear low R
    -0.12, -0.06, 0.55,  // 11 front low L
    0.12, -0.06, 0.55,   // 12 front low R
    // canopy
    0, 0.125, 0.44,      // 13 front
    -0.1, 0.165, 0.12,   // 14 left
    0.1, 0.165, 0.12,    // 15 right
    0, 0.29, -0.02,      // 16 top
    0, 0.16, -0.24,      // 17 back
    // racing stripe on the deck (sits just above the hull)
    -0.03, 0.095, 0.52, 0.03, 0.095, 0.52,   // 18, 19
    -0.03, 0.168, 0.05, 0.03, 0.168, 0.05,   // 20, 21
    -0.03, 0.158, -0.44, 0.03, 0.158, -0.44, // 22, 23
  ];
  const HULL_T = [70, 78, 190], HULL_S = [42, 40, 128], HULL_B = [16, 14, 46], REAR = [22, 18, 60];
  const CYAN = '#29f3ff', PINK = '#ff4fdc';
  const fc = [0, 0.04, 0.05];
  const f = [
    [[0, 2, 1], HULL_T, CYAN],
    [[1, 2, 4, 3], HULL_T, CYAN],
    [[3, 4, 6, 5], HULL_T, CYAN],
    [[0, 1, 11], HULL_S, CYAN], [[0, 12, 2], HULL_S, CYAN],
    [[1, 3, 7, 11], HULL_S, CYAN], [[2, 12, 8, 4], HULL_S, CYAN],
    [[3, 5, 9, 7], HULL_S, CYAN], [[4, 8, 10, 6], HULL_S, CYAN],
    [[0, 11, 12], HULL_B, null], [[11, 7, 8, 12], HULL_B, null], [[7, 9, 10, 8], HULL_B, null],
    [[5, 6, 10, 9], REAR, CYAN],
  ];
  const glass = [235, 80, 220], co = { o: [0, 0.12, 0.1], b: 8 };
  f.push([[13, 15, 16], glass, '#ffd6fb', co], [[13, 16, 14], glass, '#ffd6fb', co],
    [[14, 16, 17], [150, 50, 190], '#ffd6fb', co], [[16, 15, 17], [150, 50, 190], '#ffd6fb', co]);
  const stripeF = { e: true, b: 4, o: [0, -1, 0] };
  f.push([[18, 19, 21, 20], [255, 79, 220], null, stripeF], [[20, 21, 23, 22], [255, 79, 220], null, stripeF]);

  // engine pods: 6-sided, tapering to a point at the front
  const POD = [48, 44, 140], POD_E = CYAN;
  for (const side of [-1, 1]) {
    const cx = side * SHIP_POD_X, cy = 0.02;
    const rear = ringVerts(v, cx, cy, -0.52, 0.105, 6, 'z', Math.PI / 6);
    const front = ringVerts(v, cx, cy, 0.22, 0.09, 6, 'z', Math.PI / 6);
    const tip = v.length / 3; v.push(cx, cy, 0.52);
    const po = { o: [cx, cy, -0.1] };
    ringSides(f, rear, front, 6, POD, POD_E, po);
    for (let k = 0; k < 6; k++) f.push([[front + k, front + (k + 1) % 6, tip], POD, POD_E, po]);
    f.push([[rear, rear + 1, rear + 2, rear + 3, rear + 4, rear + 5], [14, 10, 34], CYAN, po]);
    // short wing joining pod and hull
    const w = v.length / 3;
    v.push(side * 0.2, 0.03, 0.22, side * 0.19, 0.03, -0.36, side * (SHIP_POD_X - 0.06), 0.05, -0.42, side * (SHIP_POD_X - 0.06), 0.05, 0.05);
    f.push([[w, w + 1, w + 2, w + 3], [92, 34, 150], PINK, { d: true }]);
    // swept tail fin on top of the pod
    const t = v.length / 3;
    const fx = cx + side * 0.01;
    v.push(fx, cy + 0.09, -0.08, fx, cy + 0.09, -0.5, fx + side * 0.1, cy + 0.4, -0.62, fx + side * 0.09, cy + 0.37, -0.4);
    f.push([[t, t + 1, t + 2, t + 3], [150, 36, 160], PINK, { d: true, b: 1 }]);
  }
  return makeMesh(v, f, fc);
})();
// engine nozzles in model space (x, y, z, radius): pods + the small center one
const SHIP_ENGINES = [[-SHIP_POD_X, 0.02, -0.53, 0.085], [SHIP_POD_X, 0.02, -0.53, 0.085], [0, 0.045, -0.49, 0.07]];

// a model-space point (with the speeder's current tilt) to world space, written into OUT3
const OUT3 = [0, 0, 0];
function shipPoint(T, x, y, z) {
  x *= T.scale; y *= T.scale; z *= T.scale;
  const cr = Math.cos(T.roll), sr = Math.sin(T.roll), cp = Math.cos(T.pitch), spp = Math.sin(T.pitch);
  const cyw = Math.cos(T.yaw), syw = Math.sin(T.yaw);
  const x1 = x * cr - y * sr, y1 = x * sr + y * cr;
  const y2 = y1 * cp - z * spp, z2 = y1 * spp + z * cp;
  OUT3[0] = T.x + x1 * cyw + z2 * syw; OUT3[1] = T.y + y2; OUT3[2] = T.z - x1 * syw + z2 * cyw;
  return OUT3;
}

/* ---------- Pylon model ----------
   A tapered six-sided tower on a wide base, with a collar and a spike on top.
   Glowing rings slide up it and a beacon blinks at the tip (drawn in drawObj). */
const PYLON_MESH = (() => {
  const v = [], f = [];
  const BASE = [40, 22, 70], SHAFT = [74, 28, 128], CAP = [120, 40, 170];
  const b0 = ringVerts(v, 0, 0, 0, 0.62, 6, 'y'), b1 = ringVerts(v, 0, 0.3, 0, 0.6, 6, 'y');
  const s0 = ringVerts(v, 0, 0.3, 0, 0.4, 6, 'y'), s1 = ringVerts(v, 0, 4.2, 0, 0.29, 6, 'y');
  const c0 = ringVerts(v, 0, 4.2, 0, 0.42, 6, 'y'), c1 = ringVerts(v, 0, 4.42, 0, 0.42, 6, 'y');
  const tip = v.length / 3; v.push(0, 4.95, 0);
  const ctr = [0, 2.3, 0];
  ringSides(f, b0, b1, 6, BASE, '#ffd23c');
  f.push([[b1, b1 + 1, b1 + 2, b1 + 3, b1 + 4, b1 + 5], [70, 40, 30], '#ffd23c', { o: [0, 0, 0] }]);
  ringSides(f, s0, s1, 6, SHAFT, '#ff5fe0');
  ringSides(f, c0, c1, 6, CAP, '#ffd0fb');
  f.push([[c0, c0 + 1, c0 + 2, c0 + 3, c0 + 4, c0 + 5], CAP, '#ffd0fb', { o: [0, 5, 0] }]);
  for (let k = 0; k < 6; k++) f.push([[c1 + k, c1 + (k + 1) % 6, tip], [200, 70, 220], '#ffd0fb', { o: [0, 4.3, 0] }]);
  return makeMesh(v, f, ctr);
})();

const drawList = [];
function drawWorld() {
  const camD = VIEW_D;
  PLAYER_ITEM._z = VIEW_Z;
  drawList.length = 0;
  for (const o of objs) {
    o._z = o.d - camD;
    if (o._z + o.dep > 0.9 && o._z < FAR) drawList.push(o);
  }
  for (const e of enemies) {
    if (e.mode === 'wait') continue;
    e._z = e.d - camD;
    if (e._z > 1 && e._z < FAR) drawList.push(e);
  }
  for (const g of gates) {
    g._z = g.d - camD;
    if (g._z > 1 && g._z < FAR) drawList.push(g);
  }
  for (const b of shots) { b._z = b.d - camD; if (b._z > 1 && b._z < FAR) drawList.push(b); }
  for (const s of eshots) { s._z = s.d - camD; if (s._z > 1 && s._z < FAR) drawList.push(s); }
  for (const m of missiles) { m._z = m.d - camD; if (m._z > 1 && m._z < FAR) drawList.push(m); }
  for (const p of parts) { p._z = p.d - camD; if (p._z > 0.8 && p._z < FAR) drawList.push(p); }
  if (player.alive) drawList.push(PLAYER_ITEM);
  // ramps sort by their far (top) edge, so you're drawn on top of a ramp you're riding
  drawList.sort((a, b) => (b.type === 'ramp' ? b._z + b.dep : b._z) - (a.type === 'ramp' ? a._z + a.dep : a._z));
  for (const it of drawList) {
    switch (it.kind) {
      case 'obj': drawObj(it); break;
      case 'enemy': drawEnemy(it); break;
      case 'gate': drawGate(it); break;
      case 'shot': drawShot(it); break;
      case 'eshot': drawEShot(it); break;
      case 'missile': drawMissile(it); break;
      case 'part': drawPart(it); break;
      case 'player': drawPlayer(); break;
    }
  }
}

// ---------- HUD ----------
function hex(x, y, r, filled, color) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 6 + i * Math.PI / 3;
    const px = x + Math.cos(a) * r, py = y + Math.sin(a) * r;
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.closePath();
  if (filled) { ctx.fillStyle = color; ctx.fill(); }
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function timerChip(x, y, label, color, frac) {
  ctx.font = '800 10px ' + FONT;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = color;
  ctx.fillText(label, x, y);
  const lw = ctx.measureText(label).width;
  ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
  ctx.fillRect(x + lw + 6, y - 2, 46, 4);
  ctx.fillStyle = color;
  ctx.fillRect(x + lw + 6, y - 2, 46 * frac, 4);
  return lw + 60;
}

function drawHUD() {
  // low-hull warning glow
  if (G.state === 'play' && G.hull === 1) {
    const a = 0.25 + 0.2 * Math.sin(G.t * 6);
    const vg = ctx.createRadialGradient(CX, H / 2, Math.min(W, H) * 0.35, CX, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, 'rgba(255, 30, 60, 0)');
    vg.addColorStop(1, 'rgba(255, 30, 60, ' + a.toFixed(2) + ')');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }
  if (G.flash > 0) {
    ctx.globalAlpha = G.flash * 0.45;
    ctx.fillStyle = G.flashColor;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  if (G.state !== 'play' && G.state !== 'dying') return;

  const top = SAFE_TOP + 12;
  const left = 16;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.font = '800 26px ' + FONT;
  ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
  const scoreText = Math.floor(G.score).toLocaleString();
  ctx.fillText(scoreText, left + 1, top + 2);
  ctx.fillStyle = '#ffffff';
  ctx.fillText(scoreText, left, top);
  const sw = ctx.measureText(scoreText).width;
  if (G.mult > 0) {
    // score multiplier badge: grows and pulses as it stacks
    const big = G.mx >= 4;
    const pulse = big ? 1 + 0.08 * Math.sin(G.t * 10) : 1;
    ctx.save();
    ctx.translate(left + sw + 10, top + 12);
    ctx.scale(pulse, pulse);
    ctx.font = '900 ' + (big ? 18 : 14) + 'px ' + FONT;
    ctx.textBaseline = 'middle';
    ctx.fillStyle = G.mx >= 8 ? COLORS.yellow : POWERS.mult.color;
    ctx.fillText('x' + G.mx, 0, 0);
    ctx.restore();
    ctx.textBaseline = 'top';
  }

  // leaderboard ladder: the next score to beat, so you can feel yourself climbing
  const nx = G.state === 'play' ? nextRung() : null;
  if (nx) {
    ctx.font = '700 10px ' + FONT;
    ctx.fillStyle = nx.color;
    ctx.globalAlpha = 0.85;
    ctx.fillText('▲ ' + nx.label + '  ' + nx.score.toLocaleString(), left, top + 31);
    ctx.globalAlpha = 1;
  }

  // hull + shield pips
  let x = left + 8;
  const py = top + 54;
  for (let i = 0; i < MAX_HULL; i++) {
    hex(x, py, 7, i < G.hull, COLORS.pink);
    x += 19;
  }
  for (let i = 0; i < G.shield; i++) {
    hex(x + 4, py, 7, true, COLORS.cyan);
    x += 19;
  }
  // gun level: 4 yellow bars, then 4 orange "overdrive" bars
  ctx.font = '800 10px ' + FONT;
  ctx.textBaseline = 'middle';
  ctx.fillStyle = COLORS.yellow;
  ctx.fillText('GUNS', x + 10, py);
  const gx = x + 10 + ctx.measureText('GUNS').width + 6;
  for (let i = 0; i < GUN_MAX; i++) {
    const on = i < G.weapon;
    ctx.fillStyle = !on ? 'rgba(255, 255, 255, 0.18)' : i < 4 ? COLORS.yellow : COLORS.orange;
    const tall = i >= 4 ? 12 : 10;
    ctx.fillRect(gx + i * 6 + (i >= 4 ? 3 : 0), py - tall / 2, 4, tall);
  }

  // timers
  let tx = left;
  const ty = py + 20;
  if (G.rapid > 0) tx += timerChip(tx, ty, 'RAPID', POWERS.rapid.color, G.rapid / 12);
  if (G.mult > 0) tx += timerChip(tx, ty, G.mx + 'X', POWERS.mult.color, G.mult / MULT_TIME);

  // speed (top right, under the sound button)
  ctx.textAlign = 'right';
  ctx.textBaseline = 'top';
  ctx.font = '800 15px ' + FONT;
  ctx.fillStyle = '#ffffff';
  ctx.fillText(Math.round(G.speed * UNIT_M * 3.6), W - 16, top + 44);
  ctx.font = '500 9px ' + FONT;
  ctx.fillStyle = '#cbb7ff';
  ctx.fillText('KM/H', W - 16, top + 62);

  // zone name when you cross into a new area
  if (G.zoneT > 0) {
    const a = clamp(G.zoneT / 0.6, 0, 1) * clamp((3 - G.zoneT) / 0.4, 0, 1);
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '500 10px ' + FONT;
    ctx.fillStyle = '#cbb7ff';
    // below the speeder, with the other helper text, so it never covers the road
    const zy = SHIP_Y + clamp((H - SHIP_Y) * 0.7, 100, 270);
    ctx.fillText('ZONE ' + (G.zoneIdx + 1), CX, zy - 19);
    ctx.font = '800 17px ' + FONT;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.fillText(G.zoneName, CX + 1, zy + 1);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(G.zoneName, CX, zy);
    ctx.globalAlpha = 1;
  }

  // Helper text lives BELOW the speeder. That part of the screen shows road you've
  // already passed, so nothing here can ever hide what's coming at you.
  const below = H - SHIP_Y;
  const chipY = SHIP_Y + clamp(below * 0.22, 34, 90);
  const toastY = SHIP_Y + clamp(below * 0.45, 64, 190);

  // jump barrier ahead: point at the ramp
  let jumpWall = null;
  if (G.state === 'play') {
    for (const o of objs) {
      const rel = o.d - G.d;
      if (o.jump && !o.hit && rel > 0 && rel < 190) { jumpWall = o; break; }
    }
  }

  // gate preview, so you can choose before the gates are close enough to read
  let next = null;
  for (const g of (G.state === 'play' ? gates : [])) {
    const rel = g.d - G.d;
    if (!g.pair.resolved && rel > 6 && rel < 200) { next = g.pair; break; }
  }
  const plate = (label, color, x0, w, alpha) => {
    ctx.globalAlpha = 0.85 * alpha;
    ctx.fillStyle = 'rgba(11, 4, 32, 0.75)';
    ctx.fillRect(x0, chipY - 14, w, 28);
    ctx.globalAlpha = (0.75 + 0.25 * Math.sin(G.t * 8)) * alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.5;
    ctx.strokeRect(x0, chipY - 14, w, 28);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.textAlign = 'center';
    ctx.fillText(label, x0 + w / 2, chipY + 1);
    ctx.globalAlpha = 1;
  };
  if (next) {
    const [gl, gr] = next.gates[0].x < next.gates[1].x ? next.gates : [next.gates[1], next.gates[0]];
    // which one are you lined up with right now? that side lights up
    const side = player.x < -0.3 ? -1 : player.x > 0.3 ? 1 : 0;
    ctx.font = '800 13px ' + FONT;
    ctx.textBaseline = 'middle';
    const lt = '◀ ' + powerLabel(gl.type), rt = powerLabel(gr.type) + ' ▶';
    const lw = ctx.measureText(lt).width + 22, rw = ctx.measureText(rt).width + 22;
    plate(lt, POWERS[gl.type].color, 12, lw, side === 1 ? 0.55 : 1);
    plate(rt, POWERS[gr.type].color, W - 12 - rw, rw, side === -1 ? 0.55 : 1);
  } else if (jumpWall && player.y <= 0.05) {
    const label = '▲ HIT THE RAMP';
    ctx.font = '800 13px ' + FONT;
    ctx.textBaseline = 'middle';
    const w = ctx.measureText(label).width + 22;
    plate(label, RAMP_C, CX - w / 2, w, 1);
  }

  // toast (power-up taken, new best, ...)
  if (G.toastT > 0) {
    const t = G.toastT;
    const a = clamp(t / 0.4, 0, 1);
    const sc = 1 + Math.max(0, t - (G.toastSub ? 1.7 : 1.2)) * 2;
    ctx.save();
    ctx.translate(CX, toastY);
    ctx.scale(sc, sc);
    ctx.globalAlpha = a;
    ctx.font = '800 24px ' + FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
    ctx.fillText(G.toast, 2, 3);
    ctx.fillStyle = G.toastColor;
    ctx.fillText(G.toast, 0, 0);
    if (G.toastSub) {
      ctx.font = '800 12px ' + FONT;
      ctx.fillStyle = '#ffffff';
      ctx.fillText(G.toastSub, 0, 24);
    }
    ctx.restore();
  }

  // score popups
  ctx.font = '800 14px ' + FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const p of popups) {
    ctx.globalAlpha = clamp(1 - p.t / 0.9, 0, 1);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y - p.t * 50);
  }
  ctx.globalAlpha = 1;

  // first-run steering hint
  if (G.state === 'play' && !G.dragged && G.runT < 6) {
    const a = 0.6 + 0.4 * Math.sin(G.t * 5);
    const hx = CX + Math.sin(G.t * 2.5) * 40;
    ctx.globalAlpha = a;
    ctx.font = '800 14px ' + FONT;
    ctx.fillStyle = '#ffffff';
    ctx.fillText('◀  DRAG TO STEER  ▶', CX, H * 0.88);
    ctx.beginPath();
    ctx.arc(hx, H * 0.88 + 30, 12, 0, Math.PI * 2);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function render() {
  ctx.save();
  // lean the camera into turns, pivoting around the speeder so it stays easy to track
  if (Math.abs(ROLL) > 0.0005) {
    ctx.translate(CX, SHIP_Y);
    ctx.rotate(ROLL);
    ctx.translate(-CX, -SHIP_Y);
  }
  if (G.shake > 0 && SET.shake) {
    const m = G.shake * 7;
    ctx.translate(rand(-m, m), rand(-m, m));
  }
  drawSky();
  drawGround();
  drawScenery();
  drawStreaks();
  drawWorld();
  ctx.restore();
  drawHUD();
}

// ---------- Sound (all generated, no audio files) ----------
const AU = { ctx: null, master: null, noise: null, engOsc: null, engGain: null, engFilter: null, lastShot: 0, lastTick: 0 };
function masterLevel() { return SET.sound ? (SET.volume / 100) * 0.85 : 0; }

function audioInit() {
  if (AU.ctx) {
    if (AU.ctx.state === 'suspended') AU.ctx.resume();
    return;
  }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    AU.ctx = new AC();
    AU.master = AU.ctx.createGain();
    AU.master.gain.value = masterLevel();
    AU.master.connect(AU.ctx.destination);
    const len = AU.ctx.sampleRate;
    AU.noise = AU.ctx.createBuffer(1, len, AU.ctx.sampleRate);
    const data = AU.noise.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    AU.engOsc = AU.ctx.createOscillator();
    AU.engOsc.type = 'sawtooth';
    AU.engOsc.frequency.value = 50;
    AU.engFilter = AU.ctx.createBiquadFilter();
    AU.engFilter.type = 'lowpass';
    AU.engFilter.frequency.value = 300;
    AU.engGain = AU.ctx.createGain();
    AU.engGain.gain.value = 0;
    AU.engOsc.connect(AU.engFilter);
    AU.engFilter.connect(AU.engGain);
    AU.engGain.connect(AU.master);
    AU.engOsc.start();
  } catch (e) {
    AU.ctx = null;
  }
}

function tone(f1, f2, dur, type, vol, delay) {
  if (!AU.ctx || !SET.sound) return;
  const t0 = AU.ctx.currentTime + (delay || 0);
  const o = AU.ctx.createOscillator();
  const g = AU.ctx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f1, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g);
  g.connect(AU.master);
  o.start(t0);
  o.stop(t0 + dur + 0.02);
}

function noiseBurst(dur, vol, freq) {
  if (!AU.ctx || !SET.sound) return;
  const t0 = AU.ctx.currentTime;
  const src = AU.ctx.createBufferSource();
  src.buffer = AU.noise;
  const f = AU.ctx.createBiquadFilter();
  f.type = 'lowpass';
  f.frequency.setValueAtTime(freq, t0);
  f.frequency.exponentialRampToValueAtTime(60, t0 + dur);
  const g = AU.ctx.createGain();
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f);
  f.connect(g);
  g.connect(AU.master);
  src.start(t0, Math.random() * 0.5);
  src.stop(t0 + dur + 0.05);
}

const sfx = {
  shoot() {
    if (!AU.ctx) return;
    const now = AU.ctx.currentTime;
    if (now - AU.lastShot < 0.11) return;
    AU.lastShot = now;
    tone(1400, 600, 0.05, 'square', 0.02);
  },
  tick() { tone(500, 260, 0.04, 'square', 0.025); },
  pop() { noiseBurst(0.25, 0.25, 2500); },
  boom() { noiseBurst(0.5, 0.4, 1800); tone(140, 40, 0.4, 'sawtooth', 0.12); },
  bigBoom() { noiseBurst(1.2, 0.6, 1400); tone(110, 30, 1.0, 'sawtooth', 0.2); },
  hurt() { noiseBurst(0.35, 0.45, 900); tone(220, 60, 0.3, 'sawtooth', 0.15); },
  shield() { tone(900, 300, 0.25, 'triangle', 0.15); tone(1300, 500, 0.2, 'sine', 0.08); },
  zap() { tone(700, 200, 0.14, 'sawtooth', 0.025); },
  jump() { tone(300, 900, 0.22, 'triangle', 0.14); tone(450, 1300, 0.18, 'sine', 0.06, 0.04); },
  land() { noiseBurst(0.18, 0.25, 700); tone(160, 70, 0.15, 'sine', 0.15); },
  power() {
    [523, 659, 784, 1046].forEach((f, i) => tone(f, f * 1.01, 0.12, 'triangle', 0.12, i * 0.06));
  },
  swarm() { tone(180, 900, 0.35, 'sawtooth', 0.06); noiseBurst(0.4, 0.2, 3000); },
  launch() {
    if (!AU.ctx) return;
    const now = AU.ctx.currentTime;
    if (now - (AU.lastLaunch || 0) < 0.04) return;
    AU.lastLaunch = now;
    noiseBurst(0.16, 0.12, 4000); tone(600, 1500, 0.12, 'triangle', 0.035);
  },
  wing() { noiseBurst(0.12, 0.08, 4000); tone(700, 1600, 0.1, 'triangle', 0.03); },
  // passing someone on the leaderboard during a run
  pass() { tone(880, 880, 0.08, 'square', 0.04); tone(1320, 1320, 0.12, 'square', 0.04, 0.08); },
  // big moments: new best, world rank, challenge beaten
  fanfare() {
    [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, f, 0.18, 'square', 0.05, i * 0.09));
    [1046, 1318, 1568].forEach((f, i) => tone(f, f * 1.005, 0.5, 'triangle', 0.09, 0.5 + i * 0.02));
  },
};

function audioEngine() {
  if (!AU.ctx || !AU.engGain) return;
  const t = AU.ctx.currentTime;
  const on = (G.state === 'play') && !paused && SET.sound && SET.engine;
  AU.engGain.gain.setTargetAtTime(on ? 0.05 : 0, t, 0.1);
  AU.engOsc.frequency.setTargetAtTime(40 + G.speed * 0.9 + Math.abs(player.vx) * 2, t, 0.1);
  AU.engFilter.frequency.setTargetAtTime(220 + G.speed * 5, t, 0.1);
}

function applySound() {
  if (AU.master) AU.master.gain.value = masterLevel();
  $('mute').classList.toggle('off', !SET.sound || SET.volume === 0);
}

// ---------- Panels (menu, settings, leaderboard, game over) ----------
// "ui" is the panel currently on screen, or null while racing / on the title screen.
let ui = null;
const panelStack = [];
const PANELS = ['menu', 'settings', 'board', 'over', 'title'];
const show = (id) => $(id).classList.remove('hidden');
const hide = (id) => $(id).classList.add('hidden');
const isShown = (id) => !$(id).classList.contains('hidden');

function openPanel(id) {
  const cur = PANELS.find((p) => p !== id && isShown(p));
  if (cur) {
    panelStack.push(cur);
    hide(cur);
  }
  show(id);
  ui = id;
  if (id === 'settings') fillSettings();
  if (id === 'board') loadBoard(boardTab);
}

function closePanel() {
  if (!ui) return;
  hide(ui);
  const prev = panelStack.pop();
  if (prev) show(prev);
  ui = prev && prev !== 'title' ? prev : null;
}

function clearPanels() {
  for (const p of PANELS) hide(p);
  panelStack.length = 0;
  ui = null;
}

function openMenu() {
  if (G.state !== 'play' || ui) return;

// ---------- Leaderboard: this device ----------
function localBoard() {
  try {
    const rows = JSON.parse(storeGet('speeder.local') || '[]');
    return Array.isArray(rows) ? rows : [];
  } catch (e) {
    return [];
  }
}
function addLocalRun(run) {
